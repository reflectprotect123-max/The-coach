<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>THE Hybrid — Coach</title>
<link rel="stylesheet" href="strength-builder.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Screenshot-clone chrome — Hybrid labels only */
:root{
  --th-blue:#2563eb;--th-blue-hover:#1d4ed8;--th-blue-deep:#1e40af;
  --color-copper:#d4a574;--color-copper-bright:#e8c49a;
  --color-bg-deep:#000000;--color-bg-panel:#ffffff;--line:#e6e8eb;
  --bg:#ffffff;--panel:#ffffff;--panel2:#f4f6f8;--panel3:#ffffff;
  --text:#111418;--muted:#5c6570;--dim:#8a9299;
  --copper:var(--th-blue);--copper2:var(--th-blue-hover);
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --coach-nav-bg:#000000;--coach-header-bg:#000000;
  --coach-main-bg:#f4f6f8;--coach-main-text:#111418;--coach-main-muted:#5c6570;
  --coach-card-bg:#ffffff;--coach-card-border:#e6e8eb;
  --coach-nav-active:rgba(255,255,255,.12);--coach-link:var(--th-blue);
  --coach-rail-width:64px;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --font-display:"Inter",ui-sans-serif,system-ui,sans-serif;
  --tap:40px;--r:8px;--r-lg:10px;--ease:160ms ease;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --focus:0 0 0 2px #fff,0 0 0 4px rgba(37,99,235,.45);
  --shadow:0 8px 24px rgba(17,20,24,.08);
  --zone:#2563eb;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;font-family:var(--font-body);min-height:100%;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
h1,h2,h3,p{margin:0}
a{color:var(--coach-link)}
.hidden{display:none !important}

/* shared page chrome */
.page-intro{margin-bottom:18px}
.page-intro .eyebrow{margin-bottom:6px}
.page-intro h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:.01em;color:var(--coach-main-text)}
.page-intro .lede{margin-top:8px;color:var(--coach-main-muted);font-size:13px;line-height:1.5;max-width:54ch}
.page-back{margin-bottom:4px}
.toolbar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar-row .field{margin:0;flex:1;min-width:180px}
.empty-panel{padding:22px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.empty-panel .eyebrow{margin-bottom:6px}
.empty-panel h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:2px}
.empty-panel .muted{margin-top:8px}
.empty-panel .empty-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.err-card{margin-top:12px;padding:12px 14px;border:1px solid var(--bad);border-radius:var(--r);background:rgba(208,137,125,.08);color:var(--text);font-size:13px;line-height:1.45}
.check-row{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin-bottom:12px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
.check-row input{width:auto;accent-color:var(--copper)}
.fade-in{animation:coachFade .35s var(--ease) both}
@keyframes coachFade{from{opacity:0}to{opacity:1}}

/* gate */
#gate{max-width:440px;margin:0 auto;padding:48px 20px;background:var(--bg);color:var(--text);min-height:100vh}
.mark{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:800;letter-spacing:.04em;font-size:14px;flex-shrink:0}
.acct{display:grid;gap:8px;margin-top:18px}
.acct button{text-align:left;color:var(--text)}
#gate .btn{min-height:var(--tap);padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);font-weight:650;color:var(--text);transition:border-color var(--ease),background var(--ease),color var(--ease),transform var(--ease)}
#gate .btn:hover{border-color:rgba(212,165,116,.35)}
#gate .btn.primary{border-color:var(--th-blue);background:var(--th-blue);color:#fff}
#gate .btn.primary:hover{background:var(--copper2);border-color:var(--copper2)}
#gate .field{margin-top:12px}
#gate label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#gate input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel3);color:var(--text);transition:border-color var(--ease)}
#gate input:hover{border-color:rgba(255,255,255,.14)}
#gate .muted{color:var(--muted);font-size:13px;line-height:1.45}
#gate .gate-title{margin-top:28px;font-family:var(--font-display);font-size:clamp(34px,6vw,42px);font-weight:600;letter-spacing:.01em;line-height:1.05}

/* shell — slim black icon rail + black header + light canvas */
#coachApp.coach-shell{display:grid;grid-template-columns:var(--coach-rail-width) 1fr;min-height:100vh;background:var(--coach-main-bg)}
.coach-side.coach-rail-slim,.coach-side{display:flex;flex-direction:column;padding:12px 8px;background:var(--coach-nav-bg);color:#fff;min-height:100vh;width:var(--coach-rail-width)}
.coach-brand{display:grid;place-items:center;padding:8px 0 16px}
.coach-brand b,.coach-brand .sub{display:none}
.coach-side nav{display:grid;align-content:start;gap:4px;flex:0;margin-top:4px}
.coach-side nav button,.coach-side .nav-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;min-height:54px;padding:6px 2px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.8);font-size:10px;text-align:center}
.coach-side nav button .nav-label,.coach-side .nav-soon .nav-label{position:static;width:auto;height:auto;overflow:visible;clip:auto;line-height:1.1;max-width:52px}
.coach-side nav button.on{background:var(--coach-nav-active);color:#fff}
.coach-side nav button:hover:not(.on):not(:disabled){background:rgba(255,255,255,.08);color:#fff}
.coach-side nav button:disabled,.coach-side .nav-soon{opacity:.42;cursor:not-allowed}
.nav-ico{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.coach-side-foot{margin-top:auto;padding-top:10px;display:grid;gap:4px}
.coach-side-foot button,.coach-side-foot a.btn{display:grid;place-items:center;width:100%;min-height:36px;padding:6px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.45);font-size:9px;text-align:center}
.coach-side-foot button:hover,.coach-side-foot a.btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.coach-side-foot .dev-tool{display:none!important}

.coach-workspace{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.coach-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;min-height:56px;background:var(--coach-header-bg);color:#fff}
.coach-header-title{font-size:15px;font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.coach-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.coach-header-actions .btn-assist{min-height:36px;padding:8px 14px;border:0;border-radius:6px;background:var(--th-blue);color:#fff;font-size:12px;font-weight:650;opacity:1;cursor:not-allowed}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.7);cursor:not-allowed;opacity:1}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75}
.icon-btn .badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#fff;color:#111;font-size:9px;font-weight:800;line-height:16px;text-align:center}
.coach-avatar{width:32px;height:32px;border-radius:999px;border:0;background:#3f3f46;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}

.coach-body{display:grid;flex:1;grid-template-columns:1fr;background:var(--coach-main-bg)}
.coach-body.has-rail{grid-template-columns:1fr 280px}
.coach-main{padding:20px 28px 48px;color:var(--coach-main-text);min-width:0;background:var(--coach-main-bg)}
.coach-rail{padding:20px 16px;border-left:1px solid var(--line);background:#fff;min-width:0}

/* main primitives */
.eyebrow{color:var(--copper);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.muted{color:var(--coach-main-muted);font-size:13px;line-height:1.45}
.coach-main h1,.coach-main h2{color:var(--coach-main-text)}
.coach-main h1{font-family:var(--font-display);font-size:28px;font-weight:600;letter-spacing:.01em}
.btn{min-height:var(--tap);padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:600;color:var(--text);transition:border-color var(--ease),background var(--ease),color var(--ease),opacity var(--ease);touch-action:manipulation}
.btn:hover:not(:disabled){border-color:#c5c9ce;background:#fafbfc}
.btn.primary{border-color:var(--th-blue);background:var(--th-blue);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--th-blue-hover);border-color:var(--th-blue-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--th-blue)}
.btn.ghost:hover:not(:disabled){background:rgba(37,99,235,.06);border-color:transparent}
.btn.danger,.btn.ghost.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.small{min-height:var(--tap);min-width:var(--tap);padding:10px 12px;font-size:13px}
.btn:disabled,.btn[disabled]{opacity:.42;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);transition:border-color var(--ease)}
input:hover,select:hover,textarea:hover{border-color:#c5c9ce}
textarea{min-height:88px;resize:vertical}
.prep-textarea,.block-card.block-text textarea{min-height:200px;resize:vertical;line-height:1.45}
label{display:block;margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.field{margin-top:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;transition:border-color var(--ease),box-shadow var(--ease)}
.card.interactive:hover,.feed-card:hover{border-color:#d0d4d8;box-shadow:var(--shadow)}
.th-table,.data-table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.th-table th,.data-table th,.th-table td,.data-table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;color:var(--text)}
.th-table th,.data-table th{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
.th-table tbody tr:hover,.data-table tbody tr:hover{background:#f7f9fb}
.th-table tbody tr.selected,.data-table tbody tr.selected{background:#eff6ff}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:0}
.table-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-top:0;color:var(--muted);font-size:12px}
.session-comment-bar{display:block;width:100%;margin-top:14px;min-height:44px;border:0;border-radius:4px;background:var(--th-blue);color:#fff;font-weight:650;letter-spacing:.02em}
.session-comment-bar:hover{background:var(--th-blue-hover)}
.filter-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;min-height:40px}
.welcome-h{font-size:13px;font-weight:600;color:#fff}
.pill{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.03)}
.pill.ok{border-color:rgba(125,186,154,.45);color:var(--ok)}
.pill.warn{border-color:rgba(212,163,91,.45);color:var(--warn)}
.slice-stub{display:grid;place-items:center;min-height:280px;text-align:center;gap:8px}
.slice-stub b{font-family:var(--font-display);font-size:22px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar select{width:auto;min-width:160px}
.home-toolbar-actions{display:flex;align-items:center;gap:6px;position:relative}
.home-icon-button{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted)}
.home-icon-button:hover{color:var(--text);border-color:#c5c9ce}
.home-icon-button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-date-nav{display:flex;align-items:center;gap:6px}
.home-date-label{min-width:154px;text-align:center;font-size:13px;font-weight:600}
.home-date-popover{position:absolute;top:46px;right:0;z-index:35;width:520px;padding:14px;border:1px solid var(--line);background:#fff;box-shadow:0 14px 34px rgba(17,20,24,.18)}
.home-months{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.home-month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px;font-weight:700}
.home-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.home-month-grid .dow{font-size:9px;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.home-month-grid button,.home-month-grid span{display:grid;place-items:center;min-height:28px;border:0;background:transparent;color:var(--text);font-size:11px}
.home-month-grid button:hover{background:#eef2ff;color:var(--th-blue)}
.home-month-grid button.selected{background:var(--th-blue);color:#fff;border-radius:50%}
.home-empty{min-height:360px;display:grid;place-items:center;text-align:center}
.home-empty-icon{font-size:62px;line-height:1;color:#f2c100;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.metrics.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.feed-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 12px;margin-top:14px}
.feed-metrics .metric{text-align:center;padding:8px 4px;min-width:0;display:flex;flex-direction:column;align-items:center}
.feed-metrics .metric b{display:block;font-family:var(--font-display);font-size:clamp(16px,2.2vw,20px);font-weight:600;color:var(--coach-main-text);line-height:1.15}
.feed-metrics .metric span{display:block;margin-top:4px;color:var(--coach-main-muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.feed-metrics .metric--blocks{gap:0;justify-content:flex-start}
.feed-metrics .metric--blocks .ring,.feed-metrics .metric-icon{width:44px;height:44px;margin:0 0 10px;flex-shrink:0}
.feed-metrics .metric-icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#111418}
.feed-metrics .metric-icon.missing{color:#b1b1b1}
.metric{text-align:center;padding:10px 4px}
.metric b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--coach-main-text)}
.metric span{color:var(--coach-main-muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ring{width:42px;height:42px;margin:0 auto 4px}
.dateh{margin:22px 0 10px;font-family:var(--font-display);font-size:20px;letter-spacing:.02em;color:var(--coach-main-text)}
.feed-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.feed-athlete{display:flex;align-items:flex-start;gap:10px}
.athlete-avatar{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#3f3f46;color:#fff;font-size:11px;font-weight:700;text-transform:uppercase}
.athlete-link{display:block;padding:0;border:0;background:transparent;color:var(--th-blue);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-align:left}
.athlete-link:hover{text-decoration:underline;text-underline-offset:3px}
.new-athlete{margin-left:4px;color:#f59e0b;letter-spacing:0;text-transform:none}
.review-block{margin-top:10px;padding:13px 14px;border-top:1px solid var(--line);background:#fff}
.review-block-head{display:flex;align-items:flex-start;gap:10px}
.review-status{display:grid;place-items:center;width:22px;height:22px;border:2px solid #c8cdd3;border-radius:50%;color:#fff;font-size:11px;font-weight:800;flex:0 0 22px}
.review-status.done{background:#16a34a;border-color:#16a34a}
.review-status.partial{background:#f59e0b;border-color:#f59e0b}
.review-block-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.review-exercise{display:grid;grid-template-columns:32px 1fr;gap:8px;margin-top:9px;font-size:12px;line-height:1.45}
.review-letter{font-weight:800;color:var(--text)}
.review-actual{font-weight:700;color:var(--text)}
.review-for-completion{display:inline-block;margin-top:4px;color:var(--th-blue);font-size:10px;font-weight:700;text-transform:uppercase}
.presc{text-decoration:line-through;color:var(--dim)}
.actual{color:var(--copper2);font-weight:600}
.grid7{display:grid;grid-template-columns:88px repeat(7,1fr);gap:6px;align-items:stretch}
.cell{min-height:72px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;font-size:12px;color:var(--text)}
.cell.empty{color:var(--dim)}
.wk{display:grid;place-items:center;color:var(--muted);font-size:12px}
.cal{display:grid;gap:8px}
.item{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;width:100%;color:var(--text)}

/* session builder */
.lib-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:16px}
.lib-tabs button{min-height:var(--tap);padding:10px 14px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--ease),border-color var(--ease);touch-action:manipulation}
.lib-tabs button:hover{color:var(--text)}
.lib-tabs button.on{color:var(--th-blue);border-bottom-color:var(--th-blue)}
.lib-tabs button:disabled{opacity:.4;cursor:not-allowed}
.builder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.builder-title{font-family:var(--font-display);font-size:28px;font-weight:600;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0;width:min(100%,520px);color:var(--text)}
.builder-title:focus{border-bottom-color:var(--copper);outline:none}
.builder-title:focus-visible{box-shadow:var(--focus);border-radius:4px}
.builder-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.instructions-box{position:relative}
.instructions-box textarea{min-height:120px}
.char-count{position:absolute;top:8px;right:10px;font-size:11px;color:var(--dim)}
.block-card{margin-top:16px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;transition:border-color var(--ease),box-shadow var(--ease)}
.block-card.dragging{opacity:.55;border-color:rgba(212,165,116,.45)}
.block-card.drop-target{border-color:var(--copper);box-shadow:0 0 0 1px rgba(212,165,116,.25)}
.block-drag-handle{display:grid;place-items:center;min-width:var(--tap);min-height:var(--tap);padding:0 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel3);color:var(--muted);cursor:grab;font-size:14px;line-height:1;letter-spacing:-2px;flex-shrink:0;touch-action:none}
.block-drag-handle:active{cursor:grabbing}
.block-drag-spacer{width:var(--tap);flex-shrink:0}
.block-list{display:grid;gap:0}
.block-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.letter-badge{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--copper2);flex-shrink:0}
.block-head select{max-width:180px;min-height:36px;padding:6px 8px;font-size:12px}
.block-head .grow{flex:1;min-width:120px}
.block-body{padding:14px}
.exercise-card{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.exercise-pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel3);color:var(--text);font-weight:650;transition:border-color var(--ease)}
.exercise-pick:hover{border-color:rgba(212,165,116,.35)}
.rx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.rx-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.rx-grid .field{margin-top:0}
.set-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.set-table th,.set-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.set-table td{color:var(--text);font-size:13px;text-transform:none;font-weight:500;letter-spacing:0}
.set-table input{padding:6px 8px;font-size:13px}
.setrow{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr)) auto;gap:7px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow .setnum{font-weight:700;font-size:13px;color:var(--muted)}
.setrow .setnum .target{display:block;font-size:10px;color:var(--dim);font-weight:500;margin-top:2px}
.setrow .mini{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.builder-setrow input,.builder-setrow select,.logcol-kind{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}
.setrow.last-set{border-left:2px solid var(--copper);padding-left:8px;margin-left:-4px}
.setrow.last-set .mini{color:var(--copper2)}
.guardrail{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:8px;background:rgba(212,165,116,.08);border:1px solid rgba(212,165,116,.15)}
.divider{height:1px;background:var(--line);margin:10px 0}
.rx-summary{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.rx-metric-grid{display:grid;gap:10px;margin-top:12px}
.rx-metric-grid.cols-1{grid-template-columns:1fr}
.rx-metric-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.rx-metric-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.rx-metric-col{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.rx-metric-col input{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel3);color:var(--text);font-size:13px}
.rx-metric-hint{margin:6px 0 0;font-size:10px;color:var(--dim);line-height:1.35}
.rx-metric-remove{min-width:28px;padding:4px 8px}
.autopilot-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(212,165,116,.2);background:rgba(212,165,116,.06)}
.autopilot-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.autopilot-value{font-size:14px;font-weight:700;color:var(--copper2)}
.autopilot-note{font-size:11px;color:var(--dim);flex:1;min-width:180px}
.rx-advanced{margin-top:8px}
.rx-overrides summary{cursor:pointer;font-size:12px;font-weight:650;color:var(--muted);padding:6px 0}
.rx-overrides[open] summary{color:var(--copper2);margin-bottom:8px}
.rx-override-table{margin-top:4px}
.add-block-bar{margin-top:20px}
.kebab-btn{min-height:var(--tap);min-width:var(--tap);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);transition:border-color var(--ease),color var(--ease);touch-action:manipulation}
.kebab-btn:hover{border-color:rgba(212,165,116,.35);color:var(--text)}
.kebab-btn.danger{color:var(--bad);border-color:rgba(208,137,125,.35)}
.kebab-btn.danger:hover{background:rgba(208,137,125,.1)}
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:20px;animation:coachFade .2s var(--ease) both}
.picker-panel{width:min(520px,100%);max-height:min(80vh,640px);overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;box-shadow:var(--shadow)}
.picker-overlay.comment-overlay{place-items:stretch end;padding:0;background:rgba(0,0,0,.68)}
.comment-drawer{display:flex;flex-direction:column;width:min(400px,100vw);max-height:100vh;height:100vh;border:0;border-radius:0;padding:0;overflow:hidden;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.comment-drawer-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f5f5f5;border-bottom:1px solid var(--line)}
.comment-team-badge{display:grid;place-items:center;width:36px;height:36px;border-radius:3px;background:#10101c;color:#fff;font-size:9px;font-weight:800}
.comment-context{min-width:0;flex:1}
.comment-context b{display:block;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comment-context span{display:block;margin-top:1px;font-size:11px;text-transform:uppercase}
.comment-drawer-body{flex:1;min-height:0;overflow:auto;padding:0 10px 18px}
.comment-drawer-body .review-block{padding:18px 12px;margin:0;border-top:0;border-bottom:1px solid var(--line)}
.comment-composer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:#fff}
.comment-composer textarea{min-height:42px;max-height:150px;height:42px;resize:vertical;border-radius:22px;padding:11px 14px;overflow:auto}
.comment-thread{padding:12px;border-top:1px solid var(--line)}
.comment-thread article{margin-top:10px;padding:10px;background:#f5f7fa;border-radius:6px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-thread time{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.gif-button{min-height:32px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:10px;font-weight:800}
.picker-list{display:grid;gap:6px;margin-top:12px;max-height:360px;overflow:auto}
.picker-item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel3);color:var(--text);transition:border-color var(--ease)}
.picker-item:hover{border-color:rgba(212,165,116,.35)}
.picker-item[hidden]{display:none}
.template-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--text);transition:border-color var(--ease),box-shadow var(--ease)}
.template-row:hover{border-color:rgba(212,165,116,.28);box-shadow:var(--shadow)}
.engine-box{margin-top:4px}
.engine-plan{margin:0 0 12px;padding:10px 12px;border:1px solid rgba(212,165,116,.22);border-radius:10px;background:rgba(212,165,116,.06);color:var(--copper2);font-weight:650;font-size:14px}
.engine-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.efforts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.eff{display:grid;gap:2px;min-height:56px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel3);color:var(--muted);text-align:left;transition:border-color var(--ease),background var(--ease),color var(--ease)}
.eff.on{border-color:rgba(212,165,116,.55);background:rgba(212,165,116,.12);color:var(--copper2)}
.eff b{font-size:14px}
.eff small{font-size:11px;color:var(--dim);font-weight:500}
.eff.on small{color:var(--copper)}
.mins-row{display:flex;align-items:center;gap:8px}
.mins-row input{flex:1}
.mins-row button{min-width:40px;min-height:40px}
.engine-hint{margin:8px 0 0;color:var(--dim);font-size:12px;line-height:1.4}

/* program grid */
.prog-list{display:grid;gap:10px}
.prog-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color var(--ease)}
.prog-row:hover{border-color:rgba(212,165,116,.25)}
.prog-row-main{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:0;border:0;background:transparent;color:var(--text);cursor:pointer;min-height:44px}
.prog-row-main:hover b{color:var(--copper2)}
.prog-row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.prog-title{font-family:var(--font-display);font-size:28px;font-weight:600;background:transparent;border:0;border-bottom:1px solid transparent;padding:4px 0;width:min(100%,420px);color:var(--text)}
.prog-title:focus{border-bottom-color:var(--copper);outline:none}
.prog-title:focus-visible{box-shadow:var(--focus);border-radius:4px}
.prog-icons{display:flex;gap:6px;align-items:center}
.prog-icon{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--muted);transition:border-color var(--ease),color var(--ease)}
.prog-icon:hover{color:var(--copper2);border-color:rgba(212,165,116,.35)}
.prog-icon:disabled,.prog-icon[disabled]{opacity:.35;cursor:not-allowed}
.prog-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.prog-week{margin-top:22px}
.prog-week-label{font-family:var(--font-display);font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.prog-days{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.prog-day-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:0 4px 6px}
.prog-cell{position:relative;min-height:120px;padding:0;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:left;color:var(--text);overflow:visible;transition:border-color var(--ease)}
.prog-cell.empty{cursor:pointer;background:#fff}
.prog-cell.empty:hover{border-color:rgba(212,165,116,.35);border-style:dashed}
.prog-cell.empty::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:18px;opacity:0;transition:opacity var(--ease);pointer-events:none}
.prog-cell.empty:hover::after{opacity:.7}
.prog-card{padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.prog-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.prog-card-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;border:1px solid var(--copper);color:var(--copper2);font-size:9px;font-weight:800;letter-spacing:.06em;flex-shrink:0}
.prog-card-title{font-size:12px;font-weight:650;line-height:1.3;flex:1;min-width:0}
.prog-card-body{display:flex;gap:8px;align-items:flex-start;margin-top:auto}
.prog-card-body .letter-badge{width:24px;height:24px;font-size:11px}
.prog-card-ex{font-size:12px;line-height:1.35}
.prog-card-ex .muted{font-size:11px;margin-top:2px}
.kebab-menu{position:absolute;top:36px;right:6px;z-index:20;min-width:180px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);display:grid;gap:2px}
.kebab-menu button{width:100%;text-align:left;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font-size:13px;min-height:var(--tap)}
.kebab-menu button:hover{background:rgba(212,165,116,.12);color:var(--copper2)}
.kebab-menu button.danger{color:var(--bad)}
.prog-footer{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog-hint{margin:0 0 12px;padding:10px 12px;border:1px dashed rgba(212,165,116,.35);border-radius:10px;background:rgba(212,165,116,.06);color:var(--copper2);font-size:13px}

/* calendars + roster */
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th,.roster-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.roster-table th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.roster-table tbody tr{transition:background var(--ease)}
.roster-table tbody tr:hover{background:rgba(255,255,255,.025)}
.roster-table tbody tr.roster-selected{background:#c9e8fb}
.profile-ex-row[hidden]{display:none}
p[role="status"]:empty{display:none}
.linkish{background:transparent;border:0;padding:0;color:var(--copper2);font-weight:650;cursor:pointer;text-align:left}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}
.surface-titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:-4px 0 14px}
.surface-titlebar h1{font-size:18px}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:8px 10px;border:1px solid var(--line);border-bottom:0;background:#fff}
.table-toolbar-left,.table-toolbar-right,.table-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.compact-filter{display:flex;align-items:center;gap:7px;min-width:180px;padding:0 10px;border-right:1px solid var(--line)}
.compact-filter label{margin:0;font-size:9px}
.compact-filter select{width:auto;min-width:125px;padding:7px 26px 7px 7px;border:0;background:transparent;font-size:12px}
.table-search{width:190px;padding:8px 10px;font-size:12px}
.table-icon-btn{display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font-size:16px}
.table-icon-btn:hover{border-color:var(--line);background:#f7f7f8;color:var(--text)}
.roster-person{display:flex;align-items:center;gap:9px}
.roster-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#26272b;color:#fff;font-size:9px;font-weight:800;flex:0 0 30px}
.roster-person .linkish{font-size:12px}
.subline{margin-top:2px;color:var(--muted);font-size:10px}
.action-glyph{display:inline-grid;place-items:center;width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:14px}
.action-glyph:hover{color:var(--th-blue);background:#eef4ff}
.tag-link{color:var(--th-blue);font-size:11px;font-weight:600}
.bulk-actions{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}
.bulk-actions button{min-height:30px;padding:6px 9px;font-size:10px}
.team-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:3px;background:#10101c;color:#fff;font-size:9px;font-weight:800}
.status-dot{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:#ef4444;vertical-align:middle}
.profile-overlay{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.46)}
.profile-drawer{position:absolute;inset:0 0 0 auto;width:min(430px,100vw);display:flex;flex-direction:column;background:#fff;box-shadow:-12px 0 30px rgba(0,0,0,.2)}
.athlete-profile-drawer .profile-head,.athlete-profile-drawer .profile-tabs{background:#000;color:#fff}
.athlete-profile-drawer .profile-head b{text-transform:uppercase;font-size:12px;font-weight:500}
.athlete-profile-drawer .profile-head .subline{color:#aaa}
.athlete-profile-drawer .profile-tabs button{color:#aaa}
.athlete-profile-drawer .profile-tabs button.on{color:#fff}
.profile-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.profile-tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line)}
.profile-tabs button{padding:13px 10px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase}
.profile-tabs button.on{border-bottom-color:var(--th-blue);color:var(--text)}
.profile-body{flex:1;overflow:auto;padding:14px 16px}
.profile-ex-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:11px}
.profile-ex-row b{color:var(--th-blue)}
.cal-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:12px 0 16px;flex-wrap:wrap}
.cal-month{margin-top:8px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{min-height:88px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:6px;position:relative;transition:border-color var(--ease),background var(--ease)}
.cal-day:hover{border-color:rgba(212,165,116,.28)}
.cal-day.has-sessions{border-color:rgba(212,165,116,.22)}
.cal-day.has-sessions .cal-day-num{color:var(--text)}
.cal-day-num{width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;text-align:left;padding:2px 4px;cursor:pointer}
.cal-day-num:hover{color:var(--copper2)}
.cal-day-body{display:grid;gap:6px;margin-top:4px}
.cal-day.cal-pad{min-height:88px;border-color:transparent;background:transparent;pointer-events:none}
.cal-chip-ath{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--copper2);margin-bottom:2px}
.coach-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:min(92vw,420px);padding:12px 16px;border:1px solid rgba(212,165,116,.45);border-radius:12px;background:#12161af0;color:var(--text);font-size:13px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none}
.coach-toast.ok{border-color:rgba(125,186,154,.5)}
.prog-icon:disabled,.prog-icon[disabled]{display:none}
.cal-chip{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);position:relative;font-size:11px;transition:border-color var(--ease)}
.cal-chip.unpublished{border-style:dashed;border-color:rgba(212,165,116,.35);opacity:.95}
.cal-chip.published{border-color:rgba(125,186,154,.5);background:rgba(125,186,154,.06)}
.cal-chip-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.cal-chip-title{font-weight:650;line-height:1.25}
.cal-chip-meta{margin-top:4px;color:var(--dim);font-size:10px}
.cal-empty-actions{margin-top:6px}
.calendar-page{margin:-20px -28px -48px;background:#fff;min-height:calc(100vh - 56px)}
.calendar-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:#050505;color:#fff}
.calendar-owner{display:flex;align-items:center;gap:10px;min-width:0}
.calendar-owner b{display:block;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.calendar-owner span{display:block;margin-top:2px;color:rgba(255,255,255,.64);font-size:10px}
.calendar-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.calendar-actions .btn{min-height:34px;padding:7px 10px;font-size:11px}
.calendar-monthbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line);background:#fff}
.calendar-monthbar b{min-width:140px;text-align:center;font-size:14px}
.calendar-monthbar button{width:30px;height:30px;border:0;background:transparent;color:var(--muted)}
.calendar-page .cal-month{margin:0;padding:0 10px 18px}
.calendar-page .cal-dow-row{margin:0 -10px 0;padding:9px 10px;border-bottom:1px solid var(--line)}
.calendar-page .cal-grid{gap:0}
.calendar-page .cal-day{min-height:108px;border-width:0 1px 1px 0;border-radius:0}
.calendar-page .cal-day:nth-child(7n+1){border-left:1px solid var(--line)}
.calendar-page .cal-pad{background:#f2f2f2;border-color:var(--line)}
.library-pick-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.48)}
.library-pick-drawer{position:absolute;inset:0 0 0 auto;width:min(430px,100vw);display:flex;flex-direction:column;background:#fff;box-shadow:-12px 0 30px rgba(0,0,0,.2)}
.library-pick-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.library-pick-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 14px}
.library-pick-tabs button{padding:13px 10px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:10px;font-weight:700}
.library-pick-tabs button.on{border-color:var(--th-blue);color:var(--th-blue)}
.library-pick-body{padding:14px;overflow:auto}
.ex-cat-row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.ex-cat-row:last-child{border-bottom:0}
.feed-card h2{font-family:var(--font-display);font-weight:600}

</head>
<body>
<div id="gate"></div>
<div id="coachApp" class="coach-shell hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script src="./whoop.js"></script>
<script src="./exercise-search-index.js"></script>
<script src="./exercise-search.js"></script>
<script src="./coach-exercise-catalog.js"></script>
<script src="./coach-loop.js"></script>
<script src="./log-columns.js"></script>
<script src="./coach-nutrition.js"></script>
<script src="./coach-bridge.js"></script>
<script src="./coach-cloud.js"></script>
<script src="./coach-views.js"></script>
<script src="./coach-management.js"></script>
<script src="./coach-tools.js"></script>
<script src="./coach-native-bridge.js"></script>
<script src="./athlete-runtime/library.js"></script>
<script src="./strength-builder.js"></script>
<script>
const L = window.CoachLoop;
const N = window.CoachNutrition;
let S = L.mergeExerciseCatalog(L.loadState());
const ui = {
  view:'home', lib:'programs', athleteId:null, teamId:null, programId:null, templateId:null, sessionId:null,
  expandAll:false, expanded:{}, err:'', exPicker:null, exSearch:'', exEdit:null,
  cellMenu:null, cellPick:null, progSearch:'',
  calMonth:null, calDay:null, chipMenu:null, libPick:null,
  assignTeamId:null, assignStart:null, nutAthleteId:null,
  exCatalogSearch:'', sessionSearch:'', sessionSelected:{}, sessionNotice:'', commentDrawer:null, filterAthlete:'all',
  homeMode:'latest', homeDate:L.today(), homeCalendarOpen:false, homePickerMonth:L.today().slice(0,7),
  rosterSearch:'', rosterGroup:'all', rosterStatus:'active', rosterSelected:{}, athleteProfileId:null, athleteProfileTab:'exercises',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dash = (v) => (v == null || v === '') ? '–' : String(v);
function persist(){
  L.saveState(null, S);
  if (window.CoachBridge) CoachBridge.push(S);
  if (window.CoachViews) CoachViews.bindState(S);
  scheduleCloudPush();
}

let cloudPushTimer = null;
function scheduleCloudPush(){
  if (!window.CoachCloud) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(async () => {
    try {
      if (!(await CoachCloud.isSignedIn())) return;
      const r = await CoachCloud.pushPublished(S);
      L.saveState(null,S);
      if (r && r.errors && r.errors.length) console.warn('coach cloud push', r.errors);
    } catch (e) {
      console.warn('coach cloud push failed', e);
    }
  }, 800);
}

async function bindMyCloudIdToAthlete(athleteId){
  if (!window.CoachCloud) return alert('Cloud module missing');
  const uid = await CoachCloud.sessionUserId();
  if (!uid) return alert('Sign in first (coach Settings / WHOOP account — same Supabase as athlete).');
  const a = athleteBy(athleteId);
  if (!a) return;
  a.cloudUserId = uid;
  persist(); render();
  showCoachToast('Linked ' + a.name + ' to your signed-in account.', 'ok');
}

async function pushCloudNow(){
  if (!window.CoachCloud) return alert('Cloud module missing');
  if (!(await CoachCloud.isSignedIn())) return alert('Sign in with the athlete Supabase account (WHOOP sign-in) so publish can write assigned_session.');
  const r = await CoachCloud.pushPublished(S);
  L.saveState(null,S);
  coachPortalToast(r, '');
  render();
}

let coachToastTimer = null;
function showCoachToast(msg, tone){
  if (!msg) return;
  const old = document.querySelector('.coach-toast');
  if (old) old.remove();
  clearTimeout(coachToastTimer);
  const el = document.createElement('div');
  el.className = 'coach-toast' + (tone === 'ok' ? ' ok' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  coachToastTimer = setTimeout(() => { el.remove(); }, 4500);
}
window.showCoachToast = showCoachToast;

function coachPortalToast(result, athleteName){
  if (!result) return;
  if (result.ok) {
    const n = result.pushed || 0;
    const who = athleteName ? ' to ' + athleteName : '';
    showCoachToast(n ? 'Published ' + n + ' session(s)' + who + '. Phone syncs on next open.' : 'No new sessions published. Logged or existing assignments were left unchanged.', 'ok');
    return;
  }
  const msg = (result.errors || []).map(e => e.error).join('; ') || result.reason || result.error || 'Push failed';
  showCoachToast('Cloud push: ' + msg, 'warn');
}
window.coachPortalToast = coachPortalToast;

let refreshStatesTimer = null;
function scheduleRefreshCloudStates(){
  clearTimeout(refreshStatesTimer);
  refreshStatesTimer = setTimeout(async () => {
    if (ui._cloudRefresh || !window.CoachCloud || !CoachCloud.refreshPublishedStates) return;
    try {
      if (!(await CoachCloud.isSignedIn())) return;
      ui._cloudRefresh = true;
      const r = await CoachCloud.refreshPublishedStates(S);
      if (r.ok && r.updated) { L.saveState(null, S); render(); }
    } catch (e) {
      console.warn('coach cloud refresh', e);
    } finally {
      ui._cloudRefresh = false;
    }
  }, 900);
}
function account(){ return L.currentAccount(S); }
function athleteBy(id){ return (S.athletes||[]).find(a => a.id === id); }
function tpl(id){ return (S.templates||[]).find(t => t.id === id); }
function ses(id){ return (S.sessions||[]).find(s => s.id === id); }
function prog(id){ return (S.programs||[]).find(p => p.id === id); }
function team(id){ return (S.teams||[]).find(t => t.id === id); }

function go(view, extra){
  const wasSidebarOpen=ui.sidebarOpen;
  ui.sidebarOpen=false;
  if (view !== 'session') closeCoachExEdit();
  Object.assign(ui, extra||{}, { view });
  if (view === 'library' && !ui.lib) ui.lib = 'programs';
  if (view !== 'session') ui.exPicker = null;
  if (view !== 'program') {
    ui.programPreview=false;ui.programSettings=false;
    ui.cellMenu = null;
    if (!ui.cellPick || (ui.cellPick.mode !== 'copyTarget' && ui.cellPick.mode !== 'moveTarget')) {
      ui.cellPick = null;
    }
  }
  if (view !== 'athlete' && view !== 'team') {
    ui.chipMenu = null;
    ui.libPick = null;
    ui.calDay = null;
    ui.calendarPreview=null;
  }
  if (view !== 'home') ui.commentDrawer = null;
  if (view === 'assign' && !ui.assignTeamId && S.teams && S.teams[0]) ui.assignTeamId = S.teams[0].id;
  render();
  if(wasSidebarOpen)document.getElementById('coachNavigationToggle')?.focus();
}
function toggleCoachSidebar(open){ui.sidebarOpen=typeof open==='boolean'?open:!ui.sidebarOpen;render();if(!ui.sidebarOpen)document.getElementById('coachNavigationToggle')?.focus();}
function openSession(templateId){
  closeCoachExEdit();
  ui.cellMenu = null;
  ui.templateId = templateId;
  ui.lib = 'sessions';
  ui.exPicker = null;
  ui.view = 'session';
  render();
}
function openProgram(programId){
  ui.programId = programId;
  ui.lib = 'programs';
  ui.cellMenu = null;
  ui.cellPick = null;
  ui.view = 'program';
  render();
}
async function signOut(){
  try {
    if (window.Whoop && typeof Whoop.client === 'function') {
      await Whoop.client().auth.signOut();
    }
  } catch (_) { /* best-effort */ }
  L.logout(S);
  persist();
  ui.view = 'home';
  ui.err = '';
  render();
}
function resetDemo(){
  if(!confirm('Replace this device\'s coach data with demo data? Download a local backup from Coach settings first. Cloud records are not deleted.'))return;
  S = L.resetState();
  Object.assign(ui, { view:'home', lib:'sessions', templateId:null, programId:null, cellMenu:null, cellPick:null, exPicker:null, err:'', calMonth:null, calDay:null, chipMenu:null, libPick:null });
  if (window.CoachViews) CoachViews.bindState(S);
  render();
}

/** Ensure a local coach account row for a Supabase-authenticated email. */
function ensureCoachAccount(email, name){
  const e = String(email || '').trim().toLowerCase();
  if (!e) return null;
  S.accounts = S.accounts || [];
  let acc = S.accounts.find((a) => a.role === 'coach' && String(a.email || '').toLowerCase() === e);
  if (!acc) {
    acc = {
      id: 'coach-cloud-' + e.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
      email: e,
      password: '',
      role: 'coach',
      name: name || e.split('@')[0] || 'Coach',
      athleteId: null,
    };
    S.accounts.push(acc);
  } else if (name) {
    acc.name = name;
  }
  S.coach = S.coach || { id: acc.id, name: acc.name };
  S.coach.name = acc.name;
  S.currentUserId = acc.id;
  return acc;
}

async function tryLogin(email, pass){
  ui.err = '';
  const e = String(email || '').trim();
  const p = String(pass || '');
  if (!e || !p) {
    ui.err = 'Enter email and password';
    render();
    return;
  }

  // Offline / seeded demo accounts (dan@thehybrid.local · demo).
  const local = L.login(S, e, p);
  if (local.ok) {
    if (local.account.role !== 'coach') {
      L.logout(S);
      ui.err = 'Coach workspace only. Athletes use the Hybrid athlete app.';
      persist();
      render();
      return;
    }
    ui.err = '';
    persist();
    render();
    return;
  }

  // Real account: same Supabase password auth as athlete Settings → Account.
  try {
    if (!(window.Whoop && typeof Whoop.client === 'function')) {
      throw new Error(local.error || 'Auth not loaded — check network and refresh');
    }
    const { data, error } = await Whoop.client().auth.signInWithPassword({ email: e, password: p });
    if (error) throw error;
    const user = data && data.user;
    if (!user) throw new Error('Sign-in succeeded but no user returned');
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || e.split('@')[0];
    ensureCoachAccount(user.email || e, name);
    ui.err = '';
    persist();
    render();
  } catch (err) {
    ui.err = (err && err.message) || local.error || 'Sign-in failed';
    render();
  }
}

function navActive(key){
  if (key === 'home') return ui.view === 'home';
  if (key === 'athletes') return ui.view === 'athletes' || ui.view === 'athlete';
  if (key === 'teams') return ui.view === 'teams' || ui.view === 'team';
  if (key === 'library') return ['library','program','session'].includes(ui.view);
  if (key === 'nutrition') return ui.view === 'nutrition';
  return key === ui.view;
}

function headerTitle(){
  const coachName = S.coach?.name || 'Dan';
  if (ui.view === 'home') return `Welcome back, Coach ${coachName}`;
  const titles = { athletes:'My Athletes', athlete:'My Athletes', teams:'My Teams', team:'My Teams', library:'Library', program:'Library', session:'Library', assign:'Assign', nutrition:'Nutrition' };
  return titles[ui.view] || ({analytics:'Analytics',gym:'Gym Tools',account:'Coach settings'}[ui.view]) || 'Coach Home';
}

function icon(name){
  const paths = {
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    users:'<path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    teams:'<path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M18 11a2.5 2.5 0 1 0 0-5"/><path d="M6 11a2.5 2.5 0 1 0 0-5"/><path d="M12 13c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4Z"/>',
    library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    nutrition:'<path d="M12 3v18"/><path d="M5 8h14"/><path d="M7 8c0 7 5 11 5 11s5-4 5-11"/><path d="M9 4h6"/>',
    chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/>',
    gym:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/>',
    support:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 4.8 1 2 2 0 0 0-1 1.8V14"/><path d="M12 17h.01"/>',
    msg:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>',
    bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  };
  return `<svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`;
}

function sliceStub(label, slice){
  return `<div class="card slice-stub"><div><b>${esc(label)}</b><p class="muted">${esc(slice)} — layout stub for chrome review (R0)</p></div></div>`;
}

function ringSvg(done, total){
  const p = total ? done/total : 0;
  const c = 2*Math.PI*16;
  const dashn = `${p*c} ${c}`;
  return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="21" cy="21" r="16" fill="none" stroke="#7dba9a" stroke-width="4" stroke-dasharray="${dashn}" stroke-linecap="round" transform="rotate(-90 21 21)"/></svg>`;
}

function metricRow(m){
  const metricIcon=(kind,value)=>{
    const paths={readiness:'<path d="M8 4s-5 6-5 10a5 5 0 0 0 10 0c0-4-5-10-5-10Z"/><path d="M18 5h3M18 9h2M18 13h3M18 17h2M18 21h3"/>',minutes:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l5 3"/>',intensity:'<path d="M4 19a9 9 0 1 1 16 0M5 13l3 1M19 13l-3 1M12 12l-4-4"/>',volume:'<path d="M7 7h10l3 14H4L7 7Z"/><circle cx="12" cy="4" r="2"/>'};
    return `<svg class="metric-icon ${value==null?'missing':''}" viewBox="0 0 24 24" aria-hidden="true">${paths[kind]}</svg>`;
  };
  return `<div class="metrics feed-metrics">
    <div class="metric metric--blocks">${ringSvg(m.blocksDone,m.blocksTotal)}<b>${m.blocksDone}/${m.blocksTotal}</b><span>Blocks</span></div>
    <div class="metric">${metricIcon('readiness',m.readiness)}<b>${dash(m.readiness)}</b><span>Readiness</span></div>
    <div class="metric">${metricIcon('minutes',m.minutes)}<b>${dash(m.minutes)}</b><span>Minutes</span></div>
    <div class="metric">${metricIcon('intensity',m.intensity)}<b>${m.intensity==null?'–':m.intensity+'%'}</b><span>Intensity</span></div>
    <div class="metric">${metricIcon('volume',m.volumeKg)}<b>${m.volumeKg==null?'–':m.volumeKg+' kg'}</b><span>Volume</span></div>
  </div>`;
}

function blockDetail(session){
  return (session.blocks||[]).map((b, bi) => {
    const complete = L.blockIsComplete(b);
    const partial = !complete && ((b.exercises||[]).some(e => (e.rows||[]).some(r => r.done || r.weight || r.reps)) || b.complete);
    const state = complete ? 'done' : (partial ? 'partial' : '');
    const mark = complete ? '✓' : (partial ? '•' : '');
    const letter = b.letter || String.fromCharCode(65 + bi);
    const ex = (b.exercises||[]).map((e,ei) => {
      const actual = L.actualLine(e);
      const swap = e.swappedFrom ? `<div class="muted">Swapped from ${esc(e.swappedFrom.name)}</div>` : '';
      return `<div class="review-exercise"><div class="review-letter">${esc(b.letters?.[ei]||letter)}</div><div><b>${esc(e.name)}</b>
        <div class="presc">${esc(L.prescriptionLine(e))}</div>
        ${actual?`<div class="review-actual">${esc(actual)}</div>`:''}
        ${e.athleteNote?`<div class="muted">${esc(e.athleteNote)}</div>`:''}${swap}
        ${b.scoring==='completion'?'<span class="review-for-completion">For Completion</span>':''}</div></div>`;
    }).join('');
    const notes = b.notes ? `<div class="muted" style="margin:8px 0 0 40px">${esc(b.notes)}</div>` : '';
    return `<div class="review-block" data-scoring-label="${b.scoring==='completion'?'For Completion':'For Weight'}"><div class="review-block-head"><span class="review-status ${state}">${mark}</span><div><div class="review-block-title">${esc(b.category||b.type||'Block')}</div>${b.heading?`<div class="muted">${esc(b.heading)}</div>`:''}</div></div>${notes}${ex}</div>`;
  }).join('');
}

function saveComment(sessionId){
  const el = document.getElementById('note-'+sessionId);
  const s = ses(sessionId); if (!s || !el) return;
  const error=$('commentSaveStatus');
  const previousComment=s.comment,previousThread=s.coachComments;
  const saved=CoachManagement.appendCoachComment(s,el.value,S.coach?.id||account()?.id);
  if(!saved){if(error)error.textContent='Write a comment (up to 4,000 characters).';return;}
  try {L.saveState(null,S);}
  catch(err){if(previousComment===undefined)delete s.comment;else s.comment=previousComment;if(previousThread===undefined)delete s.coachComments;else s.coachComments=previousThread;if(error)error.textContent='Could not save locally: '+err.message;return;}
  ui.commentDrawer=null;render();
}

function toggleCard(id){ ui.expanded[id] = !ui.expanded[id]; render(); }

function homeDateLabel(date){
  try { return new Date(String(date)+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
  catch (_) { return String(date||''); }
}

function setHomeDate(date){ ui.homeDate=date;ui.homeMode='date';ui.homeCalendarOpen=false;render(); }
function shiftHomeDate(days){ setHomeDate(L.addDays(ui.homeDate||L.today(),days)); }
function showLatestFeed(){ ui.homeMode='latest';ui.homeCalendarOpen=false;render(); }
function shiftHomePickerMonth(delta){ ui.homePickerMonth=L.shiftMonth(ui.homePickerMonth||L.today().slice(0,7),delta);render(); }

function homeMonthHtml(monthKey, allowPrev, allowNext){
  const heads=['M','T','W','T','F','S','S'].map(x=>`<span class="dow">${x}</span>`).join('');
  const cells=L.monthGridCells(monthKey).map(d=>d
    ? `<button type="button" aria-label="Choose ${d}" class="${d===ui.homeDate?'selected':''}" onclick="setHomeDate('${d}')">${Number(d.slice(8))}</button>`
    : '<span></span>').join('');
  return `<div><div class="home-month-head"><button type="button" class="btn ghost small" ${allowPrev?'onclick="shiftHomePickerMonth(-1)"':'disabled'}>‹</button><span>${esc(L.monthLabel(monthKey))}</span><button type="button" class="btn ghost small" ${allowNext?'onclick="shiftHomePickerMonth(1)"':'disabled'}>›</button></div><div class="home-month-grid">${heads}${cells}</div></div>`;
}

function homeCalendarHtml(){
  if(!ui.homeCalendarOpen) return '';
  const first=ui.homePickerMonth||L.today().slice(0,7);
  return `<div class="home-date-popover" role="dialog" aria-label="Choose feed date"><div class="home-months">${homeMonthHtml(first,true,false)}${homeMonthHtml(L.shiftMonth(first,1),false,true)}</div></div>`;
}

function feedHtml(){
  const athletes = S.athletes||[];
  const list = CoachManagement.feedSessions(S,{...ui,homeDate:ui.homeDate||L.today()});
  const groups = L.groupFeed(list, athletes);

function sessionMatches(template,query){
  return `${template.name} ${template.athleteTemplate?.title||''}`.toLowerCase().includes(String(query||'').trim().toLowerCase());
}
function filterSessionLibrary(query){
  ui.sessionSearch=query;
  document.querySelectorAll('#sessionLibraryTable tbody tr').forEach(row=>{row.hidden=!sessionMatches(tpl(row.dataset.templateId),query);});
  const count=(S.templates||[]).filter(t=>sessionMatches(t,query)).length;
  if($('sessionSearchStatus')) $('sessionSearchStatus').textContent=count?`${count} sessions`:'No matching sessions';
  updateSessionSelection();
}
function updateSessionSelection(){
  const selected=Object.keys(ui.sessionSelected).filter(id=>ui.sessionSelected[id]&&tpl(id));
  if($('sessionSelectionStatus')) $('sessionSelectionStatus').textContent=`${selected.length} selected`;
  if($('deleteSelectedSessions')) $('deleteSelectedSessions').disabled=!selected.length;
  const visible=(S.templates||[]).filter(t=>sessionMatches(t,ui.sessionSearch));
  const checked=visible.filter(t=>ui.sessionSelected[t.id]).length;
  if($('selectVisibleSessions')){
    $('selectVisibleSessions').checked=visible.length>0&&checked===visible.length;
    $('selectVisibleSessions').indeterminate=checked>0&&checked<visible.length;
  }
}
function selectVisibleSessions(checked){
  (S.templates||[]).filter(t=>sessionMatches(t,ui.sessionSearch)).forEach(t=>{ui.sessionSelected[t.id]=checked;});
  document.querySelectorAll('#sessionLibraryTable tbody tr').forEach(row=>{row.querySelector('input').checked=!!ui.sessionSelected[row.dataset.templateId];});
  updateSessionSelection();
}
function duplicateSessionTemplate(id){
  const source=tpl(id);if(!source) return;
  const copy=L.duplicateTemplate(source);
  S.templates.push(copy);ui.sessionNotice=`Created ${copy.name}. Existing programs and assignments are unchanged.`;
  L.saveState(null,S);render();
}
function openStrengthSession(id){
  const template=tpl(id);if(!template) return;
  StrengthBuilder.open(template,()=>L.saveState(null,S),render);
}
function deleteSessionTemplates(ids){
  const existing=[...new Set(ids)].filter(id=>tpl(id));
  if(!existing.length) return;
  const blocked=existing.filter(id=>{const usage=L.templateUsage(S,id);return usage.programs||usage.sessions;});
  const allowed=existing.filter(id=>!blocked.includes(id));
  if(!allowed.length){ui.sessionNotice='Templates used in programs or assigned sessions cannot be deleted. Remove those references first.';render();return;}
  const names=allowed.map(id=>tpl(id).name).join(', ');
  if(!confirm(`Delete ${allowed.length} unused template(s): ${names}? You can restore them from the session library.${blocked.length?` ${blocked.length} in-use template(s) will be kept.`:''}`)) return;
  S.templateTrash=S.templateTrash||[];
  allowed.forEach(id=>S.templateTrash.push({template:L.clone(tpl(id)),deletedAt:new Date().toISOString()}));
  S.templates=S.templates.filter(t=>!allowed.includes(t.id));
  allowed.forEach(id=>delete ui.sessionSelected[id]);
  ui.sessionNotice=`Deleted ${allowed.length} unused template(s).${blocked.length?` Kept ${blocked.length} in-use template(s).`:''}`;
  L.saveState(null,S);render();
}
function restoreSessionTemplates(){
  const entries=S.templateTrash||[];
  const restore=entries.filter(entry=>!tpl(entry.template.id));
  restore.forEach(entry=>S.templates.push(entry.template));
  const restored=new Set(restore.map(entry=>entry.template.id));
  S.templateTrash=entries.filter(entry=>!restored.has(entry.template.id));
  ui.sessionNotice=`Restored ${restore.length} template(s).`;
  L.saveState(null,S);render();
}

function saveCatalogExercise(){const name=$('catalogName').value.trim(),video=$('catalogVideo').value.trim(),e=S.exercises.find(e=>e.id===ui.catalogEdit.id);if(!name){$('catalogError').textContent='Enter an exercise name.';return;}if(video){try{const url=new URL(video);if(!['http:','https:'].includes(url.protocol))throw Error();}catch(_){$('catalogError').textContent='Enter an HTTP or HTTPS video URL.';return;}}if(S.exercises.some(x=>x.id!==e?.id&&x.name.toLowerCase()===name.toLowerCase())){$('catalogError').textContent='An exercise with this name already exists.';return;}const entry=e||{id:L.uid('ex'),builtIn:false,source:'coach-custom'};Object.assign(entry,{name,category:$('catalogCategory').value.trim()||'Custom',videoUrl:video,coachNotes:$('catalogNotes').value});if(!e)S.exercises.push(entry);L.saveState(null,S);ui.catalogEdit=null;ui.exCatalogSearch='';render();}

function newTemplate(){
  const t = L.makeTemplate({
    name:'New session',
    coachInstructions:'',
    blocks:[L.makeBlock({ heading:'Strength', type:'strength', category:'Strength/Power', scoring:'weight', exercises:[L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'5', load:'', metric:'Weight' })] })],
  });
  S.templates.push(t);
  t.createdAt=new Date().toISOString();
  persist();
  openSession(t.id);
}

function newProgram(){
  const p = L.emptyProgram('New program', 1);
  S.programs = S.programs || [];
  S.programs.push(p);
  persist();
  openProgram(p.id);
}

function cellSummary(templateId){
  const t = tpl(templateId);
  if (!t) return null;
  const work = (t.blocks||[]).find(b => {
    const v = blockTypeValue(b);
    return v === 'strength' || v === 'conditioning' || v === 'recovery';
  }) || (t.blocks||[])[0];
  if (!work) return { title:t.name, letter:'A', line:'Empty session', sets:'' };
  const kind = blockTypeValue(work);
  if (kind === 'conditioning' || kind === 'recovery') {
    return { title:t.name, letter:work.letter||'A', line:L.condPlanLineBlock(work)||work.heading||(kind==='recovery'?'Recovery':'Conditioning'), sets:work.targetDurationMin?`${work.targetDurationMin} min`:'' };
  }
  if (kind === 'text') {
    return { title:t.name, letter:work.letter||'A', line:work.heading||'Notes', sets:'' };
  }
  const e = (work.exercises||[])[0];
  return { title:t.name, letter:work.letter||'A', line:e?.name||work.heading||'Exercise', sets:e?.sets?`${e.sets} Sets`:'' };
}

function toggleCellMenu(week, day, ev){
  if (ev) ev.stopPropagation();
  const cur = ui.cellMenu;
  if (cur && cur.week === week && cur.day === day) ui.cellMenu = null;
  else ui.cellMenu = { week, day };
  if (!ui.cellPick || (ui.cellPick.mode !== 'copyTarget' && ui.cellPick.mode !== 'moveTarget')) {
    ui.cellPick = null;
  }
  render();
}

function openCellPick(week, day, mode){
  ui.cellPick = { week, day, mode: mode || 'set' };
  ui.cellMenu = null;
  render();
}

function closeCellPick(){ ui.cellPick = null; render(); }

function placeCellTemplate(templateId){
  const pick = ui.cellPick; if (!pick) return;
  const p = prog(ui.programId); if (!p) return;
  if (pick.mode === 'set' || pick.mode === 'copy' || pick.mode === 'move') {
    L.setProgramCell(p, pick.week, pick.day, templateId);
    if (pick.mode === 'move' && pick.fromWeek != null) {
      L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    }
  }
  ui.cellPick = null;
  persist(); render();
}

function clearCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  L.setProgramCell(p, week, day, null);
  ui.cellMenu = null;
  persist(); render();
}

function startCopyCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'copyTarget', templateId:tid };
  render();
}

function startMoveCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'moveTarget', templateId:tid, fromWeek:week, fromDay:day };
  render();
}

function onEmptyCell(week, day){
  const pick = ui.cellPick;
  if (pick && (pick.mode === 'copyTarget' || pick.mode === 'moveTarget')) {
    const p = prog(ui.programId); if (!p) return;
    const key = L.cellKey(week, day);
    const occupied = !!(p.cells || {})[key];
    if (occupied && pick.mode === 'copyTarget') {
      if (!confirm('This cell already has a session. Replace it with the copy?')) return;
    }
    if (occupied && pick.mode === 'moveTarget') {
      if (!confirm('This cell already has a session. Swap/move anyway?')) return;
    }
    L.setProgramCell(p, week, day, pick.templateId);
    if (pick.mode === 'moveTarget') L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    ui.cellPick = null;
    persist(); render();
    return;
  }
  openCellPick(week, day, 'set');
}

function saveCellAsTemplate(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  const src = tpl(tid); if (!src) return;
  const fresh = L.duplicateTemplate(src);
  S.templates.push(fresh);
  ui.cellMenu = null;
  persist();
  openSession(fresh.id);
}

function addWeek(){
  const p = prog(ui.programId); if (!p) return;
  L.addProgramWeek(p);
  persist(); render();
}

function closeProgramSettings(){ ui.programSettings=false;render(); }
function setProgramSettingsTab(tab){ ui.programSettingsTab=tab;render(); }

  const p=prog(ui.programId);if(!p)return;
  const name=$('program-settings-name'),weeks=$('program-settings-weeks'),focus=$('program-settings-focus'),difficulty=$('program-settings-difficulty'),description=$('program-settings-description');
  if(!name?.value.trim()){$('program-settings-error').textContent='Enter a program name.';return;}
  try{CoachTools.resizeProgram(p,weeks.value);}catch(e){
    if(e.message.startsWith('Later weeks')&&confirm('Shortening this program removes sessions from later weeks. Assigned athlete sessions are preserved. Continue?'))CoachTools.resizeProgram(p,weeks.value,true);

  }
  p.name=name.value.trim();
  if(focus)p.focus=focus.value;if(difficulty)p.difficulty=difficulty.value;if(description)p.description=description.value;
  persist();ui.programSettings=false;render();
}

function filterProgramLibrary(query){
  if(!ui.cellPick) return;
  ui.cellPick.q=query;
  document.querySelectorAll('[data-program-template]').forEach(button=>{button.hidden=!sessionMatches(tpl(button.dataset.programTemplate),query);});
  const count=(S.templates||[]).filter(t=>sessionMatches(t,query)).length;
  if($('programLibraryStatus')) $('programLibraryStatus').textContent=count?`${count} sessions`:'No matching sessions';
}

function programCellHtml(p, week, day){
  const key = L.cellKey(week, day);
  const tid = (p.cells||{})[key];
  const menuOn = ui.cellMenu && ui.cellMenu.week === week && ui.cellMenu.day === day;
  if (!tid) {
    const hint = ui.cellPick && (ui.cellPick.mode === 'copyTarget' || ui.cellPick.mode === 'moveTarget')
      ? `<span class="muted" style="padding:12px;display:block;font-size:11px">${ui.cellPick.mode==='moveTarget'?'Drop here to move':'Drop here to copy'}</span>`
      : '';
    return `<button type="button" class="prog-cell empty" aria-label="Week ${week} Day ${day} empty" onclick="onEmptyCell(${week},${day})">${hint}</button>`;
  }
  const sum = cellSummary(tid) || { title:'Session', letter:'A', line:'—', sets:'' };
  const menu = menuOn ? `<div class="kebab-menu" role="menu">
      <button type="button" onclick="openSession('${tid}')">Edit session</button>
      <button type="button" onclick="startCopyCell(${week},${day})">Copy</button>
      <button type="button" onclick="startMoveCell(${week},${day})">Move</button>
      <button type="button" onclick="saveCellAsTemplate(${week},${day})">Save as template</button>
      <button type="button" class="danger" onclick="clearCell(${week},${day})">Delete</button>
    </div>` : '';
  return `<div class="prog-cell">
    <div class="prog-card">
      <div class="prog-card-top">
        <span class="prog-card-mark">TH</span>
        <button type="button" class="prog-card-title" style="background:transparent;border:0;padding:0;text-align:left;color:inherit;cursor:pointer" onclick="openSession('${tid}')">${esc(sum.title)}</button>
        <button type="button" class="kebab-btn" aria-label="Cell menu" onclick="toggleCellMenu(${week},${day},event)">⋯</button>
      </div>
      <div class="prog-card-body">
        <span class="letter-badge">${esc(sum.letter)}</span>
        <div class="prog-card-ex"><div>${esc(sum.line)}</div>${sum.sets?`<div class="muted">${esc(sum.sets)}</div>`:''}</div>
      </div>
    </div>${menu}</div>`;
}

function programHtml(){
  const p = prog(ui.programId);
  if (!p) return libraryHtml();
  ui.lib = 'programs';
  const weeks = Math.max(1, Number(p.weeks)||1);
  const dayHeads = [1,2,3,4,5,6,7].map(d => `<div class="prog-day-h">Day ${d}</div>`).join('');
  const weekBlocks = Array.from({ length: weeks }, (_, i) => {
    const w = i + 1;
    const cells = [1,2,3,4,5,6,7].map(d => programCellHtml(p, w, d)).join('');
    return `<div class="prog-week"><div class="prog-week-label">Week ${w}</div>
      <div class="prog-days">${dayHeads}${cells}</div></div>`;
  }).join('');
  const pasteHint = ui.cellPick && (ui.cellPick.mode === 'copyTarget' || ui.cellPick.mode === 'moveTarget')
    ? `<p class="prog-hint">${ui.cellPick.mode==='moveTarget'?'Click an empty cell to move the session.':'Click an empty cell to paste the copy.'} <button type="button" class="btn ghost small" onclick="closeCellPick()">Cancel</button></p>`
    : '';
  return `<button type="button" class="btn ghost small" onclick="go('library',{lib:'programs'})">← Back to programs</button>
    <div class="prog-toolbar" style="margin-top:12px">
      <input class="prog-title" value="${esc(p.name)}" aria-label="Program title" oninput="prog(ui.programId).name=this.value;persist()">
      <div class="prog-icons">
        <button type="button" class="prog-icon" title="Preview program" onclick="ui.programPreview=true;render()">${progIcon('eye')}</button>
        <button type="button" class="prog-icon" title="Save to folder (coming soon)" disabled>${progIcon('folder')}</button>
        <button type="button" class="prog-icon" title="Program settings" onclick="ui.programSettings=true;ui.programSettingsTab='general';render()">${progIcon('gear')}</button>
        <button type="button" class="btn small" onclick="go('assign',{programId:ui.programId})">Assign</button>
      </div>
    </div>
    ${pasteHint}
    ${weekBlocks}
    <div class="prog-footer">
      <button type="button" class="btn" onclick="addWeek()">Add week</button>
      <span class="muted">Empty cells stay blank — click to place a session template.</span>
    </div>
    ${templatePickerHtml()}${programSettingsHtml()}${programPreviewHtml(p)}`;
}
function programPreviewHtml(p){if(!ui.programPreview)return '';const days=Object.entries(p.cells||{}).filter(([,id])=>tpl(id)).sort(([a],[b])=>{const [aw,ad]=a.split('-').map(Number),[bw,bd]=b.split('-').map(Number);return aw-bw||ad-bd;});return `<div class="profile-overlay" onclick="if(event.target===this){ui.programPreview=false;render()}"><aside class="profile-drawer" role="dialog" aria-label="Program preview"><div class="profile-head"><b style="flex:1">${esc(p.name)}</b><button class="btn small" aria-label="Close program preview" onclick="ui.programPreview=false;render()">×</button></div><div class="profile-body"><p class="muted">Original coach sessions, not local native strength drafts. No athlete logs or assignments are created.</p>${days.map(([key,id])=>{const t=tpl(id),[week,day]=key.split('-');return `<h2>Week ${week} · Day ${day}</h2><h3>${esc(t.name)}</h3><p style="white-space:pre-wrap">${esc(t.coachInstructions||'')}</p>${blockDetail(t)}`;}).join('')||'<p>No sessions placed in this program.</p>'}</div></aside></div>`;}

function coachExerciseSummary(ex){
  return L.prescriptionLine(ex);
}

function syncCoachExFromColumns(bi, ei){
  if (!window.LogColumns) return;
  const ex = tpl(ui.templateId).blocks[bi].exercises[ei];
  LogColumns.syncLegacyFromColumns(ex, LogColumns.getSheetColumns(), LogColumns.getSetCount());
  ex.restSec = LogColumns.getRestSec();
  L.ensureRows(ex);
  persist();
}

function openCoachExEdit(bi, ei){
  closeCoachExEdit();
  ui.exEdit = { bi, ei };
  const ex = tplBlocks()[bi].exercises[ei];
  if (window.LogColumns) {
    LogColumns.beginSheet(ex);
    LogColumns.setChangeHandler(() => syncCoachExFromColumns(bi, ei));
  }
  render();
}

function closeCoachExEdit(){
  if (ui.exEdit && window.LogColumns) {
    syncCoachExFromColumns(ui.exEdit.bi, ui.exEdit.ei);
    LogColumns.setChangeHandler(null);
  }
  ui.exEdit = null;

function patchCoachExTargetRir(bi, ei, raw){
  const ex = tplBlocks()[bi].exercises[ei];
  const v = String(raw == null ? '' : raw).trim();
  if (!v) delete ex.targetRir;
  else {
    const n = Math.max(0, Math.min(10, Math.round(Number(v))));
    if (Number.isFinite(n)) ex.targetRir = n;
  }
  if (ui.exEdit && window.LogColumns) LogColumns.setTargetRir(ex.targetRir);
  persist();
}

function coachTargetRirField(bi, ei){
  const ex = tplBlocks()[bi].exercises[ei];
  const val = ex.targetRir != null ? ex.targetRir : '';
  return `<div class="field" style="margin-top:8px"><label>Target RIR</label>
    <input type="number" min="0" max="10" step="1" placeholder="2 (default)" value="${val}" aria-label="Target reps in reserve" onchange="patchCoachExTargetRir(${bi},${ei},this.value)">
    <p class="muted" style="margin:4px 0 0;font-size:11px">In-session autoreg aims for this many reps in reserve. Blank uses engine default (2).</p></div>`;
}
