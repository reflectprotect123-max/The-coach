function parseSets(tid, bi, ei, raw){
  const t = tpl(tid); const e = t.blocks[bi].exercises[ei];
  const m = String(raw).match(/(\d+)\s*[x×]\s*(.+)/i);
  if (m){ e.sets = Number(m[1]); e.reps = m[2].trim(); }
  persist();
}

function addEx(bi){
  const t = tpl(ui.templateId);
  t.blocks[bi].exercises = t.blocks[bi].exercises || [];
  t.blocks[bi].exercises.push(L.makeExercise({ name:'New lift', autopilotVolume:true, load:'', metric:'Weight', restSec:90 }));
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function removeEx(bi, ei){
  if (ui.exEdit && ui.exEdit.bi === bi && ui.exEdit.ei === ei) closeCoachExEdit();
  const t = tpl(ui.templateId);
  t.blocks[bi].exercises.splice(ei, 1);
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function addBlk(type){
  const t = tpl(ui.templateId);
  const partial = type === 'recovery'
    ? { type:'conditioning', heading:'Recovery movement', category:'Recovery', scoring:'completion', recoverySession:true, condFmt:'steady', effort:'easy', modality:'Mixed', baselineDurationMin:30, targetDurationMin:30, timeCapMin:30, notes:'Mixed modal — walk, easy bike, mobility. Log time and feel, not output.' }
    : type === 'conditioning'
    ? { type:'conditioning', heading:'Steady-state', category:'Conditioning', scoring:'completion', condFmt:'steady', effort:'easy', modality:'Bike', targetDurationMin:20 }
    : type === 'text'
      ? { type:'text', heading:'Prep', category:'Prep', scoring:'completion', notes:'' }
      : { type:'strength', heading:'Strength', category:'Strength/Power', scoring:'weight', exercises:[L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'8', load:'', metric:'Weight' })] };
  t.blocks.push(L.makeBlock(partial));
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function clearCondFields(b){
  delete b.recoverySession;
  delete b.baselineDurationMin;
  delete b.condFmt;
  delete b.modality;
  delete b.targetDurationMin;
  delete b.conditioningType;
  delete b.effort;
  delete b.timeCapMin;
  delete b.rounds;
  delete b.workSec;
  delete b.restSec;
  delete b.targetHrZone;
  delete b.targetPace;
  delete b.targetWatts;
  delete b.targetDistance;
}

function setBlockType(bi, type){
  closeCoachExEdit();
  const t = tpl(ui.templateId);
  const b = t.blocks[bi];
  if (!b) return;
  if (b.supersetPartner && bi > 0) t.blocks[bi - 1].superset = false;
  if (b.superset && t.blocks[bi + 1]?.supersetPartner) delete t.blocks[bi + 1].supersetPartner;
  if (type === 'strength') {
    b.type = 'strength';
    b.scoring = b.scoring === 'completion' ? 'completion' : 'weight';
    b.category = 'Strength/Power';
    clearCondFields(b);
    if (!(b.exercises || []).length) {
      b.exercises = [L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'8', load:'', metric:'Weight' })];
    }
  } else if (type === 'conditioning') {
    b.superset = false;
    delete b.exercises;
    delete b.recoverySession;
    delete b.baselineDurationMin;
    L.applyCondBuilderToBlock(b, { condFmt:'steady', effort:'easy', modality:'Bike', targetDurationMin:20, heading:b.heading || 'Steady-state' });
    b.category = 'Conditioning';
  } else if (type === 'recovery') {
    b.superset = false;
    delete b.exercises;
    b.recoverySession = true;
    b.baselineDurationMin = L.num(b.baselineDurationMin) || L.num(b.targetDurationMin) || 30;
    L.applyCondBuilderToBlock(b, { condFmt:'steady', effort:'easy', modality:'Mixed', targetDurationMin:b.baselineDurationMin, heading:b.heading || 'Recovery movement' });
    b.category = 'Recovery';
    b.type = 'conditioning';
  } else {
    b.type = 'text';
    b.category = 'Prep';
    b.scoring = 'completion';
    b.superset = false;
    delete b.exercises;
    clearCondFields(b);
  }
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function blockTypeValue(b){
  if (!b) return 'strength';
  if (b.type === 'text') return 'text';
  if (b.recoverySession) return 'recovery';
  if (b.type === 'conditioning') return 'conditioning';
  return 'strength';
}

function blockTypeSelectHtml(i, b){
  const v = blockTypeValue(b);
  return `<select class="grow" aria-label="Block type" onchange="setBlockType(${i}, this.value)">
    <option value="strength" ${v==='strength'?'selected':''}>Strength</option>
    <option value="conditioning" ${v==='conditioning'?'selected':''}>Conditioning</option>
    <option value="recovery" ${v==='recovery'?'selected':''}>Recovery</option>
    <option value="text" ${v==='text'?'selected':''}>Prep notes</option>
  </select>`;
}

function removeBlk(bi){
  if (!confirm('Delete this block?')) return;
  if (ui.exEdit && ui.exEdit.bi === bi) closeCoachExEdit();
  const t = tpl(ui.templateId);
  const b = t.blocks[bi];
  if (b?.supersetPartner && bi > 0) t.blocks[bi - 1].superset = false;
  if (b?.superset && t.blocks[bi + 1]?.supersetPartner) delete t.blocks[bi + 1].supersetPartner;
  t.blocks.splice(bi, 1);
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function isSupersetPartnerBlock(blocks, bi){
  const b = blocks[bi];
  if (!b || blockTypeValue(b) !== 'strength') return false;
  if (b.supersetPartner) return true;
  const prev = blocks[bi - 1];
  return !!(prev && prev.superset && blockTypeValue(prev) === 'strength');
}

function toggleSuperset(bi, on){
  const t = tpl(ui.templateId);
  t.blocks.forEach((b) => {
    delete b.supersetPartner;
  });
  t.blocks[bi].superset = on;
  if (on) {
    const next = t.blocks[bi + 1];
    if (!next || blockTypeValue(next) !== 'strength') {
      showCoachToast('Add a strength block after this one to complete the superset pair.', 'warn');
    }
  }
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function moveBlock(from, to){
  closeCoachExEdit();
  const t = tpl(ui.templateId);
  if (!t) return;
  t.blocks = L.decorateBlocks(L.reorderBlocks(t.blocks, from, to));
  persist();
  render();
}

function initBlockDrag(){
  const list = document.getElementById('coachBlockList');
  if (!list) return;
  let dragFrom = null;
  list.querySelectorAll('.block-drag-handle').forEach((handle) => {
    handle.addEventListener('dragstart', (ev) => {
      dragFrom = Number(handle.dataset.blockIndex);
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', String(dragFrom));
      handle.closest('.block-card')?.classList.add('dragging');
    });
    handle.addEventListener('dragend', () => {
      dragFrom = null;
      list.querySelectorAll('.block-card').forEach((el) => {
        el.classList.remove('dragging', 'drop-target');
      });
    });
  });
  list.querySelectorAll('.block-card').forEach((card) => {
    card.addEventListener('dragover', (ev) => {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      card.classList.add('drop-target');
    });
    card.addEventListener('dragleave', (ev) => {
      if (!card.contains(ev.relatedTarget)) card.classList.remove('drop-target');
    });
    card.addEventListener('drop', (ev) => {
      ev.preventDefault();
      card.classList.remove('drop-target');
      const from = dragFrom != null ? dragFrom : Number(ev.dataTransfer.getData('text/plain'));
      const to = Number(card.dataset.blockIndex);
      if (Number.isFinite(from) && Number.isFinite(to)) moveBlock(from, to);
    });
  });
}

function openExPicker(bi, ei){
  closeCoachExEdit();
  ui.exPicker = { bi, ei };
  ui.exSearch = '';
  render();
}

function coachExerciseSuggestHits(query){
  const q = String(query||'').trim();
  if (q.length < 1) return [];
  if (window.ExerciseSearch?.search) {
    const hits = ExerciseSearch.search(q, 12);
    return ExerciseSearch.mergeCustomHits(hits, S.exercises||[], q, 12);
  }
  const ql = q.toLowerCase();
  return (S.exercises||[]).filter(e => String(e.name||'').toLowerCase().includes(ql) || String(e.category||'').toLowerCase().includes(ql))
    .slice(0, 12).map(e => ({ exerciseId: e.id, name: e.name, category: e.category||'Custom' }));
}

function ensureCoachExerciseInCatalog(exerciseId, name, category){
  if (!exerciseId) return;
  S.exercises = S.exercises || [];
  let row = S.exercises.find(e => e.id === exerciseId);
  if (!row) {
    row = { id: exerciseId, name: name||exerciseId, category: category||'Custom', builtIn: !!ExerciseSearch?.byId?.(exerciseId), source: ExerciseSearch?.byId?.(exerciseId) ? 'THE-core-120' : 'coach-custom' };
    S.exercises.push(row);
  } else {
    if (name) row.name = name;
    if (category) row.category = category;
  }
}

function closeExPicker(){ ui.exPicker = null; ui.exSearch = ''; render(); }

function pickExerciseVariant(exerciseId, name, category){
  if (!ui.exPicker) return;
  ensureCoachExerciseInCatalog(exerciseId, name, category);
  const t = tpl(ui.templateId);
  const ex = t.blocks[ui.exPicker.bi].exercises[ui.exPicker.ei];
  ex.name = name || ex.name;
  ex.exerciseId = exerciseId || ex.exerciseId;
  ex.category = category || ex.category;
  ui.exPicker = null;
  ui.exSearch = '';
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function filteredExercises(){
  const q = String(ui.exSearch||'').trim();
  if (q) return coachExerciseSuggestHits(q).map(h => ({ id: h.exerciseId, name: h.name, category: h.category }));
  return (S.exercises||[]).slice(0, 80);
}

function exercisePickerHtml(){
  if (!ui.exPicker) return '';
  const q = String(ui.exSearch||'').trim();
  const hits = coachExerciseSuggestHits(q);
  const list = hits.length
    ? hits.map(x => `<button type="button" class="picker-item" onclick='pickExerciseVariant(${JSON.stringify(x.exerciseId||'')},${JSON.stringify(x.name)},${JSON.stringify(x.category||'Custom')})'><span>${esc(x.name)}</span><span class="muted">${esc(x.category||'Custom')}</span></button>`).join('')
    : (q ? '<div class="muted">No library match — try another variant name.</div>' : '<div class="muted">Type to search exercise variants (names only).</div>');
  return `<div class="picker-overlay" onclick="if(event.target===this)closeExPicker()">
    <div class="picker-panel" role="dialog" aria-label="Choose exercise">
      <div class="row"><b>Choose exercise</b><button type="button" class="btn ghost small" onclick="closeExPicker()">Close</button></div>
      <div class="field" style="margin-top:12px"><label>Search variants</label>
        <input value="${esc(ui.exSearch)}" oninput="ui.exSearch=this.value;render()" placeholder="deadlift, lateral raise…" autofocus></div>
      <div class="picker-list">${list}</div>
    </div></div>`;
}

function setRowsTable(bi, ei){
  const e = tplBlocks()[bi].exercises[ei];
  const n = Math.max(1, Number(e.sets) || 1);
  const reps = L.targetList(e);
  const loads = L.loadList(e);
  let rows = '';
  for (let i = 0; i < n; i++) {
    rows += `<tr><td>${i+1}</td><td><input value="${esc(reps[i] ?? e.reps ?? '')}" oninput="setRowRep(${bi},${ei},${i},this.value)"></td>
      <td><input value="${esc(loads[i] ?? '')}" oninput="setRowLoad(${bi},${ei},${i},this.value)" placeholder="Load"></td></tr>`;
  }
  return `<table class="set-table"><thead><tr><th>Set</th><th>Reps</th><th>Load</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function setRowRep(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.targetList(e);
  while (parts.length < (e.sets || 1)) parts.push(String(e.reps || ''));
  parts[ri] = val;
  for (let i = ri + 1; i < parts.length; i++) parts[i] = val;
  e.reps = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
  render();
}

function setRowLoad(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.loadList(e);
  while (parts.length < (e.sets || 1)) parts.push('');
  parts[ri] = val;
  e.load = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
}

function patchCond(bi, patch){
  const t = tpl(ui.templateId);
  L.applyCondBuilderToBlock(t.blocks[bi], patch);
  persist(); render();
}

function nudgeCondMin(bi, delta){
  const b = tplBlocks()[bi];
  const cur = Number(b.targetDurationMin) || 20;
  patchCond(bi, { targetDurationMin: Math.max(1, Math.min(180, cur + delta)) });
}

function setCondFmt(bi, key){
  const fmt = L.condFormatMeta(key);
  const patch = { condFmt:key, heading:fmt.name };
  if (L.fmtNeedsIntervalFields(fmt)) {
    patch.rounds = fmt.rounds || 4;
    patch.workSec = fmt.workSec || 240;
    patch.restSec = fmt.restSec || 180;
  }
  patchCond(bi, patch);
}

function modalityWantsWatts(mod){
  const m = String(mod||'').toLowerCase();
  return m.includes('bike') || m.includes('echo') || m.includes('air');
}

function condEngineHtml(b, bi){
  const fmt = L.condFormatMeta(b.condFmt || 'steady');
  const effort = L.condEffortMeta(b.effort || 'easy');
  const interval = L.fmtNeedsIntervalFields(fmt);
  const plan = L.condPlanLineBlock(b) || '—';
  const fmtOpts = L.COND_FORMATS.map(f => `<option value="${f.key}" ${fmt.key===f.key?'selected':''}>${esc(f.name)}</option>`).join('');
  const modOpts = L.COND_MODALITIES.map(m => `<option ${b.modality===m?'selected':''}>${esc(m)}</option>`).join('');
  const chips = L.COND_EFFORTS.map(e => {
    const on = effort.key === e.key;
    return `<button type="button" class="eff ${esc(e.key)}${on?' on':''}" aria-pressed="${on?'true':'false'}" onclick="patchCond(${bi},{effort:'${e.key}'})"><b>${esc(e.name)}</b><small>RPE ${esc(e.rpe)}</small></button>`;
  }).join('');
  const timing = interval
    ? `<div class="engine-fields" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">
        <div class="field"><label>Rounds</label><input type="number" min="1" step="1" value="${esc(b.rounds||fmt.rounds||1)}" onchange="patchCond(${bi},{rounds:Number(this.value)||1})"></div>
        <div class="field"><label>Work</label><input value="${esc(L.formatMmSs(b.workSec||fmt.workSec||30))}" onchange="patchCond(${bi},{workSec:L.parseMmSs(this.value)})"></div>
        <div class="field"><label>Rest</label><input value="${esc(L.formatMmSs(b.restSec!=null?b.restSec:(fmt.restSec||90)))}" onchange="patchCond(${bi},{restSec:L.parseMmSs(this.value)})"></div>
      </div><p class="engine-hint">Total ≈ ${L.condIntervalTotalMin(b)} min · stored as seconds.</p>`
    : `<div class="field" style="margin-top:10px"><label>Minutes</label>
        <div class="mins-row">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},-5)">−</button>
          <input type="number" min="1" max="180" value="${esc(b.targetDurationMin||20)}" onchange="patchCond(${bi},{targetDurationMin:Number(this.value)||20})">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},5)">+</button>

    ? `<div class="field" style="margin-top:10px"><label>Target watts <span class="muted">(optional)</span></label>

      <div class="field"><label>Modality</label><select onchange="patchCond(${bi},{modality:this.value})">${modOpts}</select></div>
    </div>

    ${timing}
    ${watts}
    <div class="field" style="margin-top:10px"><label>Coach notes</label>
      <textarea oninput="tpl(ui.templateId).blocks[${bi}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>
  </div>`;
}

function blockExerciseHtml(b, bi){

function exportBridgeFile(){
  if (!window.CoachBridge) return alert('Bridge module missing');
  const r = CoachBridge.push(S);
  if (!r.ok) return alert('Export failed: ' + (r.error||''));
  const blob = new Blob([JSON.stringify(r.payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'the-coach-bridge-' + (r.payload.exportedAt||'').slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function growTextAreas(){
  try {
    document.querySelectorAll('.prep-textarea, .instructions-box textarea').forEach(function(el){
      el.style.height = 'auto';
      el.style.height = Math.max(el.scrollHeight, 200) + 'px';

}

function render(){
  CoachTools.init({ L, S, ui, esc, render });
  const acc = account();
  $('gate').classList.add('hidden');
  $('coachApp').classList.add('hidden');
  if (!acc || acc.role !== 'coach'){
    if (acc) { L.logout(S); persist(); }
    $('gate').classList.remove('hidden'); $('gate').innerHTML = gateHtml(); return;
  }
  $('coachApp').classList.remove('hidden');
  let body = '';
  if (ui.view==='athletes') body = athleteListHtml();
  else if (ui.view==='athlete') body = athleteCalHtml();
  else if (ui.view==='teams') body = teamListHtml();
  else if (ui.view==='team') body = teamCalHtml();
  else if (ui.view==='library') body = libraryHtml();
  else if (ui.view==='program') body = programHtml();
  else if (ui.view==='session') body = sessionHtml();
  else if (ui.view==='assign') body = assignHtml();
  else if (ui.view==='nutrition') body = nutritionHtml();
  else if (ui.view==='analytics') body = CoachTools.analyticsHtml();
  else if (ui.view==='gym') body = CoachTools.gymHtml();
  else if (ui.view==='account') body = CoachTools.accountHtml();
  else body = feedHtml();
  $('coachApp').innerHTML = coachChrome(body);
  CoachTools.afterRender();
  const dialog=Array.from($('coachApp').querySelectorAll('[role="dialog"]')).at(-1);
  const dialogKey=dialog?.getAttribute('aria-label')||'';
  if(dialog){dialog.setAttribute('aria-modal','true');dialog.setAttribute('tabindex','-1');if(ui.activeDialog!==dialogKey)(dialog.querySelector('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')||dialog).focus();}
  ui.activeDialog=dialogKey;
  if (ui.view === 'library' && ui.lib === 'sessions') updateSessionSelection();
  if (ui.view === 'session') {
    growTextAreas();
    initBlockDrag();
  }
  scheduleRefreshCloudStates();
}

document.addEventListener('click', function coachKebabDismiss(ev) {
  if(ui.homeCalendarOpen && !ev.target?.closest?.('.home-date-popover,[aria-label="Choose date"]')){
    ui.homeCalendarOpen=false;document.querySelector('.home-date-popover')?.remove();
  }
  if (!ui.cellMenu && !ui.chipMenu) return;
  if (ev.target && ev.target.closest && ev.target.closest('.kebab-menu, .kebab-btn')) return;
  let changed = false;
  if (ui.cellMenu) { ui.cellMenu = null; changed = true; }
  if (ui.chipMenu) { ui.chipMenu = null; changed = true; }
  if (changed) render();
});
document.addEventListener('keydown',function coachReviewEscape(ev){
  if(ev.key==='Tab'){
    const dialog=Array.from($('coachApp').querySelectorAll('[role="dialog"]')).at(-1);
    if(dialog){const controls=Array.from(dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')).filter(el=>el.getClientRects().length&&!el.hidden);
      const first=controls[0],last=controls.at(-1);
      if(!first){ev.preventDefault();dialog.focus();}
      else if(ev.shiftKey&&(!dialog.contains(document.activeElement)||document.activeElement===first)){ev.preventDefault();last.focus();}
      else if(!ev.shiftKey&&(!dialog.contains(document.activeElement)||document.activeElement===last)){ev.preventDefault();first.focus();}
    }
  }
  if(ev.key!=='Escape')return;
  if(ui.commentDrawer){ev.preventDefault();closeCommentDrawer();}
  else if(ui.homeCalendarOpen){ev.preventDefault();ui.homeCalendarOpen=false;document.querySelector('.home-date-popover')?.remove();document.querySelector('[aria-label="Choose date"]')?.focus();}
  else if(ui.catalogEdit){ev.preventDefault();closeCatalogExercise();}
  else if(ui.calendarPreview){ev.preventDefault();CoachViews.closeCalendarPreview();}
  else if(ui.programPreview){ev.preventDefault();ui.programPreview=false;render();}
  else if(ui.programSettings){ev.preventDefault();closeProgramSettings();}
  else if(ui.libPick){ev.preventDefault();ui.libPick=null;render();}
  else if(ui.cellPick){ev.preventDefault();closeCellPick();}
  else if(ui.athleteProfileId){ev.preventDefault();CoachViews.closeAthleteProfile();}
  else if(ui.teamSettingsId){ev.preventDefault();CoachViews.closeTeamSettings();}
  else if(ui.teamInviteId){ev.preventDefault();CoachViews.closeTeamInvite();}
  else if(ui.createTeam){ev.preventDefault();CoachViews.closeCreateTeam();}
  else if(ui.sidebarOpen){ev.preventDefault();toggleCoachSidebar(false);}
});

(async function coachAuthBoot(){
  try {
    if (!(window.Whoop && Whoop.client)) return;
    const { data } = await Whoop.client().auth.getSession();
    const session = data && data.session;
    if (!session || !session.user) return;
    const email = session.user.email;
    if (!email) return;
    const meta = session.user.user_metadata || {};
    const name = meta.full_name || meta.name || email.split('@')[0];
    // Already in as matching coach — leave UI alone.
    const acc = account();
    if (acc && acc.role === 'coach' && String(acc.email || '').toLowerCase() === email.toLowerCase()) {
      console.info('coach cloud: signed in', email);
      return;
    }
    // Session present but gate still up (or wrong local user) — enter coach workspace.
    if (!acc || acc.role !== 'coach') {
      ensureCoachAccount(email, name);
      persist();
      render();
    }
  } catch (_) {}
})();
