      overlay.querySelector('#sbResults').innerHTML=Lib.searchCatalog(library,'exercises',q).map(hit=>`<button type="button" class="sb-result" data-action="add" data-catalog-id="${esc(hit.id)}"><strong>${esc(hit.title)}</strong><span>+ Add</span></button>`).join('') || '<p>No exercises found. Add a custom exercise below.</p>';
    }
    overlay.addEventListener('input',event=>{if(event.target.id==='sbSearch') search();});
    overlay.addEventListener('change',event=>{
      const el=event.target;
      if(el.id==='sbSessionTitle') return save(Lib.patchTemplate(library,tid,{title:el.value}),false);
      if(el.id==='sbInstructions') return save(Lib.patchTemplate(library,tid,{instructions:el.value}),false);
      const bid=el.closest('[data-bid]')?.dataset.bid;
      if(!bid || !el.dataset.field) return;
      const key=el.dataset.field;
      if(['setCount','restSec'].includes(key) && (!el.checkValidity() || el.value==='')) {el.reportValidity();return;}
      let patch;
      if(key==='col1'||key==='col2') {
        const block=el.closest('[data-bid]');
        patch={columns:[block.querySelector('[data-field="col1"]').value,block.querySelector('[data-field="col2"]').value]};
      } else patch={[key]:key==='notes'?el.value.split('\n').filter(Boolean):['setCount','restSec'].includes(key)?Number(el.value):el.value};
      // Keep the edited DOM in place: blur must not swallow the next button click.
      save(Lib.patchBlock(library,tid,bid,patch),false);
      const card=el.closest('[data-bid]');
      const letter=Lib.lettered(current()).find(b=>b.id===bid)?.letter;
      const rx=Lib.compile(current()).blocks.find(b=>b.letter===letter)?.prescription;
      if(card.querySelector('.sb-rx strong')) card.querySelector('.sb-rx strong').textContent=rx || '';
      if(key==='title') for(const [action,label] of [['up','Move'],['down','Move'],['remove','Delete']]) {
        card.querySelector(`[data-action="${action}"]`).setAttribute('aria-label',`${label} ${el.value}${action==='remove'?'':` ${action}`}`);
      }
    });
    overlay.addEventListener('click',event=>{
      const button=event.target.closest('[data-action]');if(!button) return;
      const action=button.dataset.action, bid=button.closest('[data-bid]')?.dataset.bid;
      if(action==='picker') {overlay.querySelector('#sbPicker').hidden=false;search();overlay.querySelector('#sbSearch').focus();}
      else if(action==='close-picker') overlay.querySelector('#sbPicker').hidden=true;
      else if(action==='circuit') save(Lib.addCircuit(library,tid,{title:'Warm-up circuit'}));
      else if(action==='add') save(Lib.addExercise(library,tid,{catalogId:button.dataset.catalogId}));
      else if(action==='custom') {
        const title=overlay.querySelector('#sbSearch').value.trim();
        if(title) {let next=Lib.createCatalogExercise(library,{title,columns:['reps','weight_kg']});next=Lib.addExercise(next,tid,{catalogId:next.catalog.exercises[0].id});save(next);search();}
      } else if(action==='remove') {if(root.confirm('Delete this block from the strength draft? Original coach blocks will remain unchanged.')) save(Lib.removeBlock(library,tid,bid));}
      else if(action==='up'||action==='down') save(Lib.moveBlock(library,tid,bid,action==='up'?-1:1));
      else if(action==='unlink') save(Lib.unlinkSuperset(library,tid,bid));
      else if(action==='link') {const blocks=current().blocks,index=blocks.findIndex(b=>b.id===bid);if(blocks[index+1]) save(Lib.linkSuperset(library,tid,bid,blocks[index+1].id));}
    });
    const close=()=>{window.removeEventListener('message',receive);overlay.remove();document.body.style.overflow=originalOverflow;if(onClose) onClose();opener?.focus();};
    overlay.querySelector('#restartStrengthPreview').onclick=()=>{preview.srcdoc=window.__COACH_PREVIEW_HTML;};
    overlay.querySelector('#closeStrengthBuilder').onclick=close;
    overlay.addEventListener('keydown',event=>{
      if(event.key==='Escape') close();
      if(event.key!=='Tab') return;
      const focusable=[...overlay.querySelectorAll('button:not(:disabled),input,textarea,select,summary,iframe')].filter(el=>el.getClientRects().length);
      const first=focusable[0],last=focusable[focusable.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    });
    paintBlocks();overlay.querySelector('#closeStrengthBuilder').focus();
  }
  root.StrengthBuilder={convert,open};
  if(typeof module==='object') module.exports=root.StrengthBuilder;
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
const L = window.CoachLoop;
const N = window.CoachNutrition;
let S = L.mergeExerciseCatalog(L.loadState());
const ui = {
  view:'home', lib:'programs', athleteId:null, teamId:null, programId:null, templateId:null, sessionId:null,
  expandAll:false, expanded:{}, err:'', exPicker:null, exSearch:'', exEdit:null,
  cellMenu:null, cellPick:null, progSearch:'',
  calMonth:null, calDay:null, chipMenu:null, libPick:null,
  assignTeamId:null, assignStart:null, nutAthleteId:null,
  exCatalogSearch:'', sessionSearch:'', sessionSelected:{}, sessionNotice:'', commentDrawer:null, filterAthlete:'all',
  homeMode:'latest', homeDate:L.today(), homeCalendarOpen:false, homePickerMonth:L.today().slice(0,7),
  rosterSearch:'', rosterGroup:'all', rosterStatus:'active', rosterSelected:{}, athleteProfileId:null, athleteProfileTab:'exercises',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dash = (v) => (v == null || v === '') ? '–' : String(v);
function persist(){
  L.saveState(null, S);
  if (window.CoachBridge) CoachBridge.push(S);
  if (window.CoachViews) CoachViews.bindState(S);
  scheduleCloudPush();
}

let cloudPushTimer = null;
function scheduleCloudPush(){
  if (!window.CoachCloud) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(async () => {
    try {
      if (!(await CoachCloud.isSignedIn())) return;
      const r = await CoachCloud.pushPublished(S);
      L.saveState(null,S);
      if (r && r.errors && r.errors.length) console.warn('coach cloud push', r.errors);
    } catch (e) {
      console.warn('coach cloud push failed', e);
    }
  }, 800);
}

async function bindMyCloudIdToAthlete(athleteId){
  if (!window.CoachCloud) return alert('Cloud module missing');
  const uid = await CoachCloud.sessionUserId();
  if (!uid) return alert('Sign in first (coach Settings / WHOOP account — same Supabase as athlete).');
  const a = athleteBy(athleteId);
  if (!a) return;
  a.cloudUserId = uid;
  persist(); render();
  showCoachToast('Linked ' + a.name + ' to your signed-in account.', 'ok');
}

async function pushCloudNow(){
  if (!window.CoachCloud) return alert('Cloud module missing');
  if (!(await CoachCloud.isSignedIn())) return alert('Sign in with the athlete Supabase account (WHOOP sign-in) so publish can write assigned_session.');
  const r = await CoachCloud.pushPublished(S);
  L.saveState(null,S);
  coachPortalToast(r, '');
  render();
}

let coachToastTimer = null;
function showCoachToast(msg, tone){
  if (!msg) return;
  const old = document.querySelector('.coach-toast');
  if (old) old.remove();
  clearTimeout(coachToastTimer);
  const el = document.createElement('div');
  el.className = 'coach-toast' + (tone === 'ok' ? ' ok' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  coachToastTimer = setTimeout(() => { el.remove(); }, 4500);
}
window.showCoachToast = showCoachToast;

function coachPortalToast(result, athleteName){
  if (!result) return;
  if (result.ok) {
    const n = result.pushed || 0;
    const who = athleteName ? ' to ' + athleteName : '';
    showCoachToast(n ? 'Published ' + n + ' session(s)' + who + '. Phone syncs on next open.' : 'No new sessions published. Logged or existing assignments were left unchanged.', 'ok');
    return;
  }
  const msg = (result.errors || []).map(e => e.error).join('; ') || result.reason || result.error || 'Push failed';
  showCoachToast('Cloud push: ' + msg, 'warn');
}
window.coachPortalToast = coachPortalToast;

let refreshStatesTimer = null;
function scheduleRefreshCloudStates(){
  clearTimeout(refreshStatesTimer);
  refreshStatesTimer = setTimeout(async () => {
    if (ui._cloudRefresh || !window.CoachCloud || !CoachCloud.refreshPublishedStates) return;
    try {
      if (!(await CoachCloud.isSignedIn())) return;
      ui._cloudRefresh = true;
      const r = await CoachCloud.refreshPublishedStates(S);
      if (r.ok && r.updated) { L.saveState(null, S); render(); }
    } catch (e) {
      console.warn('coach cloud refresh', e);
    } finally {
      ui._cloudRefresh = false;
    }
  }, 900);
}
function account(){ return L.currentAccount(S); }
function athleteBy(id){ return (S.athletes||[]).find(a => a.id === id); }
function tpl(id){ return (S.templates||[]).find(t => t.id === id); }
function ses(id){ return (S.sessions||[]).find(s => s.id === id); }
function prog(id){ return (S.programs||[]).find(p => p.id === id); }
function team(id){ return (S.teams||[]).find(t => t.id === id); }

function go(view, extra){
  const wasSidebarOpen=ui.sidebarOpen;
  ui.sidebarOpen=false;
  if (view !== 'session') closeCoachExEdit();
  Object.assign(ui, extra||{}, { view });
  if (view === 'library' && !ui.lib) ui.lib = 'programs';
  if (view !== 'session') ui.exPicker = null;
  if (view !== 'program') {
    ui.programPreview=false;ui.programSettings=false;
    ui.cellMenu = null;
    if (!ui.cellPick || (ui.cellPick.mode !== 'copyTarget' && ui.cellPick.mode !== 'moveTarget')) {
      ui.cellPick = null;
    }
  }
  if (view !== 'athlete' && view !== 'team') {
    ui.chipMenu = null;
    ui.libPick = null;
    ui.calDay = null;
    ui.calendarPreview=null;
  }
  if (view !== 'home') ui.commentDrawer = null;
  if (view === 'assign' && !ui.assignTeamId && S.teams && S.teams[0]) ui.assignTeamId = S.teams[0].id;
  render();
  if(wasSidebarOpen)document.getElementById('coachNavigationToggle')?.focus();
}
function toggleCoachSidebar(open){ui.sidebarOpen=typeof open==='boolean'?open:!ui.sidebarOpen;render();if(!ui.sidebarOpen)document.getElementById('coachNavigationToggle')?.focus();}
function openSession(templateId){
  closeCoachExEdit();
  ui.cellMenu = null;
  ui.templateId = templateId;
  ui.lib = 'sessions';
  ui.exPicker = null;
  ui.view = 'session';
  render();
}
function openProgram(programId){
  ui.programId = programId;
  ui.lib = 'programs';
  ui.cellMenu = null;
  ui.cellPick = null;
  ui.view = 'program';
  render();
}
async function signOut(){
  try {
    if (window.Whoop && typeof Whoop.client === 'function') {
      await Whoop.client().auth.signOut();
    }
  } catch (_) { /* best-effort */ }
  L.logout(S);
  persist();
  ui.view = 'home';
  ui.err = '';
  render();
}
function resetDemo(){
  if(!confirm('Replace this device\'s coach data with demo data? Download a local backup from Coach settings first. Cloud records are not deleted.'))return;
  S = L.resetState();
  Object.assign(ui, { view:'home', lib:'sessions', templateId:null, programId:null, cellMenu:null, cellPick:null, exPicker:null, err:'', calMonth:null, calDay:null, chipMenu:null, libPick:null });
  if (window.CoachViews) CoachViews.bindState(S);
  render();
}

/** Ensure a local coach account row for a Supabase-authenticated email. */
function ensureCoachAccount(email, name){
  const e = String(email || '').trim().toLowerCase();
  if (!e) return null;
  S.accounts = S.accounts || [];
  let acc = S.accounts.find((a) => a.role === 'coach' && String(a.email || '').toLowerCase() === e);
  if (!acc) {
    acc = {
      id: 'coach-cloud-' + e.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
      email: e,
      password: '',
      role: 'coach',
      name: name || e.split('@')[0] || 'Coach',
      athleteId: null,
    };
    S.accounts.push(acc);
  } else if (name) {
    acc.name = name;
  }
  S.coach = S.coach || { id: acc.id, name: acc.name };
  S.coach.name = acc.name;
  S.currentUserId = acc.id;
  return acc;
}

async function tryLogin(email, pass){
  ui.err = '';
  const e = String(email || '').trim();
  const p = String(pass || '');
  if (!e || !p) {
    ui.err = 'Enter email and password';
    render();
    return;
  }

  // Offline / seeded demo accounts (dan@thehybrid.local · demo).
  const local = L.login(S, e, p);
  if (local.ok) {
    if (local.account.role !== 'coach') {
      L.logout(S);
      ui.err = 'Coach workspace only. Athletes use the Hybrid athlete app.';
      persist();
      render();
      return;
    }
    ui.err = '';
    persist();
    render();
    return;
  }

  // Real account: same Supabase password auth as athlete Settings → Account.
  try {
    if (!(window.Whoop && typeof Whoop.client === 'function')) {
      throw new Error(local.error || 'Auth not loaded — check network and refresh');
    }
    const { data, error } = await Whoop.client().auth.signInWithPassword({ email: e, password: p });
    if (error) throw error;
    const user = data && data.user;
    if (!user) throw new Error('Sign-in succeeded but no user returned');
    const meta = user.user_metadata || {};
    const name = meta.full_name || meta.name || e.split('@')[0];
    ensureCoachAccount(user.email || e, name);
    ui.err = '';
    persist();
    render();
  } catch (err) {
    ui.err = (err && err.message) || local.error || 'Sign-in failed';
    render();
  }
}

function navActive(key){
  if (key === 'home') return ui.view === 'home';
  if (key === 'athletes') return ui.view === 'athletes' || ui.view === 'athlete';
  if (key === 'teams') return ui.view === 'teams' || ui.view === 'team';
  if (key === 'library') return ['library','program','session'].includes(ui.view);
  if (key === 'nutrition') return ui.view === 'nutrition';
  return key === ui.view;
}

function headerTitle(){
  const coachName = S.coach?.name || 'Dan';
  if (ui.view === 'home') return `Welcome back, Coach ${coachName}`;
  const titles = { athletes:'My Athletes', athlete:'My Athletes', teams:'My Teams', team:'My Teams', library:'Library', program:'Library', session:'Library', assign:'Assign', nutrition:'Nutrition' };
  return titles[ui.view] || ({analytics:'Analytics',gym:'Gym Tools',account:'Coach settings'}[ui.view]) || 'Coach Home';
}

function icon(name){
  const paths = {
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    users:'<path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1"/><circle cx="9" cy="7" r="3"/><path d="M22 19v-1a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    teams:'<path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M18 11a2.5 2.5 0 1 0 0-5"/><path d="M6 11a2.5 2.5 0 1 0 0-5"/><path d="M12 13c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4Z"/>',
    library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    nutrition:'<path d="M12 3v18"/><path d="M5 8h14"/><path d="M7 8c0 7 5 11 5 11s5-4 5-11"/><path d="M9 4h6"/>',
    chart:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/>',
    gym:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18h.01"/>',
    support:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 4.8 1 2 2 0 0 0-1 1.8V14"/><path d="M12 17h.01"/>',

function sliceStub(label, slice){
  return `<div class="card slice-stub"><div><b>${esc(label)}</b><p class="muted">${esc(slice)} — layout stub for chrome review (R0)</p></div></div>`;
}

function ringSvg(done, total){
  const p = total ? done/total : 0;
  const c = 2*Math.PI*16;
  const dashn = `${p*c} ${c}`;
  return `<svg class="ring" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="21" cy="21" r="16" fill="none" stroke="#7dba9a" stroke-width="4" stroke-dasharray="${dashn}" stroke-linecap="round" transform="rotate(-90 21 21)"/></svg>`;
}

function metricRow(m){
  const metricIcon=(kind,value)=>{
    const paths={readiness:'<path d="M8 4s-5 6-5 10a5 5 0 0 0 10 0c0-4-5-10-5-10Z"/><path d="M18 5h3M18 9h2M18 13h3M18 17h2M18 21h3"/>',minutes:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l5 3"/>',intensity:'<path d="M4 19a9 9 0 1 1 16 0M5 13l3 1M19 13l-3 1M12 12l-4-4"/>',volume:'<path d="M7 7h10l3 14H4L7 7Z"/><circle cx="12" cy="4" r="2"/>'};
    return `<svg class="metric-icon ${value==null?'missing':''}" viewBox="0 0 24 24" aria-hidden="true">${paths[kind]}</svg>`;
  };
  return `<div class="metrics feed-metrics">
    <div class="metric metric--blocks">${ringSvg(m.blocksDone,m.blocksTotal)}<b>${m.blocksDone}/${m.blocksTotal}</b><span>Blocks</span></div>
    <div class="metric">${metricIcon('readiness',m.readiness)}<b>${dash(m.readiness)}</b><span>Readiness</span></div>
    <div class="metric">${metricIcon('minutes',m.minutes)}<b>${dash(m.minutes)}</b><span>Minutes</span></div>
    <div class="metric">${metricIcon('intensity',m.intensity)}<b>${m.intensity==null?'–':m.intensity+'%'}</b><span>Intensity</span></div>
    <div class="metric">${metricIcon('volume',m.volumeKg)}<b>${m.volumeKg==null?'–':m.volumeKg+' kg'}</b><span>Volume</span></div>
  </div>`;
}

function blockDetail(session){
  return (session.blocks||[]).map((b, bi) => {
    const complete = L.blockIsComplete(b);
    const partial = !complete && ((b.exercises||[]).some(e => (e.rows||[]).some(r => r.done || r.weight || r.reps)) || b.complete);
    const state = complete ? 'done' : (partial ? 'partial' : '');
    const mark = complete ? '✓' : (partial ? '•' : '');
    const letter = b.letter || String.fromCharCode(65 + bi);
    const ex = (b.exercises||[]).map((e,ei) => {
      const actual = L.actualLine(e);
      const swap = e.swappedFrom ? `<div class="muted">Swapped from ${esc(e.swappedFrom.name)}</div>` : '';
      return `<div class="review-exercise"><div class="review-letter">${esc(b.letters?.[ei]||letter)}</div><div><b>${esc(e.name)}</b>
        <div class="presc">${esc(L.prescriptionLine(e))}</div>
        ${actual?`<div class="review-actual">${esc(actual)}</div>`:''}
        ${e.athleteNote?`<div class="muted">${esc(e.athleteNote)}</div>`:''}${swap}
        ${b.scoring==='completion'?'<span class="review-for-completion">For Completion</span>':''}</div></div>`;
    }).join('');
    const notes = b.notes ? `<div class="muted" style="margin:8px 0 0 40px">${esc(b.notes)}</div>` : '';
    return `<div class="review-block" data-scoring-label="${b.scoring==='completion'?'For Completion':'For Weight'}"><div class="review-block-head"><span class="review-status ${state}">${mark}</span><div><div class="review-block-title">${esc(b.category||b.type||'Block')}</div>${b.heading?`<div class="muted">${esc(b.heading)}</div>`:''}</div></div>${notes}${ex}</div>`;
  }).join('');
}

function saveComment(sessionId){
  const el = document.getElementById('note-'+sessionId);
  const s = ses(sessionId); if (!s || !el) return;
  const error=$('commentSaveStatus');
  const previousComment=s.comment,previousThread=s.coachComments;
  const saved=CoachManagement.appendCoachComment(s,el.value,S.coach?.id||account()?.id);
  if(!saved){if(error)error.textContent='Write a comment (up to 4,000 characters).';return;}
  try {L.saveState(null,S);}
  catch(err){if(previousComment===undefined)delete s.comment;else s.comment=previousComment;if(previousThread===undefined)delete s.coachComments;else s.coachComments=previousThread;if(error)error.textContent='Could not save locally: '+err.message;return;}
  ui.commentDrawer=null;render();
}

function toggleCard(id){ ui.expanded[id] = !ui.expanded[id]; render(); }

function homeDateLabel(date){
  try { return new Date(String(date)+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
  catch (_) { return String(date||''); }
}

function setHomeDate(date){ ui.homeDate=date;ui.homeMode='date';ui.homeCalendarOpen=false;render(); }
function shiftHomeDate(days){ setHomeDate(L.addDays(ui.homeDate||L.today(),days)); }
function showLatestFeed(){ ui.homeMode='latest';ui.homeCalendarOpen=false;render(); }
function shiftHomePickerMonth(delta){ ui.homePickerMonth=L.shiftMonth(ui.homePickerMonth||L.today().slice(0,7),delta);render(); }

function homeMonthHtml(monthKey, allowPrev, allowNext){
  const heads=['M','T','W','T','F','S','S'].map(x=>`<span class="dow">${x}</span>`).join('');
  const cells=L.monthGridCells(monthKey).map(d=>d
    ? `<button type="button" aria-label="Choose ${d}" class="${d===ui.homeDate?'selected':''}" onclick="setHomeDate('${d}')">${Number(d.slice(8))}</button>`
    : '<span></span>').join('');
  return `<div><div class="home-month-head"><button type="button" class="btn ghost small" ${allowPrev?'onclick="shiftHomePickerMonth(-1)"':'disabled'}>‹</button><span>${esc(L.monthLabel(monthKey))}</span><button type="button" class="btn ghost small" ${allowNext?'onclick="shiftHomePickerMonth(1)"':'disabled'}>›</button></div><div class="home-month-grid">${heads}${cells}</div></div>`;
}

function homeCalendarHtml(){
  if(!ui.homeCalendarOpen) return '';
  const first=ui.homePickerMonth||L.today().slice(0,7);
  return `<div class="home-date-popover" role="dialog" aria-label="Choose feed date"><div class="home-months">${homeMonthHtml(first,true,false)}${homeMonthHtml(L.shiftMonth(first,1),false,true)}</div></div>`;
}

function feedHtml(){
  const athletes = S.athletes||[];
  const list = CoachManagement.feedSessions(S,{...ui,homeDate:ui.homeDate||L.today()});
  const groups = L.groupFeed(list, athletes);
  const cards = groups.map(g => `<div class="dateh">${esc(g.label)}</div>` + g.cards.map(c => {
    const s = c.session;

function sessionMatches(template,query){
  return `${template.name} ${template.athleteTemplate?.title||''}`.toLowerCase().includes(String(query||'').trim().toLowerCase());
}
function filterSessionLibrary(query){
  ui.sessionSearch=query;
  document.querySelectorAll('#sessionLibraryTable tbody tr').forEach(row=>{row.hidden=!sessionMatches(tpl(row.dataset.templateId),query);});
  const count=(S.templates||[]).filter(t=>sessionMatches(t,query)).length;
  if($('sessionSearchStatus')) $('sessionSearchStatus').textContent=count?`${count} sessions`:'No matching sessions';
  updateSessionSelection();
}
function updateSessionSelection(){
  const selected=Object.keys(ui.sessionSelected).filter(id=>ui.sessionSelected[id]&&tpl(id));
  if($('sessionSelectionStatus')) $('sessionSelectionStatus').textContent=`${selected.length} selected`;
  if($('deleteSelectedSessions')) $('deleteSelectedSessions').disabled=!selected.length;
  const visible=(S.templates||[]).filter(t=>sessionMatches(t,ui.sessionSearch));
  const checked=visible.filter(t=>ui.sessionSelected[t.id]).length;
  if($('selectVisibleSessions')){
    $('selectVisibleSessions').checked=visible.length>0&&checked===visible.length;
    $('selectVisibleSessions').indeterminate=checked>0&&checked<visible.length;
  }
}
function selectVisibleSessions(checked){
  (S.templates||[]).filter(t=>sessionMatches(t,ui.sessionSearch)).forEach(t=>{ui.sessionSelected[t.id]=checked;});
  document.querySelectorAll('#sessionLibraryTable tbody tr').forEach(row=>{row.querySelector('input').checked=!!ui.sessionSelected[row.dataset.templateId];});
  updateSessionSelection();
}
function duplicateSessionTemplate(id){
  const source=tpl(id);if(!source) return;
  const copy=L.duplicateTemplate(source);
  S.templates.push(copy);ui.sessionNotice=`Created ${copy.name}. Existing programs and assignments are unchanged.`;
  L.saveState(null,S);render();
}
function openStrengthSession(id){
  const template=tpl(id);if(!template) return;
  StrengthBuilder.open(template,()=>L.saveState(null,S),render);
}
function deleteSessionTemplates(ids){
  const existing=[...new Set(ids)].filter(id=>tpl(id));
  if(!existing.length) return;
  const blocked=existing.filter(id=>{const usage=L.templateUsage(S,id);return usage.programs||usage.sessions;});
  const allowed=existing.filter(id=>!blocked.includes(id));
  if(!allowed.length){ui.sessionNotice='Templates used in programs or assigned sessions cannot be deleted. Remove those references first.';render();return;}
  const names=allowed.map(id=>tpl(id).name).join(', ');
  if(!confirm(`Delete ${allowed.length} unused template(s): ${names}? You can restore them from the session library.${blocked.length?` ${blocked.length} in-use template(s) will be kept.`:''}`)) return;
  S.templateTrash=S.templateTrash||[];
  allowed.forEach(id=>S.templateTrash.push({template:L.clone(tpl(id)),deletedAt:new Date().toISOString()}));
  S.templates=S.templates.filter(t=>!allowed.includes(t.id));
  allowed.forEach(id=>delete ui.sessionSelected[id]);
  ui.sessionNotice=`Deleted ${allowed.length} unused template(s).${blocked.length?` Kept ${blocked.length} in-use template(s).`:''}`;
  L.saveState(null,S);render();
}
function restoreSessionTemplates(){
  const entries=S.templateTrash||[];
  const restore=entries.filter(entry=>!tpl(entry.template.id));
  restore.forEach(entry=>S.templates.push(entry.template));
  const restored=new Set(restore.map(entry=>entry.template.id));
  S.templateTrash=entries.filter(entry=>!restored.has(entry.template.id));
  ui.sessionNotice=`Restored ${restore.length} template(s).`;
  L.saveState(null,S);render();
}

  });

function newProgram(){
  const p = L.emptyProgram('New program', 1);
  S.programs = S.programs || [];
  S.programs.push(p);
  persist();
  openProgram(p.id);
}

function cellSummary(templateId){
  const t = tpl(templateId);
  if (!t) return null;
  const work = (t.blocks||[]).find(b => {
    const v = blockTypeValue(b);
    return v === 'strength' || v === 'conditioning' || v === 'recovery';
  }) || (t.blocks||[])[0];
  if (!work) return { title:t.name, letter:'A', line:'Empty session', sets:'' };
  const kind = blockTypeValue(work);
  if (kind === 'conditioning' || kind === 'recovery') {
    return { title:t.name, letter:work.letter||'A', line:L.condPlanLineBlock(work)||work.heading||(kind==='recovery'?'Recovery':'Conditioning'), sets:work.targetDurationMin?`${work.targetDurationMin} min`:'' };
  }
  if (kind === 'text') {
    return { title:t.name, letter:work.letter||'A', line:work.heading||'Notes', sets:'' };
  }
  const e = (work.exercises||[])[0];
  return { title:t.name, letter:work.letter||'A', line:e?.name||work.heading||'Exercise', sets:e?.sets?`${e.sets} Sets`:'' };
}

function toggleCellMenu(week, day, ev){
  if (ev) ev.stopPropagation();
  const cur = ui.cellMenu;
  if (cur && cur.week === week && cur.day === day) ui.cellMenu = null;
  else ui.cellMenu = { week, day };
  if (!ui.cellPick || (ui.cellPick.mode !== 'copyTarget' && ui.cellPick.mode !== 'moveTarget')) {
    ui.cellPick = null;
  }
  render();
}

function openCellPick(week, day, mode){
  ui.cellPick = { week, day, mode: mode || 'set' };
  ui.cellMenu = null;
  render();
}

function closeCellPick(){ ui.cellPick = null; render(); }

function placeCellTemplate(templateId){
  const pick = ui.cellPick; if (!pick) return;
  const p = prog(ui.programId); if (!p) return;
  if (pick.mode === 'set' || pick.mode === 'copy' || pick.mode === 'move') {
    L.setProgramCell(p, pick.week, pick.day, templateId);
    if (pick.mode === 'move' && pick.fromWeek != null) {
      L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    }
  }
  ui.cellPick = null;
  persist(); render();
}

function clearCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  L.setProgramCell(p, week, day, null);
  ui.cellMenu = null;
  persist(); render();
}

function startCopyCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'copyTarget', templateId:tid };
  render();
}

function startMoveCell(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  if (!tid) return;
  ui.cellMenu = null;
  ui.cellPick = { week:null, day:null, mode:'moveTarget', templateId:tid, fromWeek:week, fromDay:day };
  render();
}

function onEmptyCell(week, day){
  const pick = ui.cellPick;
  if (pick && (pick.mode === 'copyTarget' || pick.mode === 'moveTarget')) {
    const p = prog(ui.programId); if (!p) return;
    const key = L.cellKey(week, day);
    const occupied = !!(p.cells || {})[key];
    if (occupied && pick.mode === 'copyTarget') {
      if (!confirm('This cell already has a session. Replace it with the copy?')) return;
    }
    if (occupied && pick.mode === 'moveTarget') {
      if (!confirm('This cell already has a session. Swap/move anyway?')) return;
    }
    L.setProgramCell(p, week, day, pick.templateId);
    if (pick.mode === 'moveTarget') L.setProgramCell(p, pick.fromWeek, pick.fromDay, null);
    ui.cellPick = null;
    persist(); render();
    return;
  }
  openCellPick(week, day, 'set');
}

function saveCellAsTemplate(week, day){
  const p = prog(ui.programId); if (!p) return;
  const tid = (p.cells||{})[L.cellKey(week, day)];
  const src = tpl(tid); if (!src) return;
  const fresh = L.duplicateTemplate(src);
  S.templates.push(fresh);
  ui.cellMenu = null;
  persist();
  openSession(fresh.id);
}

function addWeek(){
  const p = prog(ui.programId); if (!p) return;
  L.addProgramWeek(p);
  persist(); render();
}

function programPreviewHtml(p){if(!ui.programPreview)return '';const days=Object.entries(p.cells||{}).filter(([,id])=>tpl(id)).sort(([a],[b])=>{const [aw,ad]=a.split('-').map(Number),[bw,bd]=b.split('-').map(Number);return aw-bw||ad-bd;});return `<div class="profile-overlay" onclick="if(event.target===this){ui.programPreview=false;render()}"><aside class="profile-drawer" role="dialog" aria-label="Program preview"><div class="profile-head"><b style="flex:1">${esc(p.name)}</b><button class="btn small" aria-label="Close program preview" onclick="ui.programPreview=false;render()">×</button></div><div class="profile-body"><p class="muted">Original coach sessions, not local native strength drafts. No athlete logs or assignments are created.</p>${days.map(([key,id])=>{const t=tpl(id),[week,day]=key.split('-');return `<h2>Week ${week} · Day ${day}</h2><h3>${esc(t.name)}</h3><p style="white-space:pre-wrap">${esc(t.coachInstructions||'')}</p>${blockDetail(t)}`;}).join('')||'<p>No sessions placed in this program.</p>'}</div></aside></div>`;}

function patchCoachExTargetRir(bi, ei, raw){

  t.blocks[bi].exercises.push(L.makeExercise({ name:'New lift', autopilotVolume:true, load:'', metric:'Weight', restSec:90 }));

function removeEx(bi, ei){

function addBlk(type){
  const t = tpl(ui.templateId);
  const partial = type === 'recovery'
    ? { type:'conditioning', heading:'Recovery movement', category:'Recovery', scoring:'completion', recoverySession:true, condFmt:'steady', effort:'easy', modality:'Mixed', baselineDurationMin:30, targetDurationMin:30, timeCapMin:30, notes:'Mixed modal — walk, easy bike, mobility. Log time and feel, not output.' }
    : type === 'conditioning'
    ? { type:'conditioning', heading:'Steady-state', category:'Conditioning', scoring:'completion', condFmt:'steady', effort:'easy', modality:'Bike', targetDurationMin:20 }
    : type === 'text'
      ? { type:'text', heading:'Prep', category:'Prep', scoring:'completion', notes:'' }
      : { type:'strength', heading:'Strength', category:'Strength/Power', scoring:'weight', exercises:[L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'8', load:'', metric:'Weight' })] };
  t.blocks.push(L.makeBlock(partial));
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function clearCondFields(b){
  delete b.recoverySession;
  delete b.baselineDurationMin;
  delete b.condFmt;
  delete b.modality;
  delete b.targetDurationMin;
  delete b.conditioningType;
  delete b.effort;
  delete b.timeCapMin;
  delete b.rounds;
  delete b.workSec;
  delete b.restSec;
  delete b.targetHrZone;
  delete b.targetPace;
  delete b.targetWatts;
  delete b.targetDistance;
}

function setBlockType(bi, type){
  closeCoachExEdit();
  const t = tpl(ui.templateId);
  const b = t.blocks[bi];
  if (!b) return;
  if (b.supersetPartner && bi > 0) t.blocks[bi - 1].superset = false;
  if (b.superset && t.blocks[bi + 1]?.supersetPartner) delete t.blocks[bi + 1].supersetPartner;
  if (type === 'strength') {
    b.type = 'strength';
    b.scoring = b.scoring === 'completion' ? 'completion' : 'weight';
    b.category = 'Strength/Power';
    clearCondFields(b);
    if (!(b.exercises || []).length) {
      b.exercises = [L.makeExercise({ name:'Back Squat', exerciseId:'core-back-squat', sets:3, reps:'8', load:'', metric:'Weight' })];
    }
  } else if (type === 'conditioning') {
    b.superset = false;
    delete b.exercises;
    delete b.recoverySession;
    delete b.baselineDurationMin;
    L.applyCondBuilderToBlock(b, { condFmt:'steady', effort:'easy', modality:'Bike', targetDurationMin:20, heading:b.heading || 'Steady-state' });
    b.category = 'Conditioning';
  } else if (type === 'recovery') {
    b.superset = false;
    delete b.exercises;
    b.recoverySession = true;
    b.baselineDurationMin = L.num(b.baselineDurationMin) || L.num(b.targetDurationMin) || 30;
    L.applyCondBuilderToBlock(b, { condFmt:'steady', effort:'easy', modality:'Mixed', targetDurationMin:b.baselineDurationMin, heading:b.heading || 'Recovery movement' });
    b.category = 'Recovery';
    b.type = 'conditioning';
  } else {
    b.type = 'text';
    b.category = 'Prep';
    b.scoring = 'completion';
    b.superset = false;
    delete b.exercises;
    clearCondFields(b);
  }
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function blockTypeValue(b){
  if (!b) return 'strength';
  if (b.type === 'text') return 'text';
  if (b.recoverySession) return 'recovery';
  if (b.type === 'conditioning') return 'conditioning';
  return 'strength';
}

function blockTypeSelectHtml(i, b){

    <option value="strength" ${v==='strength'?'selected':''}>Strength</option>
    <option value="conditioning" ${v==='conditioning'?'selected':''}>Conditioning</option>
    <option value="recovery" ${v==='recovery'?'selected':''}>Recovery</option>
    <option value="text" ${v==='text'?'selected':''}>Prep notes</option>
  </select>`;
}

function removeBlk(bi){
  if (!confirm('Delete this block?')) return;
  if (ui.exEdit && ui.exEdit.bi === bi) closeCoachExEdit();
  const t = tpl(ui.templateId);
  const b = t.blocks[bi];
  if (b?.supersetPartner && bi > 0) t.blocks[bi - 1].superset = false;
  if (b?.superset && t.blocks[bi + 1]?.supersetPartner) delete t.blocks[bi + 1].supersetPartner;
  t.blocks.splice(bi, 1);
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function isSupersetPartnerBlock(blocks, bi){
  const b = blocks[bi];
  if (!b || blockTypeValue(b) !== 'strength') return false;
  if (b.supersetPartner) return true;
  const prev = blocks[bi - 1];
  return !!(prev && prev.superset && blockTypeValue(prev) === 'strength');
}

function toggleSuperset(bi, on){
  const t = tpl(ui.templateId);
  t.blocks.forEach((b) => {
    delete b.supersetPartner;
  });
  t.blocks[bi].superset = on;
  if (on) {
    const next = t.blocks[bi + 1];
    if (!next || blockTypeValue(next) !== 'strength') {
      showCoachToast('Add a strength block after this one to complete the superset pair.', 'warn');
    }
  }
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function moveBlock(from, to){
  closeCoachExEdit();
  const t = tpl(ui.templateId);
  if (!t) return;
  t.blocks = L.decorateBlocks(L.reorderBlocks(t.blocks, from, to));
  persist();
  render();
}

function initBlockDrag(){
  const list = document.getElementById('coachBlockList');
  if (!list) return;
  let dragFrom = null;
  list.querySelectorAll('.block-drag-handle').forEach((handle) => {
    handle.addEventListener('dragstart', (ev) => {
      dragFrom = Number(handle.dataset.blockIndex);
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', String(dragFrom));
      handle.closest('.block-card')?.classList.add('dragging');
    });
    handle.addEventListener('dragend', () => {
      dragFrom = null;
      list.querySelectorAll('.block-card').forEach((el) => {
        el.classList.remove('dragging', 'drop-target');
      });
    });
  });
  list.querySelectorAll('.block-card').forEach((card) => {
    card.addEventListener('dragover', (ev) => {
      ev.preventDefault();
      ev.dataTransfer.dropEffect = 'move';
      card.classList.add('drop-target');
    });
    card.addEventListener('dragleave', (ev) => {
      if (!card.contains(ev.relatedTarget)) card.classList.remove('drop-target');
    });
    card.addEventListener('drop', (ev) => {
      ev.preventDefault();
      card.classList.remove('drop-target');
      const from = dragFrom != null ? dragFrom : Number(ev.dataTransfer.getData('text/plain'));
      const to = Number(card.dataset.blockIndex);
      if (Number.isFinite(from) && Number.isFinite(to)) moveBlock(from, to);
    });
  });
}

function openExPicker(bi, ei){
  closeCoachExEdit();
  ui.exPicker = { bi, ei };
  ui.exSearch = '';
  render();
}

function coachExerciseSuggestHits(query){
  const q = String(query||'').trim();
  if (q.length < 1) return [];
  if (window.ExerciseSearch?.search) {
    const hits = ExerciseSearch.search(q, 12);
    return ExerciseSearch.mergeCustomHits(hits, S.exercises||[], q, 12);
  }
  const ql = q.toLowerCase();
  return (S.exercises||[]).filter(e => String(e.name||'').toLowerCase().includes(ql) || String(e.category||'').toLowerCase().includes(ql))
    .slice(0, 12).map(e => ({ exerciseId: e.id, name: e.name, category: e.category||'Custom' }));
}

function ensureCoachExerciseInCatalog(exerciseId, name, category){
  if (!exerciseId) return;
  S.exercises = S.exercises || [];
  let row = S.exercises.find(e => e.id === exerciseId);
  if (!row) {
    row = { id: exerciseId, name: name||exerciseId, category: category||'Custom', builtIn: !!ExerciseSearch?.byId?.(exerciseId), source: ExerciseSearch?.byId?.(exerciseId) ? 'THE-core-120' : 'coach-custom' };
    S.exercises.push(row);
  } else {
    if (name) row.name = name;
    if (category) row.category = category;
  }
}

function closeExPicker(){ ui.exPicker = null; ui.exSearch = ''; render(); }

function pickExerciseVariant(exerciseId, name, category){
  if (!ui.exPicker) return;
  ensureCoachExerciseInCatalog(exerciseId, name, category);
  const t = tpl(ui.templateId);
  const ex = t.blocks[ui.exPicker.bi].exercises[ui.exPicker.ei];
  ex.name = name || ex.name;
  ex.exerciseId = exerciseId || ex.exerciseId;
  ex.category = category || ex.category;
  ui.exPicker = null;
  ui.exSearch = '';
  t.blocks = L.decorateBlocks(t.blocks);
  persist(); render();
}

function filteredExercises(){
  const q = String(ui.exSearch||'').trim();
  if (q) return coachExerciseSuggestHits(q).map(h => ({ id: h.exerciseId, name: h.name, category: h.category }));
  return (S.exercises||[]).slice(0, 80);
}

function exercisePickerHtml(){
  if (!ui.exPicker) return '';
  const q = String(ui.exSearch||'').trim();
  const hits = coachExerciseSuggestHits(q);
  const list = hits.length
    ? hits.map(x => `<button type="button" class="picker-item" onclick='pickExerciseVariant(${JSON.stringify(x.exerciseId||'')},${JSON.stringify(x.name)},${JSON.stringify(x.category||'Custom')})'><span>${esc(x.name)}</span><span class="muted">${esc(x.category||'Custom')}</span></button>`).join('')
    : (q ? '<div class="muted">No library match — try another variant name.</div>' : '<div class="muted">Type to search exercise variants (names only).</div>');
  return `<div class="picker-overlay" onclick="if(event.target===this)closeExPicker()">
    <div class="picker-panel" role="dialog" aria-label="Choose exercise">
      <div class="row"><b>Choose exercise</b><button type="button" class="btn ghost small" onclick="closeExPicker()">Close</button></div>
      <div class="field" style="margin-top:12px"><label>Search variants</label>
        <input value="${esc(ui.exSearch)}" oninput="ui.exSearch=this.value;render()" placeholder="deadlift, lateral raise…" autofocus></div>
      <div class="picker-list">${list}</div>
    </div></div>`;
}

function setRowsTable(bi, ei){
  const e = tplBlocks()[bi].exercises[ei];
  const n = Math.max(1, Number(e.sets) || 1);
  const reps = L.targetList(e);
  const loads = L.loadList(e);
  let rows = '';
  for (let i = 0; i < n; i++) {
    rows += `<tr><td>${i+1}</td><td><input value="${esc(reps[i] ?? e.reps ?? '')}" oninput="setRowRep(${bi},${ei},${i},this.value)"></td>
      <td><input value="${esc(loads[i] ?? '')}" oninput="setRowLoad(${bi},${ei},${i},this.value)" placeholder="Load"></td></tr>`;
  }
  return `<table class="set-table"><thead><tr><th>Set</th><th>Reps</th><th>Load</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function setRowRep(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.targetList(e);
  while (parts.length < (e.sets || 1)) parts.push(String(e.reps || ''));
  parts[ri] = val;
  for (let i = ri + 1; i < parts.length; i++) parts[i] = val;
  e.reps = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
  render();
}

function setRowLoad(bi, ei, ri, val){
  const e = tplBlocks()[bi].exercises[ei];
  const parts = L.loadList(e);
  while (parts.length < (e.sets || 1)) parts.push('');
  parts[ri] = val;
  e.load = parts.length === 1 ? parts[0] : parts.join(',');
  persist();
}

function patchCond(bi, patch){
  const t = tpl(ui.templateId);
  L.applyCondBuilderToBlock(t.blocks[bi], patch);
  persist(); render();
}

function nudgeCondMin(bi, delta){
  const b = tplBlocks()[bi];
  const cur = Number(b.targetDurationMin) || 20;
  patchCond(bi, { targetDurationMin: Math.max(1, Math.min(180, cur + delta)) });
}

function setCondFmt(bi, key){
  const fmt = L.condFormatMeta(key);
  const patch = { condFmt:key, heading:fmt.name };
  if (L.fmtNeedsIntervalFields(fmt)) {
    patch.rounds = fmt.rounds || 4;
    patch.workSec = fmt.workSec || 240;
    patch.restSec = fmt.restSec || 180;
  }
  patchCond(bi, patch);
}

function modalityWantsWatts(mod){
  const m = String(mod||'').toLowerCase();
  return m.includes('bike') || m.includes('echo') || m.includes('air');
}

function condEngineHtml(b, bi){
  const fmt = L.condFormatMeta(b.condFmt || 'steady');
  const effort = L.condEffortMeta(b.effort || 'easy');
  const interval = L.fmtNeedsIntervalFields(fmt);
  const plan = L.condPlanLineBlock(b) || '—';
  const fmtOpts = L.COND_FORMATS.map(f => `<option value="${f.key}" ${fmt.key===f.key?'selected':''}>${esc(f.name)}</option>`).join('');
  const modOpts = L.COND_MODALITIES.map(m => `<option ${b.modality===m?'selected':''}>${esc(m)}</option>`).join('');
  const chips = L.COND_EFFORTS.map(e => {
    const on = effort.key === e.key;
    return `<button type="button" class="eff ${esc(e.key)}${on?' on':''}" aria-pressed="${on?'true':'false'}" onclick="patchCond(${bi},{effort:'${e.key}'})"><b>${esc(e.name)}</b><small>RPE ${esc(e.rpe)}</small></button>`;
  }).join('');
  const timing = interval
    ? `<div class="engine-fields" style="grid-template-columns:1fr 1fr 1fr;margin-top:10px">
        <div class="field"><label>Rounds</label><input type="number" min="1" step="1" value="${esc(b.rounds||fmt.rounds||1)}" onchange="patchCond(${bi},{rounds:Number(this.value)||1})"></div>
        <div class="field"><label>Work</label><input value="${esc(L.formatMmSs(b.workSec||fmt.workSec||30))}" onchange="patchCond(${bi},{workSec:L.parseMmSs(this.value)})"></div>
        <div class="field"><label>Rest</label><input value="${esc(L.formatMmSs(b.restSec!=null?b.restSec:(fmt.restSec||90)))}" onchange="patchCond(${bi},{restSec:L.parseMmSs(this.value)})"></div>
      </div><p class="engine-hint">Total ≈ ${L.condIntervalTotalMin(b)} min · stored as seconds.</p>`
    : `<div class="field" style="margin-top:10px"><label>Minutes</label>
        <div class="mins-row">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},-5)">−</button>
          <input type="number" min="1" max="180" value="${esc(b.targetDurationMin||20)}" onchange="patchCond(${bi},{targetDurationMin:Number(this.value)||20})">
          <button type="button" class="btn small" onclick="nudgeCondMin(${bi},5)">+</button>
        </div></div>`;
  const watts = modalityWantsWatts(b.modality)
    ? `<div class="field" style="margin-top:10px"><label>Target watts <span class="muted">(optional)</span></label>
        <input type="number" min="0" step="5" placeholder="180" value="${esc(b.targetWatts||'')}" onchange="patchCond(${bi},{targetWatts:this.value})"></div>`
    : '';
  return `<div class="engine-box">
    <div class="engine-plan">${esc(plan)}</div>
    <div class="engine-fields">
      <div class="field"><label>Format</label><select onchange="setCondFmt(${bi},this.value)">${fmtOpts}</select></div>
      <div class="field"><label>Modality</label><select onchange="patchCond(${bi},{modality:this.value})">${modOpts}</select></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Effort</label></div>
    <div class="efforts" role="group" aria-label="Effort">${chips}</div>
    ${timing}
    ${watts}
    <div class="field" style="margin-top:10px"><label>Coach notes</label>
      <textarea oninput="tpl(ui.templateId).blocks[${bi}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>
  </div>`;
}

function blockExerciseHtml(b, bi){
  const kind = blockTypeValue(b);
  if (kind === 'conditioning' || kind === 'recovery') return condEngineHtml(b, bi);
  if (kind === 'text') {
    return `<div class="field prep-field"><label>Block notes</label>
      <textarea class="prep-textarea" rows="8" oninput="tpl(ui.templateId).blocks[${bi}].notes=this.value;persist();growTextAreas()">${esc(b.notes||'')}</textarea></div>`;
  }
  const exHtml = (b.exercises||[]).map((e, ei) => `<div class="exercise-card">
    <div class="row" style="align-items:flex-start"><span class="letter-badge" style="width:26px;height:26px;font-size:11px">${esc(b.letter||'?')}</span>
      <button type="button" class="exercise-pick grow" onclick="openExPicker(${bi},${ei})">${esc(e.name||'Choose exercise')}</button>
      <button type="button" class="kebab-btn" title="Remove exercise" onclick="removeEx(${bi},${ei})">×</button></div>
    ${coachExerciseRxHtml(bi, ei)}
  </div>`).join('');
  return `${exHtml}<button type="button" class="btn small" style="margin-top:10px" onclick="addEx(${bi})">Add exercise</button>`;
}

  ui.lib = 'sessions';
  const blocks = tplBlocks().map((b, i) => {
    const kind = blockTypeValue(b);
    const blocksRef = tpl(ui.templateId).blocks;
    const isPartner = isSupersetPartnerBlock(blocksRef, i);
    const scoring = `<select title="How the athlete logs this strength block" onchange="tpl(ui.templateId).blocks[${i}].scoring=this.value;persist()"><option value="weight" ${b.scoring==='weight'?'selected':''}>Track load</option><option value="completion" ${b.scoring==='completion'?'selected':''}>Completion only</option></select>`;
    const superset = kind === 'strength' && !isPartner
      ? `<label class="row" style="gap:6px;margin:0;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500">
          <input type="checkbox" style="width:auto" ${b.superset?'checked':''} onchange="toggleSuperset(${i},this.checked)"> Superset</label>`
      : (isPartner ? `<span class="pill" style="font-size:10px">Superset pair</span>` : '');
    return `<section class="block-card block-${kind}" data-block-index="${i}">
      <div class="block-head">

        <div class="field"><label>Block title</label><input value="${esc(b.heading||'')}" oninput="tpl(ui.templateId).blocks[${i}].heading=this.value;persist()"></div>
        ${kind==='strength'?`<div class="field"><label>Block notes</label><textarea oninput="tpl(ui.templateId).blocks[${i}].notes=this.value;persist()">${esc(b.notes||'')}</textarea></div>`:''}

  }).join('');
  const instrLen = (t.coachInstructions||'').length;
  return `<div class="fade-in"><button type="button" class="btn ghost small page-back" onclick="go('library',{lib:'sessions'})">← Back to sessions</button>
    <div class="builder-top" style="margin-top:12px">

      <div class="builder-actions"><button class="btn primary small" onclick="openStrengthSession(ui.templateId)">${t.athleteTemplate?'Continue strength draft':'Strength builder'}</button><span class="pill">Saved locally</span></div>
    </div>
    <div class="card instructions-box">
      <label>Coach instructions</label>
      <span class="char-count">${instrLen}/10000</span>
      <textarea maxlength="10000" placeholder="Use this area to help the athlete understand goals for today's session." oninput="tpl(ui.templateId).coachInstructions=this.value;persist();var c=this.closest('.instructions-box')&&this.closest('.instructions-box').querySelector('.char-count');if(c)c.textContent=this.value.length+'/10000'">${esc(t.coachInstructions||'')}</textarea>
    </div>
    <div class="block-list" id="coachBlockList">${blocks}</div>
    <div class="add-block-bar stack">
      <p class="muted" style="margin:0">Add a block type</p>
      <div class="row" style="justify-content:flex-start;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn primary small" onclick="addBlk('strength')">+ Strength</button>
        <button type="button" class="btn small" onclick="addBlk('conditioning')">+ Conditioning</button>
        <button type="button" class="btn small" onclick="addBlk('recovery')">+ Recovery</button>

}

function exportBridgeFile(){
  if (!window.CoachBridge) return alert('Bridge module missing');
  const r = CoachBridge.push(S);
  if (!r.ok) return alert('Export failed: ' + (r.error||''));
  const blob = new Blob([JSON.stringify(r.payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'the-coach-bridge-' + (r.payload.exportedAt||'').slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

      el.style.height = Math.max(el.scrollHeight, 200) + 'px';

function render(){
  CoachTools.init({ L, S, ui, esc, render });
  const acc = account();
  $('gate').classList.add('hidden');
  $('coachApp').classList.add('hidden');
  if (!acc || acc.role !== 'coach'){
    if (acc) { L.logout(S); persist(); }
    $('gate').classList.remove('hidden'); $('gate').innerHTML = gateHtml(); return;
  }
  $('coachApp').classList.remove('hidden');
  let body = '';
  if (ui.view==='athletes') body = athleteListHtml();
  else if (ui.view==='athlete') body = athleteCalHtml();
  else if (ui.view==='teams') body = teamListHtml();
  else if (ui.view==='team') body = teamCalHtml();
  else if (ui.view==='library') body = libraryHtml();
  else if (ui.view==='program') body = programHtml();
  else if (ui.view==='session') body = sessionHtml();
  else if (ui.view==='assign') body = assignHtml();
  else if (ui.view==='nutrition') body = nutritionHtml();
  else if (ui.view==='analytics') body = CoachTools.analyticsHtml();
  else if (ui.view==='gym') body = CoachTools.gymHtml();
  else if (ui.view==='account') body = CoachTools.accountHtml();
  else body = feedHtml();
  $('coachApp').innerHTML = coachChrome(body);
  CoachTools.afterRender();
  const dialog=Array.from($('coachApp').querySelectorAll('[role="dialog"]')).at(-1);
  const dialogKey=dialog?.getAttribute('aria-label')||'';
  if(dialog){dialog.setAttribute('aria-modal','true');dialog.setAttribute('tabindex','-1');if(ui.activeDialog!==dialogKey)(dialog.querySelector('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')||dialog).focus();}
  ui.activeDialog=dialogKey;
  if (ui.view === 'library' && ui.lib === 'sessions') updateSessionSelection();
  if (ui.view === 'session') {
    growTextAreas();
    initBlockDrag();
  }
  scheduleRefreshCloudStates();
}

document.addEventListener('click', function coachKebabDismiss(ev) {
  if(ui.homeCalendarOpen && !ev.target?.closest?.('.home-date-popover,[aria-label="Choose date"]')){
    ui.homeCalendarOpen=false;document.querySelector('.home-date-popover')?.remove();
  }
  if (!ui.cellMenu && !ui.chipMenu) return;
  if (ev.target && ev.target.closest && ev.target.closest('.kebab-menu, .kebab-btn')) return;
  let changed = false;
  if (ui.cellMenu) { ui.cellMenu = null; changed = true; }
  if (ui.chipMenu) { ui.chipMenu = null; changed = true; }
  if (changed) render();
});
document.addEventListener('keydown',function coachReviewEscape(ev){
  if(ev.key==='Tab'){
    const dialog=Array.from($('coachApp').querySelectorAll('[role="dialog"]')).at(-1);
    if(dialog){const controls=Array.from(dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')).filter(el=>el.getClientRects().length&&!el.hidden);
      const first=controls[0],last=controls.at(-1);
      if(!first){ev.preventDefault();dialog.focus();}
      else if(ev.shiftKey&&(!dialog.contains(document.activeElement)||document.activeElement===first)){ev.preventDefault();last.focus();}
      else if(!ev.shiftKey&&(!dialog.contains(document.activeElement)||document.activeElement===last)){ev.preventDefault();first.focus();}
    }
  }
  if(ev.key!=='Escape')return;
  if(ui.commentDrawer){ev.preventDefault();closeCommentDrawer();}
  else if(ui.homeCalendarOpen){ev.preventDefault();ui.homeCalendarOpen=false;document.querySelector('.home-date-popover')?.remove();document.querySelector('[aria-label="Choose date"]')?.focus();}
  else if(ui.catalogEdit){ev.preventDefault();closeCatalogExercise();}
  else if(ui.calendarPreview){ev.preventDefault();CoachViews.closeCalendarPreview();}
  else if(ui.programPreview){ev.preventDefault();ui.programPreview=false;render();}
  else if(ui.programSettings){ev.preventDefault();closeProgramSettings();}
  else if(ui.libPick){ev.preventDefault();ui.libPick=null;render();}
  else if(ui.cellPick){ev.preventDefault();closeCellPick();}
  else if(ui.athleteProfileId){ev.preventDefault();CoachViews.closeAthleteProfile();}
  else if(ui.teamSettingsId){ev.preventDefault();CoachViews.closeTeamSettings();}
  else if(ui.teamInviteId){ev.preventDefault();CoachViews.closeTeamInvite();}
  else if(ui.createTeam){ev.preventDefault();CoachViews.closeCreateTeam();}
  else if(ui.sidebarOpen){ev.preventDefault();toggleCoachSidebar(false);}
});
window.matchMedia('(max-width:980px)').addEventListener('change',function(){if(ui.sidebarOpen){ui.sidebarOpen=false;render();}});

(async function coachAuthBoot(){
  try {
    if (!(window.Whoop && Whoop.client)) return;
    const { data } = await Whoop.client().auth.getSession();
    const session = data && data.session;
    if (!session || !session.user) return;
    const email = session.user.email;
    if (!email) return;
    const meta = session.user.user_metadata || {};
    const name = meta.full_name || meta.name || email.split('@')[0];
    // Already in as matching coach — leave UI alone.
    const acc = account();
    if (acc && acc.role === 'coach' && String(acc.email || '').toLowerCase() === email.toLowerCase()) {
      console.info('coach cloud: signed in', email);
      return;
    }
    // Session present but gate still up (or wrong local user) — enter coach workspace.
    if (!acc || acc.role !== 'coach') {
      ensureCoachAccount(email, name);
      persist();
      render();
    }
  } catch (_) {}
})();
