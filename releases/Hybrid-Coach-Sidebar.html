  function previewChip(id) { if (!ctx.ses(id)) return; ui().chipMenu = null; ui().calendarPreview=id; ctx.render(); }
  function closeCalendarPreview(){ui().calendarPreview=null;ctx.render();}
  function calendarPreview(){var s=ctx.ses(ui().calendarPreview);if(!s)return '';return '<div class="profile-overlay" onclick="if(event.target===this)CoachViews.closeCalendarPreview()"><aside class="profile-drawer" role="dialog" aria-label="Session preview"><div class="profile-head"><b style="flex:1">'+esc(s.sessionTitle||s.name)+'</b><button class="btn ghost small" aria-label="Close session preview" onclick="CoachViews.closeCalendarPreview()">×</button></div><div class="profile-body"><p class="muted">'+esc(s.date)+' · '+esc(s.status)+'</p><p style="white-space:pre-wrap">'+esc(s.coachInstructions||'No coach instructions.')+'</p>'+root.blockDetail(s)+'</div></aside></div>';}
  function manageCalendar(){var id=ui().teamId;ctx.go(ui().view==='team'?'teams':'athletes');if(id&&ui().view==='teams')openTeamInvite(id);}
  function toggleCalendarInstructions(){ui().showCalendarInstructions=!ui().showCalendarInstructions;ctx.render();}
  function editChip(id) { var s = ctx.ses(id); if (!s || !s.templateId) return; ui().chipMenu = null; root.openSession(s.templateId); }
  function saveChipToLibrary(id) {
    var s = ctx.ses(id); if (!s) return;
    var t = L().makeTemplate({ name:(s.sessionTitle || s.name) + ' (copy)', coachInstructions:s.coachInstructions || '', blocks:JSON.parse(JSON.stringify(s.blocks || [])) });
    S().templates.push(t); ui().chipMenu = null; persist(); ctx.render();
  }
  function cloneCalendarSession(id, days) {
    var s = ctx.ses(id); if (!s) return;
    var copy = root.CoachTools.freshCalendarCopy(s,L(),days);
    if((S().sessions||[]).some(function(x){return x.athleteId===copy.athleteId&&x.date===copy.date&&x.templateId===copy.templateId;})){ui().calendarNotice='This session is already scheduled on '+copy.date;ui().chipMenu=null;ctx.render();return;}
    S().sessions.push(copy); ui().chipMenu = null; ui().calMonth=copy.date.slice(0,7);ui().calendarNotice='Created an unpublished copy on '+copy.date+'. No logged results were copied.'; persist(); ctx.render();
  }
  function repeatChip(id) { cloneCalendarSession(id, 7); }
  function copyChip(id) { cloneCalendarSession(id, 1); }

  function sessionChip(s, opts) {
    opts = opts || {};
    var pub = s.published ? 'published' : 'unpublished';
    var completed = s.status === 'completed';
    if (completed) pub = s.published ? 'published completed' : 'unpublished completed';
    var title = s.sessionTitle || s.name;
    var athleteName =
      opts.showAthlete && s.athleteId
        ? (ctx.athleteBy(s.athleteId) || {}).name
        : '';
    var statusPill =
      completed
        ? '<span class="pill ok">Completed</span>'
        : '<span class="pill ' +
          (s.published ? 'ok' : 'warn') +
          '">' +
          (s.published ? 'Published' : 'UNPUBLISHED') +
          '</span>';
    var macroPill = s.hasNutritionBundle ? ' · <span class="pill">Macros</span>' : '';
    return (
      '<div class="cal-chip ' +
      pub +
      '">' +
      (athleteName
        ? '<div class="cal-chip-ath">' + esc(athleteName) + '</div>'
        : '') +
      '<div class="cal-chip-top">' +
      '<span class="cal-chip-title">' +
      esc(title) +
      '</span>' +
      '<button type="button" class="kebab-btn" onclick="CoachViews.toggleChipMenu(\'' +
      s.id +
      '\',event)">⋯</button></div>' +
      '<div class="cal-chip-meta">' +
      esc(s.name) +
      ' · ' +
      statusPill +
      macroPill +
      '</div>' +
      chipMenu(s.id) +
      '</div>'
    );
  }

  function toggleChipMenu(id, ev) {
    if (ev) ev.stopPropagation();
    var cur = ui().chipMenu;
    ui().chipMenu = cur && cur.id === id ? null : { id: id };
    ui().cellMenu = null;
    ctx.render();
  }

  function revertPublishOnCloudFail(sessions, wasPublished) {
    (sessions || []).forEach(function (s, i) {
      if (wasPublished[i]) return;
      L().unpublishSession(s);
      s.hasNutritionBundle = false;
    });
    persist();
    ctx.render();
  }

  function publishChip(id) {
    var s = ctx.ses(id);
    var athlete = s ? ctx.athleteBy(s.athleteId) : null;
    var wasPublished = s ? !!s.published : true;
    if (s) {
      L().publishSession(s);
      s.hasNutritionBundle = !!(root.CoachCloud && CoachCloud.nutritionSnapshot && CoachCloud.nutritionSnapshot(S(), s.athleteId, s.date));
    }
    ui().chipMenu = null;
    persist();
    ctx.render();
    if (root.CoachCloud && CoachCloud.pushPublished) {
      CoachCloud.pushPublished(S(), { sessionIds: [id] })
        .then(function (r) {
          if (!r.ok && s && !wasPublished) {
            revertPublishOnCloudFail([s], [wasPublished]);
          }
          notifyPublishResult(r, athlete && athlete.name);
        })
        .catch(function (e) {
          if (s && !wasPublished) {
            revertPublishOnCloudFail([s], [wasPublished]);
          }
          notifyPublishResult(
            { ok: false, errors: [{ error: String((e && e.message) || e) }] },
            athlete && athlete.name,
          );
        });
    }
  }

  function unpublishChip(id) {
    var s = ctx.ses(id);
    var wasPublished = s ? !!s.published : false;
    if (s) L().unpublishSession(s);
    ui().chipMenu = null;
    persist();
    ctx.render();
    if (root.CoachCloud && CoachCloud.unpublishSession) {
      CoachCloud.unpublishSession(S(), s)
        .then(function (r) {
          if (r && !r.ok && wasPublished && s) {
            L().publishSession(s);
            s.hasNutritionBundle = !!(root.CoachCloud && CoachCloud.nutritionSnapshot && CoachCloud.nutritionSnapshot(S(), s.athleteId, s.date));
            persist();
            ctx.render();
            notifyPublishResult(
              r,
              s && ctx.athleteBy(s.athleteId) && ctx.athleteBy(s.athleteId).name,
            );
          }
        })
        .catch(function (e) {
          if (wasPublished && s) {
            L().publishSession(s);
            s.hasNutritionBundle = !!(root.CoachCloud && CoachCloud.nutritionSnapshot && CoachCloud.nutritionSnapshot(S(), s.athleteId, s.date));
            persist();
            ctx.render();
          }
          notifyPublishResult(
            { ok: false, errors: [{ error: String((e && e.message) || e) }] },
            s && ctx.athleteBy(s.athleteId) && ctx.athleteBy(s.athleteId).name,
          );
        });
    }
  }

  function deleteChip(id) {
    var s = ctx.ses(id);
    ui().chipMenu = null;
    if(!s)return;
    if(s.status==='completed'||L().sessionHasLog(s)){ui().calendarNotice='Logged sessions are retained to protect athlete history.';ctx.render();return;}
    if (!confirm('Delete this session from the calendar?')) return;
    function removeLocal() {
      S().sessions = (S().sessions || []).filter(function (x) {
        return x.id !== id;
      });
      persist();
      ctx.render();
    }
    if (s && s.cloudAssignedId && root.CoachCloud && CoachCloud.unpublishSession) {
      CoachCloud.unpublishSession(S(), s)
        .then(function(result){if(result.ok)removeLocal();else{ui().calendarNotice='Session retained: cloud unpublish failed. '+(result.error||result.reason||'');ctx.render();}})
        .catch(function () {ui().calendarNotice='Session retained: could not reach the cloud.';ctx.render();});
      return;
    }
    removeLocal();
  }

  function publishAllForSessions(list) {
    var wasPublished = (list || []).map(function (s) {
      return !!s.published;
    });
    L().publishAllSessions(list);
    (list || []).forEach(function (s) {
      s.hasNutritionBundle = !!(root.CoachCloud && CoachCloud.nutritionSnapshot && CoachCloud.nutritionSnapshot(S(), s.athleteId, s.date));
    });
    persist();
    ctx.render();
    if (root.CoachCloud && CoachCloud.pushPublished) {
      var ids = (list || []).map(function (s) {
        return s.id;
      });
      var athlete = list && list[0] ? ctx.athleteBy(list[0].athleteId) : null;
      CoachCloud.pushPublished(S(), { sessionIds: ids })
        .then(function (r) {
          if (!r.ok && list && list.length) {
            var failed = new Set(
              (r.errors || []).map(function (e) {
                return e.sessionId;
              }),
            );
            var revertList = [];
            var revertWas = [];
            list.forEach(function (s, i) {
              if (!wasPublished[i] && (failed.size === 0 || failed.has(s.id))) {
                revertList.push(s);
                revertWas.push(wasPublished[i]);
              }
            });
            if (revertList.length) revertPublishOnCloudFail(revertList, revertWas);
          }
          notifyPublishResult(r, athlete && athlete.name);
        })
        .catch(function (e) {
          var revertList = [];
          var revertWas = [];
          (list || []).forEach(function (s, i) {
            if (!wasPublished[i]) {
              revertList.push(s);
              revertWas.push(wasPublished[i]);
            }
          });
          if (revertList.length) revertPublishOnCloudFail(revertList, revertWas);
          notifyPublishResult(
            { ok: false, errors: [{ error: String((e && e.message) || e) }] },
            athlete && athlete.name,
          );
        });
    }
  }

  function calDayCell(date, sessions, athleteId, teamMode) {
    var expanded = ui().calDay === date;
    var visible = expanded ? sessions : sessions.slice(0, 2);
    var chips = visible
      .map(function (s) {
        return sessionChip(s, { showAthlete: !!teamMode });
      })
      .join('');
    var more =
      !expanded && sessions.length > 2
        ? '<div class="cal-chip-meta">+' + (sessions.length - 2) + ' more</div>'
        : '';
    var empty =
      !sessions.length && expanded
        ? teamMode
          ? '<div class="cal-empty-actions"><button type="button" class="btn small" onclick="CoachViews.openAddFromLibrary(\'' +
            date +
            '\',\'\',true)">Add from library</button></div>'
          : '<div class="cal-empty-actions"><button type="button" class="btn small" onclick="CoachViews.openAddFromLibrary(\'' +
            date +
            "','" +
            athleteId +
            '\')">Add from library</button></div>'
        : '';
    return (
      '<div class="cal-day' +
      (expanded ? ' expanded' : '') +
      (sessions.length ? ' has-sessions' : '') +
      '">' +
      '<button type="button" class="cal-day-num" onclick="CoachViews.toggleCalDay(\'' +
      date +
      '\'' + (sessions.length ? '' : teamMode ? ',\'\',true' : ',\'' + athleteId + '\'') + ')">' +
      esc(String(Number(date.slice(8)))) +
      (sessions.length ? ' · ' + sessions.length : '') +
      '</button>' +
      '<div class="cal-day-body">' +
      chips +
      more +
      empty +
      '</div></div>'
    );
  }

  function toggleCalDay(date) {
    if (arguments.length > 1) {
      openAddFromLibrary(date, arguments[1], arguments[2]);
      return;
    }
    ui().calDay = ui().calDay === date ? null : date;
    ctx.render();
  }

  function openAddFromLibrary(date, athleteId, teamMode) {
    ui().calendarNotice = '';
    if (teamMode || (!athleteId && ui().view === 'team')) {
      ui().libPick = { date: date, teamId: ui().teamId, pickAthlete: true };
    } else {
      ui().libPick = { date: date, athleteId: athleteId, q: '' };
    }
    ctx.render();
  }

  function pickLibraryAthlete(athleteId) {
    var pick = ui().libPick;
    if (!pick || !pick.pickAthlete) return;
    var team = ctx.team(pick.teamId);
    if (!team || !(team.athleteIds || []).includes(athleteId) || !ctx.athleteBy(athleteId)) return;
    ui().libPick = { date: pick.date, athleteId: athleteId, q: '' };
    ctx.render();
  }

  function pickLibraryTemplate(tid) {
    var pick = ui().libPick;
    if (!pick || pick.pickAthlete) return;
    var template = ctx.tpl(tid);
    if (!template) return;
    var session;
    try {
      session = L().addCalendarSession(S(), {
        athleteId: pick.athleteId,
        date: pick.date,
        templateId: tid,
      });
    } catch (error) {
      pick.error = error.message;
      refreshLibraryResults();
      return;
    }
    if (!session) {pick.error='This session is already scheduled for this athlete and date.';refreshLibraryResults();return;}
    ui().calMonth = pick.date.slice(0,7);
    ui().calDay = pick.date;
    ui().calendarNotice = template.name + ' added for ' + ctx.athleteBy(pick.athleteId).name + ' on ' + pick.date + ' · unpublished coach assignment.';
    ui().libPick = null;
    persist();
    ctx.render();
  }

  function searchLibrary(q) {
    if (!ui().libPick) return;
    ui().libPick.q = String(q || '');
    refreshLibraryResults();
  }

  function setLibraryDate(date) {
    if (!ui().libPick) return;
    ui().libPick.date = date;
    ui().libPick.error = '';
    // Keep result buttons in place so date-field blur cannot swallow an Add click.
    document.querySelectorAll('[data-calendar-template]').forEach(function(button) {
      var pick = ui().libPick;
      var scheduled = (S().sessions || []).some(function(s) {return s.athleteId === pick.athleteId && s.date === pick.date && s.templateId === button.dataset.calendarTemplate;});
      button.disabled = scheduled;
      button.lastElementChild.textContent = scheduled ? 'Already scheduled' : '+ Add';
    });
    var status = document.getElementById('calendarLibraryStatus');
    if (status) status.textContent = '';
  }

  function libraryResults() {
    var pick = ui().libPick;
    if (!pick) return '';
    var q = String(pick.q || '').trim().toLowerCase();
    var templates = (S().templates || []).filter(function(t) {
      return (t.name + ' ' + (t.athleteTemplate ? t.athleteTemplate.title : '')).toLowerCase().includes(q);
    });
    return templates.map(function(t) {
      var scheduled = (S().sessions || []).some(function(s) {return s.athleteId === pick.athleteId && s.date === pick.date && s.templateId === t.id;});
      return '<button type="button" class="picker-item" data-calendar-template="' + esc(t.id) + '" onclick="CoachViews.pickLibraryTemplate(this.dataset.calendarTemplate)"' + (scheduled ? ' disabled' : '') + '><span><b>' + esc(t.name) + '</b>' + (t.athleteTemplate ? '<small style="display:block;color:var(--muted)">Strength draft is local only; assigns original coach session.</small>' : '') + '</span><span class="muted">' + (scheduled ? 'Already scheduled' : '+ Add') + '</span></button>';
    }).join('') || '<p class="muted">' + (S().templates.length ? 'No matching sessions.' : 'No session templates yet. Create one in the library.') + '</p>';
  }

  function refreshLibraryResults() {
    var list = document.getElementById('calendarLibraryResults');
    if (list) list.innerHTML = libraryResults();
    var status = document.getElementById('calendarLibraryStatus');
    if (status) status.textContent = ui().libPick.error || '';
  }

  function libraryPickOverlay() {
    var pick = ui().libPick;
    if (!pick) return '';
    if (pick.pickAthlete) {
      var team = ctx.team(pick.teamId);
      var athleteList = (team && team.athleteIds) || [];
      var athletes = athleteList
        .map(function (aid) {
          var a = ctx.athleteBy(aid);
          if (!a) return '';
          return (
            '<button type="button" class="picker-item" data-athlete-id="' +
            esc(aid) +
            '" onclick="CoachViews.pickLibraryAthlete(this.dataset.athleteId)"><span>' +
            esc(a.name) +
            '</span></button>'
          );
        })
        .join('');
      return '<div class="library-pick-overlay" onclick="if(event.target===this)ui.libPick=null;render()"><aside class="library-pick-drawer" role="dialog" aria-label="Choose athlete"><div class="library-pick-head"><b>Choose athlete</b><button class="btn ghost small" onclick="ui.libPick=null;render()">×</button></div><div class="library-pick-body"><p class="muted">' + esc(pick.date) + '</p><div class="picker-list">' + (athletes || '<div class="muted">No athletes on this team.</div>') + '</div></div></aside></div>';
    }
    var athlete = ctx.athleteBy(pick.athleteId);
    return '<div class="library-pick-overlay" onclick="if(event.target===this){ui.libPick=null;render()}"><aside class="library-pick-drawer" role="dialog" aria-label="Add From Library"><div class="library-pick-head"><b>Add From Library</b><button class="btn ghost small" aria-label="Close library picker" onclick="ui.libPick=null;render()">×</button></div><div class="library-pick-body"><input class="table-search" style="width:100%" aria-label="Search calendar sessions" placeholder="Search sessions…" value="' + esc(pick.q || '') + '" oninput="CoachViews.searchLibrary(this.value)"><div class="library-pick-tabs"><button disabled title="Use program assignment to schedule a program">PROGRAMS</button><button class="on" aria-current="page">SESSIONS</button><button disabled title="Parent calendar imports are not available">PARENT CALENDARS</button></div><p class="muted" style="margin-top:14px">Assign to ' + esc(athlete ? athlete.name : 'Choose athlete') + '</p><label class="field"><span>Session date</span><input type="date" aria-label="Session date" value="' + esc(pick.date) + '" onchange="CoachViews.setLibraryDate(this.value)"></label><p id="calendarLibraryStatus" role="status" class="muted">' + esc(pick.error || '') + '</p><div class="picker-list" id="calendarLibraryResults">' + libraryResults() + '</div></div></aside></div>';
  }

  function calendarShell(title, backView, backExtra, sessions, athleteId, teamMode) {
    var mk = monthKey();
    var grid = L().monthGridCells ? L().monthGridCells(mk) : L().monthDays(mk);
    var canPublish = L().hasUnpublished(sessions);
    var cells = grid
      .map(function (d) {
        if (!d) return '<div class="cal-day cal-pad" aria-hidden="true"></div>';
        var daySessions = sessions.filter(function (s) {
          return s.date === d;
        });
        return calDayCell(d, daySessions, athleteId, teamMode);
      })
      .join('');
    var dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
      .map(function (d) {
        return '<div class="cal-dow">' + d + '</div>';
      })
      .join('');
    var mark = String(title || 'T').split(/\s+/).map(function (x) { return x[0]; }).join('').slice(0,3).toUpperCase();
    var manage = teamMode ? 'Manage Team' : 'Manage Athletes';
    return '<div class="fade-in calendar-page"><div class="calendar-hero"><div class="calendar-owner"><button class="btn ghost small" onclick="go(\'' + backView + '\'' + (backExtra ? ',' + backExtra : '') + ')">←</button><span class="team-mark">' + esc(mark) + '</span><div><b>' + esc(title) + '</b><span>' + (teamMode ? 'Team calendar' : 'Athlete calendar') + '</span></div></div><div class="calendar-actions"><button class="btn" onclick="CoachViews.manageCalendar()">' + manage + '</button><button class="btn primary" aria-label="Publish all"' + (canPublish ? '' : ' disabled') + ' onclick="CoachViews.publishAllVisible()">Publish All</button><button class="btn" title="Show Instructions" aria-label="Show calendar instructions" aria-pressed="'+!!ui().showCalendarInstructions+'" onclick="CoachViews.toggleCalendarInstructions()">◉</button><button class="btn" title="Add From Library" onclick="CoachViews.openAddFromLibrary(\'' + mk + '-01\',\'' + (athleteId || '') + '\',' + (!!teamMode) + ')">▣+</button></div></div>' +
      (ui().showCalendarInstructions?'<div class="card"><b>Calendar instructions</b><p>Choose a day to add a session from your library. Copies and repeats start unpublished with no logged results. Publish requires a linked athlete and Supabase coach access. Completed sessions are retained as history.</p></div>':'')+
      '<p class="muted" role="status">' + esc(ui().calendarNotice || '') + '</p><div class="calendar-monthbar"><button aria-label="Previous month" onclick="CoachViews.shiftCalMonth(-1)">‹</button><b>' + esc(L().monthLabel(mk)) + '</b><button aria-label="Next month" onclick="CoachViews.shiftCalMonth(1)">›</button></div>' +
      '<div class="cal-month"><div class="cal-dow-row">' + dow + '</div><div class="cal-grid">' + cells + '</div></div>' + libraryPickOverlay() + calendarPreview() + '</div>';
  }

  function publishAllVisible() {
    var view = ui().view;
    var list = [];
    if (view === 'athlete' && ui().athleteId) {
      list = L().calendarFor(S(), ui().athleteId, monthKey());
    } else if (view === 'team' && ui().teamId) {
      list = L().teamCalendar(S(), ui().teamId, monthKey());
    }
    publishAllForSessions(list.filter(function (s) {
      return !s.published && s.status !== 'completed';
    }));
  }

  function athleteCalHtml() {
    var a = ctx.athleteBy(ui().athleteId);
    if (!a) return athleteListHtml();
    if (!ui().calMonth) {
      var completed = (S().sessions || []).filter(function (s) { return s.athleteId === a.id && s.status === 'completed' && s.date; }).sort(function (x,y) { return x.date < y.date ? 1 : -1; });
      if (completed[0]) ui().calMonth = completed[0].date.slice(0,7);
    }
    var sessions = L().calendarFor(S(), a.id, monthKey());
    return calendarShell(a.name, 'athletes', '', sessions, a.id);
  }

  function teamCalHtml() {
    var t = ctx.team(ui().teamId);
    if (!t) return teamListHtml();
    if (!ui().calMonth) {
      var ids = new Set(t.athleteIds || []);
      var completed = (S().sessions || []).filter(function (s) { return ids.has(s.athleteId) && s.status === 'completed' && s.date; }).sort(function (x,y) { return x.date < y.date ? 1 : -1; });
      if (completed[0]) ui().calMonth = completed[0].date.slice(0,7);
    }
    var sessions = L().teamCalendar(S(), t.id, monthKey());
    return calendarShell(t.name, 'teams', '', sessions, '', true);
  }

  /* ---------- Nutrition N1–N3 ---------- */

  function nutritionHtml() {
    var N = root.CoachNutrition;
    if (!N) return '<div class="card muted">Nutrition module missing.</div>';
    var nut = N.ensureNutrition(S());
    var athletes = S().athletes || [];
    var aid = ui().nutAthleteId || (athletes[0] && athletes[0].id);
    var a = ctx.athleteBy(aid);
    var resolved = N.resolveActiveTargets(nut.targetsByAthlete[aid], null);
    var t = resolved.active;
    var opts = athletes
      .map(function (x) {
        return (
          '<option value="' +
          x.id +
          '"' +
          (x.id === aid ? ' selected' : '') +
          '>' +
          esc(x.name) +
          '</option>'
        );
      })
      .join('');
    var targets = t
      ? '<div class="card"><div class="eyebrow">Active targets</div><div class="metrics cols-4" style="margin-top:10px">' +
        '<div class="metric"><b>' +
        t.calories +
        '</b><span>kcal</span></div>' +
        '<div class="metric"><b>' +
        t.proteinG +
        'g</b><span>Protein</span></div>' +
        '<div class="metric"><b>' +
        t.carbsG +
        'g</b><span>Carbs</span></div>' +
        '<div class="metric"><b>' +
        t.fatG +
        'g</b><span>Fat</span></div></div>' +
        '<p class="muted" style="margin-top:8px">Source: ' +

  function restTimerHtml(){return `<div class="fade-in"><button class="btn small" onclick="CoachTools.openGym('')">← Gym Tools</button><h1>Rest timer</h1><p class="muted">A coach-side rest timer. This does not replace or record an athlete workout. The timer continues while you navigate; reloading resets it.</p><div class="card stack" style="max-width:520px;margin-top:20px"><div class="field"><label for="coachRestDuration">Rest duration (seconds)</label><input id="coachRestDuration" type="number" min="1" max="3600" step="1" value="${clock.duration}" onchange="CoachTools.timerAction('duration',this.value)"></div><output id="coachRestClock" aria-label="Time remaining" style="font-size:64px;font-variant-numeric:tabular-nums">00:00</output><div class="row" style="justify-content:flex-start;gap:10px"><button id="coachTimerStart" class="btn primary" onclick="CoachTools.timerAction('start')">Start</button><button id="coachTimerPause" class="btn" onclick="CoachTools.timerAction('pause')">Pause</button><button class="btn" onclick="CoachTools.timerAction('reset')">Reset</button></div><p id="coachTimerStatus" role="status"></p></div></div>`;}
  function gymHtml(){

  function spreadsheetHtml(){const {S,esc}=ctx,s=currentSheet();if(!s)return spreadsheetList();return `<div class="fade-in"><div class="row"><button class="btn small" onclick="CoachTools.openGym('sheets')">← Spreadsheets</button><button class="btn" disabled title="Testing-sheet publishing is not connected">Publish to Mobile</button><button class="btn" onclick="CoachTools.exportSheet()">Export CSV</button><button class="btn" onclick="CoachTools.duplicateSheet()">Duplicate</button><button class="btn primary" onclick="CoachTools.openGym('sheets')">Save & Close</button></div><div class="rx-grid cols-2" style="margin-top:18px"><div class="field"><label for="sheetTitle">Spreadsheet title</label><input id="sheetTitle" maxlength="100" value="${esc(s.name)}" onchange="CoachTools.patchSheet('name',this.value)"></div><div class="field"><label for="sheetDate">Testing date</label><input id="sheetDate" type="date" value="${esc(s.date)}" onchange="CoachTools.patchSheet('date',this.value)"></div></div><p id="sheetStatus" role="status" class="muted">Changes save on this device. Athlete sessions and analytics are unchanged. Removed athletes' testing results are retained.</p><details class="card" open><summary>Add / Remove Athletes (${s.athleteIds.length})</summary>${S.athletes.map(a=>`<label class="picker-item"><span>${esc(a.name)}</span><input type="checkbox" aria-label="Include ${esc(a.name)}" data-sheet-athlete="${esc(a.id)}" ${s.athleteIds.includes(a.id)?'checked':''} onchange="CoachTools.sheetAthlete(this.dataset.sheetAthlete,this.checked)"></label>`).join('')}</details><div class="row" style="margin:18px 0;justify-content:flex-start;gap:12px"><label for="sheetExercise">Benchmark/exercise</label><select id="sheetExercise">${S.exercises.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}</select><button class="btn" onclick="CoachTools.addSheetColumn()">Add benchmark</button></div><div class="table-wrap"><table class="th-table testing-table"><thead><tr><th>Athlete</th>${s.columns.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${s.athleteIds.map(id=>`<tr><td>${esc(S.athletes.find(a=>a.id===id)?.name||id)}</td>${s.columns.map(c=>`<td><input aria-label="${esc(S.athletes.find(a=>a.id===id)?.name||id)} ${esc(c.name)} result" data-athlete-id="${esc(id)}" data-column-id="${esc(c.id)}" maxlength="100" value="${esc(s.results[id]?.[c.id]||'')}" oninput="CoachTools.patchSheetResult(this.dataset.athleteId,this.dataset.columnId,this.value)"></td>`).join('')}</tr>`).join('')||`<tr><td colspan="${s.columns.length+1}">Add athletes and benchmarks to enter testing results.</td></tr>`}</tbody></table></div></div>`;}
  function accountHtml(){const {S,esc}=ctx;return `<div class="fade-in"><h1>Coach settings</h1><div class="card stack" style="max-width:640px;margin-top:20px"><h2>Local profile</h2><p class="muted">Changes affect this coach workspace only, not Supabase login details.</p><div class="field"><label for="coachProfileName">Display name</label><input id="coachProfileName" maxlength="75" value="${esc(S.coach?.name||'')}"></div><button class="btn primary" onclick="CoachTools.saveProfile()">Save profile</button><p id="coachProfileStatus" role="status"></p><h2>Data & account</h2><p class="muted">Download a backup of this device's coach data. Keep it private: it contains athlete names and training history.</p><button class="btn" onclick="CoachTools.exportBackup()">Download local backup</button><button class="btn" onclick="signOut()">Sign out</button></div><div class="card" style="margin-top:18px"><h2>Connection status</h2><p class="muted">Session publishing uses the configured Supabase account. Invitations, assistant accounts, secure access codes and athlete message delivery still require backend integration. No email is sent by local roster actions.</p></div></div>`;}
  function saveProfile(){const el=document.getElementById('coachProfileName'),status=document.getElementById('coachProfileStatus');if(!el.value.trim()){status.textContent='Enter a display name.';return;}ctx.S.coach.name=el.value.trim();ctx.L.saveState(null,ctx.S);ctx.render();document.getElementById('coachProfileStatus').textContent='Profile saved on this device.';}
  function exportBackup(){const blob=new Blob([JSON.stringify({format:'the-coach-backup',version:1,exportedAt:new Date().toISOString(),state:ctx.S},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='the-coach-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function afterRender(){paintTimer();}
  if(typeof window!=='undefined')setInterval(paintTimer,250);
  return {init,analytics,analyticsHtml,openReport,filterAnalytics,resizeProgram,freshCalendarCopy,validateMacros,validDate,gymHtml,openGym,newSheet,createSheet,patchSheet,sheetAthlete,addSheetColumn,patchSheetResult,sheetCsv,exportSheet,duplicateSheet,timerAction,remaining,accountHtml,saveProfile,exportBackup,afterRender};
});

<script data-bundled="./athlete-runtime/library.js">(function (root) {
  const TRACK = [
    { key: 'reps', label: 'Reps' },
    { key: 'reps_range', label: 'Rep Range' },
    { key: 'weight_lb', label: 'Weight (lb)' },
    { key: 'weight_kg', label: 'Weight (kg)' },
    { key: 'weight_pct', label: 'Weight (%)' },
    { key: 'lwp', label: 'Linear Weight Progression' },
    { key: 'time_mmss', label: 'Time (mm:ss)' },
    { key: 'seconds', label: 'Seconds' },
    { key: 'miles', label: 'Miles' },
    { key: 'yards', label: 'Yards' },
    { key: 'meters', label: 'Meters' },
    { key: 'feet', label: 'Feet' },
    { key: 'watts', label: 'Watts' },
    { key: 'calories', label: 'Calories' },
    { key: 'inches', label: 'Inches' },
    { key: 'velocity', label: 'Velocity (m/s)' },
    { key: 'other', label: 'Other' },
    { key: 'for_completion', label: 'For Completion' },
  ];

  const SEED_EXERCISES = [
    'Bench Press',
    'Lat Pull Downs',
    'Back Squat',
    'Front Squat',
    'Snatch Grip Rack Deadlift',
    'Barbell Lateral Squat',
    'Goblet Box Squat',
    'Reverse Hypers',
    'Double Leg Banded Leg Curls',
    'Garhammer Raises',
    'Farmer Carry',
    'Backwards Sled Drag',
  ];

  const SEED_CIRCUITS = [
    { title: 'Deadlift Warm-Up', instructions: 'Foam roll hamstrings\nActive straight leg raises' },
    { title: 'Bench Press Warm-Up', instructions: 'Foam roll pecs\nBiphasic pec stretch' },
    { title: 'Recovery Breathing', instructions: '10 nasal breaths\n5s inhale · 1s hold · 5s exhale' },
    { title: 'Cooldown', instructions: 'Worlds Greatest Stretch\nRecovery breathing' },
  ];

  function nid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 9);
  }

  function clone(v) {
    return JSON.parse(JSON.stringify(v));
  }

  function seedCatalog() {
    return {
      exercises: SEED_EXERCISES.map((title) => ({
        id: nid('ex'),
        title,
        columns: title === 'Garhammer Raises' ? ['reps'] : ['reps', 'weight_kg'],
      })),
      circuits: SEED_CIRCUITS.map((c) => ({
        id: nid('ci'),
        title: c.title,
        track: 'for_completion',
        instructions: c.instructions,
      })),
    };
  }

  function emptyState() {
    return {
      templates: [],
      catalog: seedCatalog(),
      assignments: {},
    };
  }

  function ensure(state) {
    if (!state || typeof state !== 'object') return emptyState();
    const next = {
      templates: Array.isArray(state.templates) ? state.templates.filter((t) => !root.StrengthOnly?.isConditioning(t)).map((t) => ({ ...t, blocks: (t.blocks || []).filter((b) => ['lift', 'circuit'].includes(b.kind)) })) : [],
      catalog: state.catalog && Array.isArray(state.catalog.exercises)
        ? state.catalog
        : seedCatalog(),
      assignments: state.assignments && typeof state.assignments === 'object' ? state.assignments : {},
    };
    if (!next.catalog.exercises.length && !next.catalog.circuits.length) next.catalog = seedCatalog();
    return next;
  }

  function template(state, tid) {
    return (state.templates || []).find((t) => t.id === tid) || null;
  }

  function createTemplate(state, { title, instructions } = {}) {
    const st = clone(ensure(state));
    st.templates.unshift({
      id: nid('tpl'),
      title: String(title || 'Session Template').trim() || 'Session Template',
      instructions: String(instructions || ''),
      blocks: [],
    });
    return st;
  }

  function patchTemplate(state, tid, patch) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    Object.assign(t, patch);
    return st;
  }

  function addCircuit(state, tid, { title, instructions, catalogId } = {}) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    let instr = instructions || '';
    let name = title || 'Circuit';
    if (catalogId) {
      const hit = st.catalog.circuits.find((c) => c.id === catalogId);
      if (hit) {
        name = hit.title;
        instr = hit.instructions || instr;
      }
    }
    t.blocks.push({
      id: nid('blk'),
      kind: 'circuit',
      title: name,
      instructions: instr,
      track: 'for_completion',
    });
    return st;
  }

  function addExercise(state, tid, { title, setCount, columns, notes, catalogId, restSec } = {}) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    let cols = Array.isArray(columns) && columns.length ? columns.slice() : ['reps', 'weight_kg'];
    let name = title || 'Exercise';
    if (catalogId) {
      const hit = st.catalog.exercises.find((c) => c.id === catalogId);
      if (hit) {
        name = hit.title;
        cols = (hit.columns || cols).slice();
      }
    }
    cols = cols.filter((k) => k && k !== 'none');
    if (!cols.length) cols = ['reps'];
    t.blocks.push({
      id: nid('blk'),
      kind: 'lift',
      title: name,
      setCount: Math.max(1, Number(setCount) || 3),
      columns: cols,
      notes: Array.isArray(notes) ? notes : [],
      restSec: restSec == null ? 120 : Number(restSec) || 0,
      groupId: null,
    });
    return st;
  }

  function removeBlock(state, tid, bid) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    t.blocks = t.blocks.filter((b) => b.id !== bid);
    return st;
  }

  function moveBlock(state, tid, bid, dir) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const i = t.blocks.findIndex((b) => b.id === bid);
    const j = i + (dir < 0 ? -1 : 1);
    if (i < 0 || j < 0 || j >= t.blocks.length) return st;
    const tmp = t.blocks[i];
    t.blocks[i] = t.blocks[j];
    t.blocks[j] = tmp;
    return st;
  }

  function patchBlock(state, tid, bid, patch) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const b = t.blocks.find((x) => x.id === bid);
    if (!b) return st;
    Object.assign(b, patch);
    if (Array.isArray(b.columns)) b.columns = b.columns.filter((k) => k && k !== 'none');
    return st;
  }

  function linkSuperset(state, tid, aId, bId) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const a = t.blocks.find((x) => x.id === aId);
    const b = t.blocks.find((x) => x.id === bId);
    if (!a || !b || a.kind !== 'lift' || b.kind !== 'lift') return st;
    const gid = a.groupId || b.groupId || nid('ss');
    a.groupId = gid;
    b.groupId = gid;
    return st;
  }

  function unlinkSuperset(state, tid, bid) {
    const st = clone(ensure(state));
    const t = st.templates.find((x) => x.id === tid);
    if (!t) return st;
    const b = t.blocks.find((x) => x.id === bid);
    if (b) b.groupId = null;
    return st;
  }

  function lettered(tpl) {
    const blocks = (tpl.blocks || []).map((b) => ({ ...b }));
    let code = 65;
    let i = 0;
    while (i < blocks.length) {
      const b = blocks[i];
      if (b.kind !== 'lift') {
        b.letter = String.fromCharCode(code++);
        i += 1;
        continue;
      }
      const run = [b];
      let j = i + 1;
      if (b.groupId) {
        while (j < blocks.length && blocks[j].kind === 'lift' && blocks[j].groupId === b.groupId) {
          run.push(blocks[j]);
          j += 1;
        }
      }
      const L = String.fromCharCode(code++);
      if (run.length === 1) run[0].letter = L;
      else run.forEach((x, n) => { x.letter = L + String(n + 1); });
      i = j;
    }
    return blocks;
  }

  function itemsFromInstructions(text) {
    const lines = String(text || '')
      .split(/\n+/)
      .map((s) => s.replace(/^\s*\d+[.)]\s*/, '').trim())
      .filter(Boolean);
    return lines.map((text, i) => ({ n: i + 1, text }));
  }

  function rxFor(block) {
    const sets = Math.max(1, Number(block.setCount) || 3);
    const cols = block.columns || ['reps'];
    const repBit = cols[0] === 'reps_range' ? '8-12' : cols[0] === 'reps' ? '8' : '';
    if (cols.includes('meters')) return repBit ? `${sets} x ${repBit} m` : `${sets} x m`;
    if (cols[0] === 'reps' || cols[0] === 'reps_range') return `${sets} x ${repBit}`;
    if (cols[0] === 'seconds' || cols[0] === 'time_mmss') return `${sets} x time`;
    return `${sets} sets`;
  }

  function sectionFor(block) {
    if (block.kind === 'circuit') {
      if (/recover|cool/i.test(block.title || '')) return 'Recovery';
      return 'Warm-Up';
    }
    return 'Strength/Power';
  }

  function compile(tpl) {
    const blocks = [];
    let lastSection = '';
    for (const b of lettered({ ...tpl, blocks: (tpl.blocks || []).filter((b) => ['lift', 'circuit'].includes(b.kind)) })) {
      const section = sectionFor(b);
      if (section !== lastSection) {
        blocks.push({ kind: 'section', label: section.toUpperCase() });
        lastSection = section;
      }
      if (b.kind === 'circuit') {
        const recovery = /recover|cool/i.test(b.title || '');
        blocks.push({
          kind: recovery ? 'recovery' : 'warmup',
          letter: b.letter,
          title: b.title,
          items: itemsFromInstructions(b.instructions),
          bullets: recovery ? itemsFromInstructions(b.instructions).map((x) => x.text) : [],
          footer: 'For Completion',
          section,
        });
      } else {
        blocks.push({
          kind: 'lift',
          letter: b.letter,
          title: b.title,
          prescription: rxFor(b),
          notes: b.notes || [],
          columns: (b.columns || ['reps']).slice(),
          setCount: b.setCount,
          restSec: b.restSec,
          targetEffort: b.targetEffort || 'average',
          section,
        });
      }
    }
    return {
      id: tpl.id,
      title: tpl.title || 'Session Template',
      instructions: tpl.instructions || '',
      blocks,
      dots: {},
    };
  }

  function assignDate(state, tid, date) {
    const st = clone(ensure(state));
    if (!st.templates.some((t) => t.id === tid)) return st;
    st.assignments[date] = tid;
    return st;
  }

  function unassignDate(state, date) {
    const st = clone(ensure(state));
    delete st.assignments[date];
    return st;
  }

es ? 'disabled style=\"opacity:.35\"' : ''}>Next →\u003c/button>\n      \u003c/div>`;\n  }\n\n  function switchBtn() {\n    return `\u003cbutton type=\"button\" class=\"tm-switch\" onclick=\"Logger.timerSwitch()\">${icoSwitch()} Switch\u003c/button>`;\n  }\n\n  function modeTitle(mode) {\n    if (mode === 'tabata') return 'Tabata Timer';\n    if (mode === 'emom') return 'EMOM Timer';\n    return (HybridTimer.PICKER.find((p) => p.id === mode) || {}).label || mode;\n  }\n\n  function pickerIcon(id) {\n    const g = '#16ec06';\n    const w = '#fff';\n    if (id === 'rest') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">${circ()}\u003ctext x=\"36\" y=\"44\" text-anchor=\"middle\" fill=\"${g}\" font-size=\"22\" font-weight=\"700\" font-family=\"Barlow Condensed,sans-serif\">Zzz\u003c/text>\u003c/svg>`;\n    }\n    if (id === 'stopwatch') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">${circ()}\u003ccircle cx=\"36\" cy=\"38\" r=\"16\" fill=\"none\" stroke=\"${w}\" stroke-width=\"2.5\"/>\u003cpath d=\"M36 38 L36 26\" stroke=\"${g}\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003crect x=\"32\" y=\"12\" width=\"8\" height=\"6\" rx=\"1\" fill=\"${w}\"/>\u003c/svg>`;\n    }\n    if (id === 'amrap') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">\u003cpath d=\"M14 50 A24 24 0 1 1 58 50\" fill=\"none\" stroke=\"${w}\" stroke-width=\"2.5\"/>\u003cpath d=\"M36 50 L52 28\" stroke=\"${g}\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003c/svg>`;\n    }\n    if (id === 'forTime') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">${circ()}\u003cpath d=\"M36 20 A16 16 0 1 1 20 36\" fill=\"none\" stroke=\"${g}\" stroke-width=\"8\"/>\u003ccircle cx=\"36\" cy=\"36\" r=\"3\" fill=\"${w}\"/>\u003c/svg>`;\n    }\n    if (id === 'tabata') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">\u003ctext x=\"36\" y=\"46\" text-anchor=\"middle\" fill=\"${g}\" font-size=\"28\" font-weight=\"700\" font-family=\"Barlow Condensed,sans-serif\">:20\u003c/text>\u003c/svg>`;\n    }\n    if (id === 'custom') {\n      return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">${circ()}\u003cpath d=\"M36 20 A16 16 0 0 1 52 36 L36 36 Z\" fill=\"${g}\"/>\u003c/svg>`;\n    }\n    return `\u003csvg viewBox=\"0 0 72 72\" class=\"tm-ico\">\u003ctext x=\"36\" y=\"46\" text-anchor=\"middle\" fill=\"${g}\" font-size=\"22\" font-weight=\"700\" font-family=\"Barlow Condensed,sans-serif\">1:00\u003c/text>\u003c/svg>`;\n  }\n\n  function circ() {\n    return `\u003ccircle cx=\"36\" cy=\"36\" r=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\"/>`;\n  }\n\n  function icoSwitch() {\n    return `\u003csvg viewBox=\"0 0 20 20\" width=\"16\" height=\"16\">\u003ccircle cx=\"10\" cy=\"11\" r=\"6\" fill=\"none\" stroke=\"#1ba3ff\" stroke-width=\"1.6\"/>\u003cpath d=\"M10 7 v4\" stroke=\"#1ba3ff\" stroke-width=\"1.6\"/>\u003c/svg>`;\n  }\n\n  function fieldBox(key, value, label) {\n    return `\u003clabel class=\"tm-field\">\u003cspan>${esc(label)}\u003c/span>\u003cinput inputmode=\"numeric\" value=\"${esc(value)}\" onchange=\"Logger.timerField('${esc(key)}', this.value)\">\u003c/label>`;\n  }\n\n  function pairBoxes(aKey, aVal, bKey, bVal, label) {\n    return `\u003cdiv class=\"tm-pair\">\n      \u003cinput inputmode=\"numeric\" value=\"${esc(aVal)}\" onchange=\"Logger.timerField('${esc(aKey)}', this.value)\">\n      \u003ci>:\u003c/i>\n      \u003cinput inputmode=\"numeric\" value=\"${esc(bVal)}\" onchange=\"Logger.timerField('${esc(bKey)}', this.value)\">\n      \u003cspan>${esc(label)}\u003c/span>\n    \u003c/div>`;\n  }\n\n  function setupHtml(snap) {\n    const mode = snap.mode;\n    const c = snap.config || {};\n    const title = modeTitle(mode);\n    let body = '';\n    if (mode === 'rest') {\n      const m = Math.floor((c.restMs || 0) / 60000);\n      const s = Math.floor(((c.restMs || 0) % 60000) / 1000);\n      body = `\n        \u003cp class=\"tm-kicker\">Quick Start\u003c/p>\n        \u003cdiv class=\"tm-quick\">${[30000, 45000, 60000, 90000, 120000].map((ms) => {\n          const clock = HybridTimer.formatClock(ms, false);\n          return `\u003cbutton type=\"button\" onclick=\"Logger.timerQuick(${ms})\">${clock}\u003c/button>`;\n        }).join('')}\u003c/div>\n        \u003chr class=\"tm-rule\">\n        \u003cp class=\"tm-kicker\">Customize\u003c/p>\n        \u003cdiv class=\"tm-custom\">\n          \u003cbutton type=\"button\" onclick=\"Logger.timerNudge(-1)\">−\u003c/button>\n          \u003cdiv class=\"tm-ms\">\u003cb>${m}\u003c/b>\u003cspan>m\u003c/span>\u003c/div>\n          \u003cdiv class=\"tm-ms\">\u003cb>${String(s).padStart(2, '0')}\u003c/b>\u003cspan>s\u003c/span>\u003c/div>\n          \u003cbutton type=\"button\" onclick=\"Logger.timerNudge(1)\">+\u003c/button>\n        \u003c/div>\n        \u003cbutton type=\"button\" class=\"tm-start\" onclick=\"Logger.timerStart()\">\u003cspan>▶\u003c/span>Start\u003c/button>`;\n    } else if (mode === 'stopwatch' || mode === 'forTime') {\n      body = `\n        \u003cbutton type=\"button\" class=\"tm-giant\" onclick=\"Logger.timerStart()\">▶\u003c/button>\n        \u003cdiv class=\"tm-countin-row\">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}\u003c/div>\n        \u003cdiv class=\"tm-run-btns\">\n          \u003cbutton type=\"button\" class=\"tm-reset\" onclick=\"Logger.timerReset()\">Reset\u003c/button>\n          \u003cbutton type=\"button\" class=\"tm-pause\" onclick=\"Logger.timerPause()\">Pause\u003c/button>\n        \u003c/div>`;\n    } else if (mode === 'amrap') {\n      body = `\n        ${pairBoxes('totalMin', Math.floor((c.totalMs || 0) / 60000), 'totalSec', String(Math.floor(((c.totalMs || 0) % 60000) / 1000)).padStart(2, '0'), 'Total Time')}\n        \u003cdiv class=\"tm-countin-row\">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}\u003c/div>\n        \u003cbutton type=\"button\" class=\"tm-start\" onclick=\"Logger.timerStart()\">\u003cspan>▶\u003c/span>Start\u003c/button>`;\n    } else if (mode === 'tabata' || mode === 'custom') {\n      const work = c.workMs || 0;\n      const rest = c.restMs || 0;\n      const blurb = mode === 'tabata'\n        ? `${c.rounds} rounds of ${Math.round(work / 1000)} seconds work, ${Math.round(rest / 1000)} seconds rest`\n        : `${c.rounds} rounds of: ${HybridTimer.formatClock(work, false)} work / ${HybridTimer.formatClock(rest, false)} rest`;\n      body = `\n        \u003cp class=\"tm-blurb\">${esc(blurb)}\u003c/p>\n        ${fieldBox('rounds', c.rounds, 'Rounds')}\n        ${mode === 'tabata'\n          ? `${fieldBox('workSec', Math.round(work / 1000), 'Work')}${fieldBox('restSec', Math.round(rest / 1000), 'Rest')}`\n          : `${pairBoxes('workMin', Math.floor(work / 60000), 'workSec', String(Math.floor((work % 60000) / 1000)).padStart(2, '0'), 'Work')}\n             ${pairBoxes('restMin', Math.floor(rest / 60000), 'restSec', String(Math.floor((rest % 60000) / 1000)).padStart(2, '0'), 'Rest')}`}\n        \u003cdiv class=\"tm-countin-row\">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}\u003c/div>\n        \u003cbutton type=\"button\" class=\"tm-start\" onclick=\"Logger.timerStart()\">\u003cspan>▶\u003c/span>Start\u003c/button>`;\n    } else if (mode === 'emom') {\n      body = `\n        ${pairBoxes('everyMin', Math.floor((c.everyMs || 0) / 60000), 'everySec', String(Math.floor(((c.everyMs || 0) % 60000) / 1000)).padStart(2, '0'), 'Every')}\n        ${fieldBox('rounds', c.rounds, 'Rounds')}\n        \u003cdiv class=\"tm-countin-row\">${fieldBox('countInSec', Math.round((c.countInMs || 0) / 1000), 'Count In')}\u003c/div>\n        \u003cbutton type=\"button\" class=\"tm-start\" onclick=\"Logger.timerStart()\">\u003cspan>▶\u003c/span>Start\u003c/button>`;\n    }\n    return `\n      \u003cdiv class=\"tm-full\" id=\"logTimerFull\">\n        \u003cdiv class=\"tm-head\">\n          \u003ch2>${esc(title)}\u003c/h2>\n          ${switchBtn()}\n        \u003c/div>\n        \u003cdiv class=\"tm-setup\">${body}\u003c/div>\n      \u003c/div>`;\n  }\n\n  function pickerHtml() {\n    const tiles = HybridTimer.PICKER.map((m) => `\u003cbutton type=\"button\" class=\"tm-tile\" onclick=\"Logger.timerChoose('${m.id}')\">${pickerIcon(m.id)}\u003cspan>${esc(m.label)}\u003c/span>\u003c/button>`).join('');\n    return `\u003cdiv class=\"tm-full tm-picker\" id=\"logTimerFull\">\n      \u003cbutton type=\"button\" class=\"tm-x\" onclick=\"Logger.timerClosePicker()\" aria-label=\"Close\">×\u003c/button>\n      \u003cdiv class=\"tm-grid\">${tiles}\u003c/div>\n    \u003c/div>`;\n  }\n\n  function runHtml(snap) {\n    const title = modeTitle(snap.mode);\n    if (snap.view === 'countIn') {\n      return `\u003cdiv class=\"tm-full\" id=\"logTimerFull\">\n        \u003cdiv class=\"tm-head\">\u003ch2>${esc(title)}\u003c/h2>${switchBtn()}\u003c/div>\n        \u003cdiv class=\"tm-countin\">${esc(snap.countInLabel)}\u003c/div>\n      \u003c/div>`;\n    }\n    const inner = `\u003cdiv class=\"tm-face\">\n      ${snap.roundFraction ? `\u003csmall>${esc(snap.roundFraction)}\u003c/small>` : ''}\n      \u003cstrong>${esc(snap.clock || '')}\u003c/strong>\n      ${snap.roundLabel ? `\u003cem>${esc(snap.roundLabel)}\u003c/em>` : ''}\n    \u003c/div>`;\n    return `\u003cdiv class=\"tm-full\" id=\"logTimerFull\">\n      \u003cdiv class=\"tm-head\">\u003ch2>${esc(title)}\u003c/h2>${switchBtn()}\u003c/div>\n      \u003cdiv class=\"tm-run\">${ringSvg(snap.progress == null ? 1 : snap.progress, inner)}\u003c/div>\n      ${snap.mode !== 'rest' ? `\u003cdiv class=\"tm-run-btns\">\u003cbutton type=\"button\" class=\"tm-reset\" onclick=\"Logger.timerReset()\">Reset\u003c/button>${snap.mode === 'stopwatch' || snap.mode === 'forTime' ? `\u003cbutton type=\"button\" class=\"tm-pause\" onclick=\"Logger.timerPause()\">Pause\u003c/button>` : ''}\u003c/div>` : ''}\n    \u003c/div>`;\n  }\n\n  function timerOverlayHtml() {\n    const t = timerState();\n    const snap = HybridTimer.snapshot(t, Date.now());\n    let extra = '';\n    if (snap.view === 'picker') extra = pickerHtml();\n    else if (snap.view === 'setup') extra = setupHtml(snap);\n    else if ((snap.view === 'running' || snap.view === 'countIn') && snap.display === 'fullscreen') extra = runHtml(snap);\n    if (snap.stopSheet) {\n      extra += `\u003cdiv class=\"tm-stop\" onclick=\"if(event.target===this)Logger.timerCancelStop()\">\n        \u003cdiv class=\"tm-stop-card\">\n          \u003cbutton type=\"button\" class=\"tm-stop-go\" onclick=\"Logger.timerStop()\">Stop Timer\u003c/button>\n          \u003cbutton type=\"button\" onclick=\"Logger.timerCancelStop()\">Cancel\u003c/button>\n        \u003c/div>\n      \u003c/div>`;\n    }\n    return extra;\n  }\n\n  function quoteHtml() {\n    return `\u003cdiv class=\"log-quote\">\u003cp>${esc(QUOTE)}\u003c/p>\u003c/div>`;\n  }\n\n  function coachHtml() {\n    const s = session();\n    const copy = (s && s.instructions && String(s.instructions).trim()) ? s.instructions : COACH;\n    return `\n      \u003cdiv class=\"log-coach\">\n        \u003ch1>Coach Instructions\u003c/h1>\n        \u003cp>${esc(copy).replace(/\\n/g, '\u003cbr>')}\u003c/p>\n        \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.gotCoach()\">Got It\u003c/button>\n      \u003c/div>`;\n  }\n\n  function completeHtml(s, page, log) {\n    const items = (page.items || []).map((it) => `\n      \u003cli>\u003cstrong>${it.n}.\u003c/strong> ${esc(it.text)}\n        ${it.note ? `\u003cp class=\"log-note\">\u003cem>*${esc(it.note)}\u003c/em>\u003c/p>` : ''}\n      \u003c/li>`).join('');\n    const bullets = (page.bullets || []).map((b) => `\u003cli>${esc(b)}\u003c/li>`).join('');\n    return `\n      \u003cp class=\"log-kicker\">${esc(page.letter)}. ${esc(page.section)}\u003c/p>\n      \u003ch2 class=\"log-title\">${esc(page.title)}\u003c/h2>\n      ${items ? `\u003col class=\"log-list\">${items}\u003 y_easy:'Very Easy',easy:'Easy',average:'Average',hard:'Hard',max_effort:'Max Effort'})[effort] || '—'; }\n\n  const EFFORTS = ['very_easy', 'easy', 'average', 'hard', 'max_effort'];\n  const EFFORT_COPY = { very_easy: 'Very light effort.', easy: 'Could have done 5–7 more reps.', average: 'Could have done 3–4 more reps.', hard: 'Could have done 1 or 2 more reps.', max_effort: 'Could not do any more reps.' };\n\n  function setFlow(s, page) {\n    const rows = (s.logs[page.id] && s.logs[page.id].sets) || [];\n    const pending = rows.findIndex((r) => !r.logged);\n    const saved = (s.loggerSetFlow || {})[page.id] || {};\n    const index = Number.isInteger(saved.index) && rows[saved.index] && (saved.editing || !rows[saved.index].logged)\n      ? saved.index : pending;\n    const row = rows[index];\n    return {\n      ...saved, index, rows,\n      draft: saved.index === index && saved.draft ? saved.draft : {\n        reps: row && row.reps != null ? row.reps : '',\n        kg: row && row.kg != null ? row.kg : '',\n        effort: row && row.logged ? row.effort || null : null,\n        miss: !!(row && row.logged && row.miss),\n      },\n    };\n  }\n\n  function supportsSetFlow(page) {\n    return !/carry|farmer|suitcase|\\bhold\\b|plank/i.test(page.title || '') && ['kg', 'reps', 'max'].includes(page.logMode) && columnsFor(page).every((c) => ['reps', 'reps_range', 'weight_kg'].includes(c));\n  }\n\n  function setActionHtml(s, page) {\n    const flow = setFlow(s, page);\n    if (flow.index \u003c 0) return '';\n    return `\u003cdiv class=\"log-set-action\">\u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.${flow.rest ? 'startSet' : 'saveSet'}('${esc(page.id)}')\">${flow.rest ? 'Start next set' : flow.editing ? 'Save changes' : 'Log set'}\u003c/button>\u003c/div>`;\n  }\n\n  function activeSetHtml(s, page, log, dockAction = false) {\n    const flow = setFlow(s, page);\n    const id = esc(page.id);\n    const target = EFFORTS.includes(page.targetEffort) ? page.targetEffort : null;\n    const chosen = EFFORTS.includes(flow.draft.effort) ? flow.draft.effort : null;\n    const position = EFFORTS.indexOf(chosen || target || 'average');\n    const done = flow.index \u003c 0;\n    const rows = flow.rows;\n    const repTarget = page.targetReps == null ? 'MAX' : page.targetRepMax > page.targetReps ? `${page.targetReps}–${page.targetRepMax}` : page.targetReps;\n    const history = rows.map((r, i) => r.logged ? `\u003cbutton type=\"button\" class=\"log-set-history\" aria-label=\"Edit set ${i + 1} of ${esc(page.title)}\" onclick=\"Logger.editSet('${id}',${i})\">\u003cspan class=\"log-set-tick\">✓\u003c/span>\u003cspan>Set ${i + 1} · ${page.logMode === 'kg' ? `${esc(r.kg)} kg × ` : ''}${esc(r.reps)} reps · ${r.miss ? 'Incomplete' : esc(effortShort(r.effort))}\u003c/span>\u003cspan class=\"log-link\">Edit\u003c/span>\u003c/button>` : '').join('');\n    return `\u003cp class=\"log-rx\">${esc(page.prescription)}\u003c/p>\n      ${page.notes && page.notes.length ? `\u003cul class=\"log-notes\">${page.notes.map((n) => `\u003cli>${esc(n)}\u003c/li>`).join('')}\u003c/ul>` : ''}\n      \u003cp class=\"log-demo-note\">Demo load adjustment · 1 kg steps\u003c/p>\u003cp class=\"log-note\">${(s.restChoices || {})[HybridSession.currentPage(s).id] ? `Rest: ${Math.round(s.restChoices[HybridSession.currentPage(s).id]/1000)} seconds · starts on Log set` : \"Choose your rest using Select Timer below.\"}\u003c/p>\n      \u003csection class=\"log-active-set\" data-exercise=\"${id}\">\n        \u003cdiv class=\"log-set-heading\">\u003ch3>${done ? `All ${rows.length} sets recorded` : `${flow.rest ? 'Next · ' : ''}Set ${flow.index + 1} of ${rows.length}`}\u003c/h3>${done ? '' : `\u003cspan>${esc(repTarget)} reps\u003c/span>`}\u003c/div>\n        ${done ? '\u003cp class=\"log-note\">Review a set below or move to the next exercise.\u003c/p>' : `\n        ${flow.adjustment && !flow.rest ? `\u003cp class=\"log-note log-load-decision\">${esc(flow.adjustment.reason)}\u003c/p>` : \"\"}\u003cdiv class=\"log-active-fields\">\n          \u003clabel>Reps completed\u003cinput class=\"log-cell\" type=\"number\" inputmode=\"numeric\" min=\"0\" step=\"1\" value=\"${esc(flow.draft.reps)}\" oninput=\"Logger.setField('${id}','reps',this.value)\">\u003c/label>\n          ${page.logMode === 'kg' ? `\u003clabel>Weight (kg)\u003cinput class=\"log-cell\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"any\" value=\"${esc(flow.draft.kg)}\" oninput=\"Logger.setField('${id}','kg',this.value)\">\u003c/label>` : ''}\n        \u003c/div>\n        ${target ? `\u003cp class=\"log-set-target\">Target effort: \u003cstrong>${esc(effortShort(target) === 'Med' ? 'Medium' : effortShort(target))}\u003c/strong>\u003c/p>` : '\u003cp class=\"log-set-target\">Target effort not prescribed\u003c/p>'}\n        ${flow.rest ? `\u003cp class=\"log-note\">${flow.adjustment ? esc(flow.adjustment.reason) : \"Set saved. Review the next set; adjust the weight if needed.\"}\u003c/p>${dockAction ? '' : `\u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.startSet('${id}')\">Start next set\u003c/button>`}\u003cbutton type=\"button\" class=\"log-set-skip\" onclick=\"Logger.startSet('${id}')\">Skip rest\u003c/button>` : `\n        \u003cdiv class=\"log-effort-inline\">\n          \u003cdiv class=\"log-effort-heading\">\u003clabel id=\"effortHeading-${id}\" for=\"setEffort-${id}\">${chosen ? 'This set felt' : target ? 'This set should feel' : 'How did this set feel?'}\u003c/label>\u003cstrong id=\"effortValue-${id}\">${chosen ? chosen === 'medium' ? 'Medium' : effortShort(chosen) : target ? target === 'medium' ? 'Medium' : effortShort(target) : 'Choose effort'}\u003c/strong>\u003c/div>\n          \u003cinput id=\"setEffort-${id}\" class=\"log-effort-slider\" type=\"range\" min=\"0\" max=\"4\" step=\"1\" value=\"${position}\" aria-label=\"Actual set effort\" aria-valuetext=\"${chosen ? chosen === 'medium' ? 'Medium' : effortShort(chosen) : 'Not rated'}\" ${flow.draft.miss ? 'disabled' : ''} oninput=\"Logger.setEffort('${id}',this.value)\" onpointerup=\"Logger.setEffort('${id}',this.value)\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();Logger.setEffort('${id}',this.value)}\">\n          \u003cdiv class=\"log-effort-labels\" aria-hidden=\"true\">\u003cspan>Very Easy\u003c/span>\u003cspan>Easy\u003c/span>\u003cspan>Average\u003c/span>\u003cspan>Hard\u003c/span>\u003cspan>Max Effort\u003c/span>\u003c/div>\n          \u003cp class=\"log-note\" id=\"effortHelp-${id}\">${flow.draft.miss ? 'Enter the reps you actually completed.' : chosen ? EFFORT_COPY[chosen] : 'Rate the actual effort after completing your set.'}\u003c/p>\n        \u003c/div>\n        \u003cbutton type=\"button\" class=\"log-set-incomplete\" aria-pressed=\"${!!flow.draft.miss}\" onclick=\"Logger.setIncomplete('${id}')\">Did Not Complete\u003c/button>\n        \u003cp class=\"log-set-error\" role=\"status\">${esc(flow.error || '')}\u003c/p>\n        ${dockAction ? '' : `\u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.saveSet('${id}')\">${flow.editing ? 'Save changes' : 'Log set'}\u003c/button>`}`}`}\n      \u003c/section>\n      \u003cdiv class=\"log-set-history-list\">${history}\u003c/div>\n      \u003cdiv class=\"log-set-ctrl\">\u003cbutton type=\"button\" onclick=\"Logger.nudgeSets('${id}',-1)\" aria-label=\"Remove a set\">−\u003c/button>\u003cspan>Sets\u003c/span>\u003cbutton type=\"button\" onclick=\"Logger.nudgeSets('${id}',1)\" aria-label=\"Add a set\">+\u003c/button>\u003c/div>\n      \u003cinput class=\"log-ex-note\" placeholder=\"Add exercise note\" aria-label=\"Exercise note\" value=\"${esc(log.note || '')}\" onchange=\"Logger.note('${id}',this.value)\">`;\n  }\n\n  function updateSetFlow(memberId, update, repaint = true) {\n    const s = JSON.parse(JSON.stringify(session()));\n    const page = HybridSession.currentPage(s);\n    const lift = page.logMode === 'superset' ? HybridSession.memberOf(page, memberId) : page;\n    if (!lift || lift.id !== memberId) return;\n    const flow = setFlow(s, lift);\n    const { rows, ...stored } = flow;\n    s.loggerSetFlow = { ...(s.loggerSetFlow || {}), [memberId]: update(stored, lift, s) };\n    if (repaint) persist(s);\n    else { root.S.session = s; if (typeof root.save === 'function') root.save(); }\n  }\n\n  function tableHtml(s, page, log) {\n    const cols = columnsFor(page);\n    const mid = esc(page.id);\n    const heads = cols.map((k) => `\u003cth>${esc((root.HybridLibrary && HybridLibrary.trackLabel(k)) || k)}\u003c/th>`).join('');\n    const rows = (log.sets || []).map((row, i) => {\n      const tds = cols.map((k) => {\n        const field = colField(k);\n        const focus = pad && pad.memberId === page.id && pad.setIndex === i && pad.field === field;\n        const val = cellVal(row, field);\n        const ph = field === 'reps' && row.reps == null;\n        return `\u003ctd>\u003cbutton type=\"button\" class=\"log-cell${focus ? ' focus' : ''}${ph ? ' ph' : ''}\" onclick=\"Logger.focusPad('${mid}',${i},'${esc(field)}')\">${esc(val)}\u003c/button>\u003c/td>`;\n      }).join('');\n      return `\u003ctr>\n        \u003ctd>${i + 1}\u003c/td>\n        ${tds}\n        \u003ctd>\u003cbutton type=\"button\" class=\"log-check${row.logged ? ' on' : ''}\" onclick=\"Logger.check('${mid}',${i})\">${row.logged ? '✓' : ''}\u003c/button>\u003c/td>\n      \u003c/tr>`;\n    }).join('');\n    return `\n      \u003cp class=\"log-rx\">${esc(page.prescription)}\u003c/p>\n      ${page.notes && page.notes.length ? `\u003cul class=\"log-notes\">${page.notes.map((n) => `\u003cli>${esc(n)}\u003c/li>`).join('')}\u003c/ul>` : ''}\n      \u003ctable class=\"log-table\">\n        \u003cthead>\u003ctr>\u003cth>Sets\u003c/th>${heads}\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>${rows}\u003c/tbody>\n      \u003c/table>\n      \u003cdiv class=\"log-set-ctrl\">\n        \u003cbutton type=\"button\" onclick=\"Logger.nudgeSets('${mid}',-1)\">−\u003c/button>\n        \u003cspan>Set\u003c/span>\n        \u003cbutton type=\"button\" onclick=\"Logger.nudgeSets('${mid}',1)\">+\u003c/button>\n      \u003c/div>\n      \u003cinput class=\"log-ex-note\" placeholder=\"Add exercise note\" value=\"${esc(log.note || '')}\" onchange=\"Logger.note('${mid}',this.value)\">`;\n  }\n\n  function hubHtml() {\n    return `\n      \u003cdiv class=\"log-hub\">\n        \u003cimg src=\"assets/hpp-logo.jpg\" alt=\"Hybrid Power Project\">\n        \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.doneTraining()\">Done Training\u003c/button>\n        \u003cp class=\"log-or\">OR\u003c/p>\n        \u003cp>Want to add more?\u003c/p>\n        \u003cbutton type=\"button\" class=\"log-link\" onclick=\"Logger.addExercise()\">Add Exercise\u003c/button>\n      \u003c/div>`;\n  }\n\n  function feelHtml(s) {\n    const f = s.feel || {};\n    const n = f.durationMin || 1;\n    return `\n      \u003cdiv class=\"log-feel\">\n        \u003ch1>How did this session feel?\u003c/h1>\n        \u003cdiv class=\"log-intensity\">\n          ${[1, 2, 3, 4, 5].map((i) => `\u003cbutton type=\"button\" class=\"${f.intensity === i ? 'on' : ''}\" onclick=\"Logger.feelIntensity(${i})\">${i}\u003c/button>`).join('')}\n        \u003c/div>\n        \u003cdiv class=\"eyebrow\">Training Duration\u003c/div>\n        \u003cdiv class=\"log-dur\">\n          \u003cbutton type=\"button\" onclick=\"Logger.feelMins(-1)\">−\u003c/button>\n          \u003cstrong>${n} min\u003c/strong>\n          \u003cbutton type=\"button\" onclick=\"Logger.feelMins(1)\">+\u003c/button>\n        \u003c/div>\n        \u003cinput class=\"log-ex-note\" placeholder=\"Session reflection\" value=\"${esc(f.note || '')}\" onchange=\"Logger.feelNote(this.value)\">\n        \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.finish()\">Finish Session\u003c/button>\n      \u003c/div>`;\n  }\n\n  function summaryHtml(s) {\n    const st = HybridSession.summaryStats(s);\n    const title = s.title || 'Completed session';\n    return `\n      \u003cdiv class=\"log-sum\">\n        \u003cp class=\"log-kicker\">${esc(s.date)}\u003c/p>\n        \u003ch2 class=\"log-title\">${esc(title)}\u003c/h2>\n        \u003cdiv class=\"log-stat\">\u003cspan>Exercises\u003c/span>\u003cb>${st.exercises}\u003c/b>\u003c/div>\n        \u003cdiv class=\"log-stat\">\u003cspan>Sets\u003c/span>\u003cb>${st.sets}\u003c/b>\u003c/div>\n        \u003cdiv class=\"log-stat\">\u003cspan>Reps\u003c/span>\u003cb>${st.reps}\u003c/b>\u003c/div>\n        \u003cdiv class=\"log-stat\">\u003cspan>Blocks\u003c/span>\u003cb>${st.blocksDone}/${st.blocksTotal}\u003c/b>\u003c/div>\n        \u003cdiv class=\"log-stat\">\u003cspan>Minutes\u003c/span>\u003cb>${st.minutes}\u003c/b>\u003c/div>\n        \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.close()\">Close\u003c/button>\n      \u003c/div>`;\n  }\n\n  function padHtml() {\n    if (!pad) return '';\n    const unit = (session().unit || 'kg') === 'lb' ? 'lb' : 'kg';\n    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'];\n    const keyBtns = keys.map((k) => `\u003cbutton type=\"button\" onclick=\"Logger.padKey('${k}')\">${k}\u003c/button>`).join('');\n    return `\n      \u003cdiv class=\"log-pad\">\n        \u003cdiv class=\"log-pad-head\">\n          \u003cdiv>\n            \u003cspan class=\"log-pad-val\">${esc(pad.buffer || '0')}\u003c/span>\n            ${pad.field === 'kg' ? `\u003cspan class=\"log-unit\">\n              \u003cbutton type=\"button\" class=\"${unit === 'kg' ? 'on' : ''}\" onclick=\"Logger.unit('kg')\">Kg\u003c/button>\n              \u003cbutton type=\"button\" class=\"${unit === 'lb' ? 'on' : ''}\" onclick=\"Logger.unit('lb')\">Lb\u003c/button>\n            \u003c/span>` : `\u003cspan style=\"margin-left:8px;opacity:.6\">${esc((root.HybridLibrary && HybridLibrary.trackLabel(pad.field)) || pad.field).toUpperCase()}\u003c/span>`}\n          \u003c/div>\n          \u003cbutton type=\"button\" onclick=\"Logger.closePad()\">⌄\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"log-keys\">\n          ${keyBtns}\n          \u003cdiv class=\"log-pad-side\" style=\"grid-column:4;grid-row:1 / span 4\">\n            \u003cbutton type=\"button\" class=\"blue\" onclick=\"Logger.padLog()\">Log\u003c/button>\n            \u003cbutton type=\"button\" class=\"blue\" onclick=\"Logger.padAutofill()\">Autofill\u003c/button>\n            \u003cbutton type=\"button\" class=\"log-miss${pad.miss ? ' on' : ''}\" onclick=\"Logger.padMiss()\">Miss\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n  }\n\n  function sheetHtml(s) {\n    if (!sheet) return '';\n    if (sheet === 'goal') {\n      return `\n        \u003cdiv class=\"log-sheet\" onclick=\"if(event.target===this)Logger.sheet(null)\">\n          \u003cdiv class=\"log-sheet-card\">\n            \u003ch2>Set a new goal\u003c/h2>\n            \u003cp>Track a target for this lift. Hybrid keeps this on the phone for now.\u003c/p>\n            \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.sheet(null)\">Got it\u003c/button>\n          \u003c/div>\n        \u003c/div>`;\n    }\n    const page = HybridSession.currentPage(s);\n    const cur = (s.workingMax && s.workingMax[page.id]) || '';\n    return `\n      \u003cdiv class=\"log-sheet\" onclick=\"if(event.target===this)Logger.sheet(null)\">\n        \u003cdiv class=\"log-sheet-card\">\n          \u003ch2>Working max\u003c/h2>\n          \u003cinput id=\"wmInput\" type=\"number\" inputmode=\"decimal\" value=\"${esc(cur)}\" placeholder=\"kg\">\n          \u003cbutton type=\"button\" class=\"log-primary\" onclick=\"Logger.saveWm()\">Save\u003c/button>\n        \u003c/div>\n      \u003c/div>`;\n  }\n\n  function blockHtml(s) {\n    const page = HybridSession.currentPage(s);\n    const log = s.logs[page.id] || { completed: false, sets: [], note: '' };\n    let body = '';\n    if (page.logMode === 'complete') body = completeHtml(s, page, log);\n    else if (page.logMode === 'doneHub') body = hubHtml();\n    else if (page.logMode === 'superset') {\n      const members = (page.members || []).map((m) => `\n        \u003csection class=\"log-ss-member\">\n          \u003ch2 class=\"log-title\">${esc(m.letter)}. ${esc(m.title)}\u003c/h2>\n          ${m.logMode === 'kg' ? sideHtml(s, m) : ''}\n          ${supportsSetFlow(m) ? activeSetHtml(s, m, s.logs[m.id] || { sets: [], note: '' }) : tableHtml(s, m, s.logs[m.id] || { sets: [], note: '' })}\n        \u003c/section>`).join('');\n      body = `\n        \u003cp class=\"log-kicker\">${esc(page.letter)}. ${esc(page.section)}\u003c/p>\n        \u003cdiv class=\"log-ss\">${members}\u003c/div>`;\n    } else {\n      body = `\n        \u003cp class=\"log-kicker\">${esc(page.letter)}. ${esc(page.section)}\u003c/p>\n        \u003ch2 class=\"log-title\">${esc(page.title)}\u003c/h2>\n        ${page.logMode === 'kg' ? sideHtml(s, page) : ''}\n        ${supportsSetFlow(page) ? activeSetHtml(s, page, log, true) : tableHtml(s, page, log)}`;\n    }\n    return `${headerHtml(s)}\u003cdiv class=\"log-body\">${body}\u003c/div>${supportsSetFlow(page) ? setActionHtml(s,page) : \"\"}${barHtml(s)}${padHtml()}${sheetHtml(s)}${timerOverlayHtml()}`;\n  }\n\n  function paint() {\n    const el = document.getElementById('logger');\n    if (!el) return;\n    const s = session();\n    if (!s || !root.S.loggerOpen) {\n      el.classList.add('hidden');\n      return;\n    }\n    el.classList.remove('hidden');\n    document.getElementById('shell').classList.add('logger-open');\n    let inner = '';\n    if (s.phase === 'quote') inner = quoteHtml();\n    else if (s.phase === 'coach') inner = coachHtml();\n    else if (s.phase === 'feel') inner = feelHtml(s);\n    else if (s.phase === 'summary') inner = summaryHtml(s);\n    else inner = blockHtml(s);\n    el.innerHTML = `\u003cdiv class=\"log-screen\">${toast ? `\u003cdiv c
